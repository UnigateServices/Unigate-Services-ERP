<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powered by UNI GATE</title>

  <script>
    // تطبيق آخر ثيم/لغة محفوظة قبل رسم الصفحة لتجنّب "الوميض" البصري
    (function() {
      try {
        var theme = localStorage.getItem('fx_theme') || 'dark';
        var lang = localStorage.getItem('fx_lang') || 'ar';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();

    // رابط التطبيق مضمَّن من السيرفر
    var APP_URL = '<?!= getAppUrl(); ?>';
    var LOGIN_AUDIENCE = 'all';
  </script>

  <?!= include('GlobalCss'); ?>
  <?!= include('LayoutCss'); ?>
  <?!= include('SelectCss'); ?>
</head>
<body>

  <div class="auth-page">

    <!-- أدوات التحكم العائمة: الوضع الليلي/النهاري + اللغة -->
    <div class="auth-toolbar">
      <button class="nav-btn" id="loginThemeBtn" title="الوضع الليلي/النهاري" data-i18n-title="login.themeToggle">
        <svg viewBox="0 0 24 24" id="loginThemeIcon"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <button class="nav-btn" id="loginLangBtn" title="تغيير اللغة" data-i18n-title="login.langToggle">
        <span id="loginLangLabel" style="font-size:12px;font-weight:700;">EN</span>
      </button>
    </div>

    <div class="card auth-card">

      <div class="auth-brand">
        <div class="auth-logo-icon" id="loginBrandMark"></div>
        <div class="auth-brand-name brand-powered" aria-label="Powered by UNI GATE">
          <span class="brand-powered-by">Powered by</span>
          <strong class="brand-product">UNI GATE</strong>
        </div>
        <div class="auth-brand-sub" data-i18n="login.subtitle">نظام الإدارة المالية</div>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="usernameTrigger" data-i18n="login.username">اسم المستخدم</label>
          <div class="app-select" id="usernameSelectWrap">
            <select id="username" autocomplete="off" required>
              <option value="" disabled selected data-i18n="login.loadingNames">جاري تحميل الأسماء...</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password" data-i18n="login.password">كلمة المرور</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              data-i18n="login.passwordPlaceholder"
              placeholder="أدخل كلمة المرور"
              required
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              data-lpignore="true"
              data-1p-ignore
              data-bwignore="true">
            <button type="button" class="input-icon-btn" id="eyeToggle" title="عرض كلمة المرور" data-i18n-title="login.showPassword">
              <svg viewBox="0 0 24 24" id="eyeIcon"><path d="M12 6c-4.42 0-8.27 2.94-9.83 7 1.56 4.06 5.41 7 9.83 7s8.27-2.94 9.83-7C20.27 8.94 16.42 6 12 6zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary auth-submit-btn">
          <span id="loginBtnText" data-i18n="login.submit">تسجيل الدخول</span>
        </button>

        <div id="loginMessage" class="alert"></div>
      </form>

      <div class="auth-footer">
        <span class="auth-footer-brand" aria-label="Powered by UNI GATE">Powered by UNI GATE</span>
        &copy; <span id="currentYear"></span>
        — <span data-i18n="login.footer">جميع الحقوق محفوظة</span>
      </div>
    </div>
  </div>

  <?!= include('GlobalJs'); ?>
  <?!= include('Translations'); ?>
  <?!= include('SelectJs'); ?>
  <?!= include('LoginJs'); ?>

</body>
</html>
