<script>
  /**
   * قسم التقارير — معرض جاهز، تشغيل عند الطلب، KPI + رسوم + جدول، تصدير وتفريغ
   */
  var REPORT_DEFS = [
    { id: 'funds', titleKey: 'report.funds', descKey: 'report.fundsDesc', filters: ['dates', 'status', 'fund', 'currency'], icon: 'M3 13h2v8H3v-8zm4-6h2v14H7V7zm4-4h2v18h-2V3zm4 8h2v10h-2V11zm4-3h2v13h-2V8z' },
    { id: 'borrower', titleKey: 'report.borrower', descKey: 'report.borrowerDesc', filters: ['dates', 'status', 'borrower', 'currency'], icon: 'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z' },
    { id: 'income', titleKey: 'report.income', descKey: 'report.incomeDesc', filters: ['dates', 'status', 'project', 'fund', 'currency'], icon: 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z' },
    { id: 'outcome', titleKey: 'report.outcome', descKey: 'report.outcomeDesc', filters: ['dates', 'status', 'project', 'fund', 'currency'], icon: 'M19 13H5v-2h14v2z' },
    { id: 'exchange', titleKey: 'report.exchange', descKey: 'report.exchangeDesc', filters: ['dates', 'status', 'fund', 'exType'], icon: 'M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z' },
    { id: 'transfer', titleKey: 'report.transfer', descKey: 'report.transferDesc', filters: ['dates', 'status', 'fromFund', 'toFund', 'currency', 'borrower'], icon: 'M9 3L5 6.99h3V14h2V6.99h3L9 3zm7 14.01V10h-2v7.01h-3L15 21l4-3.99h-3z' },
    { id: 'advances', titleKey: 'report.advances', descKey: 'report.advancesDesc', filters: ['dates', 'status', 'borrower', 'advType', 'project', 'currency'], icon: 'M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z' },
    { id: 'overview', titleKey: 'report.overview', descKey: 'report.overviewDesc', filters: ['dates', 'status', 'currency'], icon: 'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z' }
  ];

  var reportUiMode = 'employee'; // employee | system
  var selectedReportByMode = { employee: 'funds', system: 'funds' };
  var lastReportByMode = { employee: null, system: null };
  var lastReportResult = null;
  var reportCharts = [];
  var systemEmployeesLoaded = false;

  function reportEls() {
    if (reportUiMode === 'system') {
      return {
        gallery: 'sysReportsGallery',
        filters: 'sysReportFilters',
        result: 'sysReportResult',
        message: 'sysReportMessage',
        activeTitle: 'sysReportActiveTitle',
        btnRun: 'btnSysReportRun',
        exportRoot: 'sysReportExportRoot',
        privacy: 'sysReportsPrivacy',
        cardSelector: '#sysReportsGallery .report-card'
      };
    }
    return {
      gallery: 'reportsGallery',
      filters: 'reportFilters',
      result: 'reportResult',
      message: 'reportMessage',
      activeTitle: 'reportActiveTitle',
      btnRun: 'btnReportRun',
      exportRoot: 'reportExportRoot',
      privacy: 'reportsPrivacy',
      cardSelector: '#reportsGallery .report-card'
    };
  }

  function $r(key) {
    return document.getElementById(reportEls()[key]);
  }

  function selectedReportId() {
    return selectedReportByMode[reportUiMode] || 'funds';
  }

  function setReportUiMode(mode) {
    reportUiMode = (mode === 'system') ? 'system' : 'employee';
    lastReportResult = lastReportByMode[reportUiMode];
  }

  function initReportsSection() {
    setReportUiMode('employee');
    renderReportsGallery();
    selectReportCard('funds', true);
  }

  var systemReportsInitialized = false;

  function initSystemReportsSection() {
    if (typeof APP_INTERFACE !== 'undefined' && APP_INTERFACE !== 'supervisor' && !AppLayout.isSupervisor()) return;
    setReportUiMode('system');
    if (!systemReportsInitialized) {
      renderReportsGallery();
      // فلاتر خفيفة أولاً؛ تعزيز القوائم بعد إطار رسم
      selectReportCard(selectedReportId(), true);
      systemReportsInitialized = true;
    }
    setTimeout(function() { loadSystemReportEmployees(); }, 0);
  }

  function ensureSystemReportsReady() {
    initSystemReportsSection();
  }

  function renderReportsGallery() {
    var host = $r('gallery');
    if (!host) return;
    var current = selectedReportId();
    host.innerHTML = REPORT_DEFS.map(function(def) {
      var icon = def.icon
        ? '<span class="report-card-icon"><svg viewBox="0 0 24 24"><path d="' + def.icon + '"/></svg></span>'
        : '';
      return '<button type="button" class="report-card' + (def.id === current ? ' active' : '') +
        '" data-report="' + def.id + '" onclick="selectReportCard(\'' + def.id + '\')">' +
        '<div class="report-card-top">' + icon +
        '<h4 data-i18n="' + def.titleKey + '">' + AppI18n.t(def.titleKey) + '</h4></div>' +
        '<p data-i18n="' + def.descKey + '">' + AppI18n.t(def.descKey) + '</p></button>';
    }).join('');
  }

  function selectReportCard(reportId, skipClear) {
    selectedReportByMode[reportUiMode] = reportId;
    Array.prototype.forEach.call(document.querySelectorAll(reportEls().cardSelector), function(card) {
      card.classList.toggle('active', card.getAttribute('data-report') === reportId);
    });
    var def = REPORT_DEFS.find(function(d) { return d.id === reportId; });
    var titleEl = $r('activeTitle');
    if (titleEl && def) {
      titleEl.setAttribute('data-i18n', def.titleKey);
      titleEl.textContent = AppI18n.t(def.titleKey);
    }
    buildReportFilters(def);
    if (!skipClear) {
      var hadResult = !!lastReportByMode[reportUiMode];
      clearReportResult(true);
      if (hadResult) AppUtils.showMessageKey(reportEls().message, 'report.switchedCleared', 'info');
    }
    var panel = document.querySelector(
      reportUiMode === 'system'
        ? '.content-panel[data-section="system-reports"]'
        : '.content-panel[data-section="reports"]'
    );
    if (panel) AppI18n.apply(panel);
    else AppI18n.apply();
  }

  function defaultDateRange() {
    var to = AppUtils.todayInputValue();
    var d = new Date();
    d.setDate(d.getDate() - 30);
    var yyyy = d.getFullYear();
    var mm = (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
    var dd = (d.getDate() < 10 ? '0' : '') + d.getDate();
    return { from: yyyy + '-' + mm + '-' + dd, to: to };
  }

  function formatDateInput_(d) {
    var yyyy = d.getFullYear();
    var mm = (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
    var dd = (d.getDate() < 10 ? '0' : '') + d.getDate();
    return yyyy + '-' + mm + '-' + dd;
  }

  function reportFiltersStorageKey_() {
    return 'ug_report_filters_' + reportUiMode + '_' + selectedReportId();
  }

  function loadSavedReportFilters_() {
    try {
      var raw = localStorage.getItem(reportFiltersStorageKey_());
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function saveReportFilters_() {
    try {
      localStorage.setItem(reportFiltersStorageKey_(), JSON.stringify(collectReportFilters()));
    } catch (e) {}
  }

  function applyReportDatePreset(preset) {
    var to = new Date();
    var from = new Date();
    if (preset === 'today') {
      /* same day */
    } else if (preset === 'week') {
      from.setDate(from.getDate() - 6);
    } else if (preset === 'month') {
      from.setDate(from.getDate() - 29);
    } else if (preset === 'year') {
      from = new Date(to.getFullYear(), 0, 1);
    } else {
      return;
    }
    var fromEl = document.getElementById(filterId('trxFrom'));
    var toEl = document.getElementById(filterId('trxTo'));
    if (fromEl) fromEl.value = formatDateInput_(from);
    if (toEl) toEl.value = formatDateInput_(to);
    var host = $r('filters');
    if (host) {
      Array.prototype.forEach.call(host.querySelectorAll('.report-date-presets button'), function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-preset') === preset);
      });
    }
    saveReportFilters_();
  }

  function reportSelectHtml(id, options, placeholderKey, multi) {
    var html = '<div class="app-select"><select id="' + id + '"' + (multi ? ' multiple' : '') + '>';
    if (placeholderKey) {
      var ph = (typeof AppI18n !== 'undefined') ? AppI18n.t(placeholderKey) : 'الكل';
      html += '<option value="" data-i18n="' + placeholderKey + '">' + ph + '</option>';
    }
    options.forEach(function(opt) {
      if (typeof opt === 'string') html += '<option value="' + opt + '">' + opt + '</option>';
      else {
        var label = (opt.i18n && typeof AppI18n !== 'undefined') ? AppI18n.t(opt.i18n) : opt.value;
        html += '<option value="' + opt.value + '"' +
          (opt.i18n ? ' data-i18n="' + opt.i18n + '"' : '') +
          (opt.selected ? ' selected' : '') + '>' + label + '</option>';
      }
    });
    html += '</select></div>';
    return html;
  }

  function filterId(base) {
    return (reportUiMode === 'system' ? 'srf-' : 'rf-') + base;
  }

  function loadSystemReportEmployees() {
    if (systemEmployeesLoaded) return;
    google.script.run
      .withSuccessHandler(function(list) {
        systemEmployeesLoaded = true;
        window.__systemReportEmployees = list || [];
        var def = REPORT_DEFS.find(function(d) { return d.id === selectedReportId(); });
        if (reportUiMode === 'system' && def) buildReportFilters(def);
      })
      .getOpeningBalanceEmployees(AppLayout.getSession());
  }

  function buildReportFilters(def) {
    var host = $r('filters');
    if (!host || !def) return;
    var range = defaultDateRange();
    var html = '';
    var need = def.filters || [];
    var p = filterId;

    if (reportUiMode === 'system') {
      var empOpts = (window.__systemReportEmployees || []).map(function(name) {
        return { value: name };
      });
      html += '<div class="form-group"><label data-i18n="log.col.employee">الموظف</label>' +
        reportSelectHtml(p('employee'), empOpts, 'select.all', true) + '</div>';
    }

    if (need.indexOf('dates') !== -1) {
      html += '<div class="report-date-presets">' +
        '<button type="button" data-preset="today" onclick="applyReportDatePreset(\'today\')" data-i18n="report.preset.today">اليوم</button>' +
        '<button type="button" data-preset="week" onclick="applyReportDatePreset(\'week\')" data-i18n="report.preset.week">أسبوع</button>' +
        '<button type="button" data-preset="month" onclick="applyReportDatePreset(\'month\')" data-i18n="report.preset.month">شهر</button>' +
        '<button type="button" data-preset="year" onclick="applyReportDatePreset(\'year\')" data-i18n="report.preset.year">هذه السنة</button>' +
        '</div>';
      html += '<div class="form-group"><label data-i18n="log.filter.sysFrom">تاريخ الإدخال من</label><input type="date" id="' + p('trxFrom') + '" value="' + range.from + '"></div>';
      html += '<div class="form-group"><label data-i18n="log.filter.sysTo">تاريخ الإدخال إلى</label><input type="date" id="' + p('trxTo') + '" value="' + range.to + '"></div>';
    }
    if (need.indexOf('status') !== -1) {
      html += '<div class="form-group"><label data-i18n="log.col.status">الحالة</label>' +
        reportSelectHtml(p('status'), [
          { value: 'ALL', i18n: 'select.all', selected: true },
          { value: 'مكتملة', i18n: 'status.completed' },
          { value: 'بانتظار الموافقة', i18n: 'status.pending' },
          { value: 'محذوفة', i18n: 'status.deleted' },
          { value: 'مرفوضة', i18n: 'status.rejected' }
        ], null, true) + '</div>';
    }
    if (need.indexOf('fund') !== -1) {
      html += '<div class="form-group"><label data-i18n="form.fund">الصندوق</label>' +
        reportSelectHtml(p('fund'), FORM_CONST.FUNDS_VAULT_SHAM_BANK || FORM_CONST.FUNDS_VAULT_SHAM, 'select.all', true) + '</div>';
    }
    if (need.indexOf('fromFund') !== -1) {
      html += '<div class="form-group"><label data-i18n="form.fromFund">من</label>' +
        reportSelectHtml(p('fromFund'), FORM_CONST.FUNDS_ALL, 'select.all', true) + '</div>';
    }
    if (need.indexOf('toFund') !== -1) {
      html += '<div class="form-group"><label data-i18n="form.toFund">إلى</label>' +
        reportSelectHtml(p('toFund'), FORM_CONST.FUNDS_ALL, 'select.all', true) + '</div>';
    }
    if (need.indexOf('currency') !== -1) {
      html += '<div class="form-group"><label data-i18n="form.currency">العملة</label>' +
        reportSelectHtml(p('currency'), [
          { value: 'دولار', i18n: 'currency.usd' },
          { value: 'ليرة سورية', i18n: 'currency.syp' }
        ], 'select.all', true) + '</div>';
    }
    if (need.indexOf('project') !== -1) {
      var projectOpts = (FORM_CONST.PROJECTS_REPORTS && FORM_CONST.PROJECTS_REPORTS.length)
        ? FORM_CONST.PROJECTS_REPORTS
        : (FORM_CONST.PROJECTS || []).concat([{ value: 'رأس مال', i18n: 'project.capital' }]);
      html += '<div class="form-group"><label data-i18n="form.project">المشروع</label>' +
        reportSelectHtml(p('project'), projectOpts, 'select.all', true) + '</div>';
    }
    if (need.indexOf('borrower') !== -1) {
      html += '<div class="form-group"><label data-i18n="form.borrower">المستلف</label>' +
        reportSelectHtml(p('borrower'), FORM_CONST.BORROWERS, 'select.all', true) + '</div>';
    }
    if (need.indexOf('exType') !== -1) {
      html += '<div class="form-group"><label data-i18n="form.exchangeType">نوع التصريف</label>' +
        reportSelectHtml(p('exType'), [
          { value: 'شراء', i18n: 'exchange.buy' },
          { value: 'بيع', i18n: 'exchange.sell' }
        ], 'select.all', true) + '</div>';
    }
    if (need.indexOf('advType') !== -1) {
      html += '<div class="form-group"><label data-i18n="form.advType">نوع العملية</label>' +
        reportSelectHtml(p('advType'), [
          { value: 'صادر', i18n: 'sidebar.outcome' },
          { value: 'تصريف', i18n: 'sidebar.exchange' }
        ], 'select.all', true) + '</div>';
    }
    html += '<p class="reports-hint" style="grid-column:1/-1;margin:0;" data-i18n="report.multiHint">اضغط لاختيار قيمة أو أكثر — تظهر علامة ✓ بجانب المختار.</p>';

    host.innerHTML = html;
    ['employee', 'status', 'fund', 'fromFund', 'toFund', 'currency', 'project', 'borrower', 'exType', 'advType'].forEach(function(base) {
      var id = p(base);
      AppSelect.destroy(id);
      if (document.getElementById(id)) AppSelect.enhance(id);
    });

    // استعادة آخر فلاتر محفوظة لهذا التقرير
    var saved = loadSavedReportFilters_();
    if (saved) {
      var savedFrom = saved.sysDateFrom || saved.trxDateFrom;
      var savedTo = saved.sysDateTo || saved.trxDateTo;
      if (savedFrom && document.getElementById(p('trxFrom'))) document.getElementById(p('trxFrom')).value = savedFrom;
      if (savedTo && document.getElementById(p('trxTo'))) document.getElementById(p('trxTo')).value = savedTo;
      function restoreMulti(base, raw) {
        var el = document.getElementById(p(base));
        if (!el || raw == null || raw === '') return;
        var parts = String(raw).split('|').filter(Boolean);
        if (!el.multiple) {
          el.value = parts[0] || raw;
          return;
        }
        Array.prototype.forEach.call(el.options, function(opt) {
          opt.selected = parts.indexOf(opt.value) !== -1 || (raw === 'ALL' && opt.value === 'ALL');
        });
        AppSelect.destroy(el.id);
        AppSelect.enhance(el.id);
      }
      restoreMulti('employee', saved.employee);
      restoreMulti('status', saved.status);
      restoreMulti('fund', saved.fund);
      restoreMulti('fromFund', saved.fromFund);
      restoreMulti('toFund', saved.toFund);
      restoreMulti('currency', saved.currency);
      restoreMulti('project', saved.project);
      restoreMulti('borrower', saved.borrower);
      restoreMulti('exType', saved.exType);
      restoreMulti('advType', saved.advType);
    }

    var fromEl = document.getElementById(p('trxFrom'));
    var toEl = document.getElementById(p('trxTo'));
    if (fromEl) fromEl.addEventListener('change', saveReportFilters_);
    if (toEl) toEl.addEventListener('change', saveReportFilters_);
  }

  function collectReportFilters() {
    function val(base) {
      var el = document.getElementById(filterId(base));
      return el ? el.value : '';
    }
    function valMulti(base) {
      var el = document.getElementById(filterId(base));
      if (!el) return '';
      if (el.multiple) {
        var vals = Array.from(el.selectedOptions).map(function(o) { return o.value; })
          .filter(function(v) { return !!v; });
        if (vals.indexOf('ALL') !== -1) return base === 'status' ? 'ALL' : '';
        return vals.length ? vals.join('|') : '';
      }
      return el.value || '';
    }
    return {
      scope: reportUiMode === 'system' ? 'system' : 'employee',
      employee: valMulti('employee'),
      // نطاق التقرير التلقائي = تاريخ الإدخال
      sysDateFrom: val('trxFrom'),
      sysDateTo: val('trxTo'),
      status: valMulti('status') || 'ALL',
      fund: valMulti('fund'),
      fromFund: valMulti('fromFund'),
      toFund: valMulti('toFund'),
      currency: valMulti('currency'),
      project: valMulti('project'),
      borrower: valMulti('borrower'),
      exType: valMulti('exType'),
      advType: valMulti('advType')
    };
  }

  function setReportExportEnabled(on) {
    var prefix = reportUiMode === 'system' ? 'btnSysReport' : 'btnReport';
    ['Pdf', 'Excel', 'Image', 'Print'].forEach(function(suffix) {
      var btn = document.getElementById(prefix + suffix);
      if (btn) btn.disabled = !on;
    });
  }

  function destroyReportCharts() {
    reportCharts.forEach(function(c) {
      try { c.destroy(); } catch (e) {}
    });
    reportCharts = [];
  }

  function runSelectedReport() {
    // مزامنة الوضع حسب القسم الظاهر (تقارير شخصية / تقارير النظام)
    if (AppLayout.currentSection === 'system-reports') setReportUiMode('system');
    else if (AppLayout.currentSection === 'reports') setReportUiMode('employee');

    var filters = collectReportFilters();
    saveReportFilters_();
    var msgId = reportEls().message;
    var btnId = reportEls().btnRun;
    if (!filters.sysDateFrom || !filters.sysDateTo) {
      AppUtils.showMessageKey(msgId, 'report.err.dateRequired', 'danger');
      return;
    }
    var host = $r('result');
    host.innerHTML = '<div class="report-empty-state">' + AppI18n.t('report.running') + '</div>';
    AppUtils.hideMessage(msgId);
    setReportExportEnabled(false);
    destroyReportCharts();
    AppUtils.setLoadingState(btnId, true, AppI18n.t('report.running'));

    google.script.run
      .withSuccessHandler(function(res) {
        AppUtils.setLoadingState(btnId, false, '', AppI18n.t('report.run'));
        if (AppLayout.handleAuthResult(res)) return;
        if (!res.success) {
          AppUtils.showMessageKey(msgId, res.messageKey || 'report.err.unknown', 'danger');
          host.innerHTML = '<div class="report-empty-state">' + AppI18n.t(res.messageKey || 'report.noData') + '</div>';
          lastReportByMode[reportUiMode] = null;
          lastReportResult = null;
          return;
        }
        lastReportByMode[reportUiMode] = res;
        lastReportResult = res;
        renderReportResult(res);
        setReportExportEnabled(!!(res.rows && res.rows.length));
        if (res.meta && res.meta.truncated) {
          AppUtils.showMessageKey(msgId, 'report.truncated', 'info');
        }
      })
      .withFailureHandler(function() {
        AppUtils.setLoadingState(btnId, false, '', AppI18n.t('report.run'));
        AppUtils.showMessageKey(msgId, 'form.err.connection', 'danger');
        host.innerHTML = '<div class="report-empty-state" data-i18n="form.err.connection">' + AppI18n.t('form.err.connection') + '</div>';
      })
      .generateReport(AppLayout.getSession(), selectedReportId(), filters);
  }

  function formatReportCell(key, value) {
    if (value === null || value === undefined || value === '') return '—';
    if (key === 'amount' || key === 'rawAmount' || key === 'total' || key === 'exAmt' || key === 'exRate' || key === 'qty') {
      return AppUtils.formatSignedNumberHtml(value);
    }
    if (key === 'status') {
      if (value === 'مكتملة') return AppI18n.t('status.completed');
      if (value === 'بانتظار الموافقة') return AppI18n.t('status.pending');
      if (value === 'محذوفة' || value === 'محذوف') return AppI18n.t('status.deleted');
      if (value === 'مرفوضة') return AppI18n.t('status.rejected');
    }
    if (key === 'typeName' || key === 'advType') {
      if (value === 'وارد') return AppI18n.t('sidebar.income');
      if (value === 'صادر') return AppI18n.t('sidebar.outcome');
      if (value === 'تصريف') return AppI18n.t('sidebar.exchange');
      if (value === 'تحويل') return AppI18n.t('sidebar.transfer');
      if (value === 'سلفة') return AppI18n.t('sidebar.advances');
    }
    if (key === 'currency' || key === 'paidCur' || key === 'recCur') {
      if (typeof currencyLabel === 'function' && String(value).indexOf('→') === -1) return currencyLabel(value);
    }
    if (key === 'fund' || key === 'fromFund' || key === 'toFund' || key === 'fundRoute') {
      var fr = String(value);
      if (fr.indexOf('→') !== -1) {
        return fr.split('→').map(function(part) {
          var p = part.trim();
          return (typeof displayFund === 'function') ? displayFund(p) : p;
        }).join(' → ');
      }
      if (typeof displayFund === 'function') return displayFund(value);
    }
    if ((key === 'borrower' || key === 'party') && typeof displayBorrower === 'function') {
      var partyLabel = displayBorrower(value);
      if (partyLabel && partyLabel !== '—' && partyLabel !== value) return partyLabel;
      // party قد يكون مصدر نقد / مسلّم وليس مستلفاً
      if (key === 'party' && (value === '-' || !value)) return '—';
      if (key === 'borrower') return partyLabel;
    }
    if (key === 'project' && typeof displayProject === 'function') return displayProject(value);
    if ((key === 'exType' || key === 'subtype') && typeof displayExType === 'function') {
      if (value === 'شراء' || value === 'بيع') return displayExType(value);
      if (value === 'صادر') return AppI18n.t('sidebar.outcome');
      if (value === 'تصريف') return AppI18n.t('sidebar.exchange');
      if (value === 'تحويل') return AppI18n.t('sidebar.transfer');
    }
    return String(value);
  }

  function renderReportResult(res) {
    var host = $r('result');
    destroyReportCharts();

    if (!res.rows || !res.rows.length) {
      host.innerHTML = '<div class="report-empty-state">' + AppI18n.t('report.noData') + '</div>';
      return;
    }

    var scopeLabel = (res.meta && res.meta.scope === 'system')
      ? AppI18n.t('report.systemData')
      : AppI18n.t('report.myDataOnly');
    var empLabel = (res.meta && res.meta.employee === 'ALL')
      ? AppI18n.t('monitor.allEmployees')
      : (res.meta.employee || '');

    var html = '<div class="report-meta-line">' +
      AppI18n.t(res.meta.titleKey) + ' · ' + AppUtils.escapeHtml(res.meta.generatedAt) +
      ' · ' + res.meta.rowCount + ' · ' + scopeLabel +
      (empLabel ? ' · ' + AppUtils.escapeHtml(empLabel) : '') + '</div>';

    html += '<div class="report-kpi-grid">';
    (res.kpis || []).forEach(function(kpi) {
      html += '<div class="report-kpi"><div class="label">' + AppI18n.t(kpi.labelKey) + '</div>' +
        '<div class="value">' + AppUtils.formatSignedNumberHtml(kpi.value) + '</div></div>';
    });
    html += '</div>';

    var chartPrefix = reportUiMode === 'system' ? 'sysReportChart' : 'reportChart';
    html += '<div class="report-charts">';
    (res.series || []).forEach(function(s, idx) {
      html += '<div class="report-chart-box" data-chart="' + AppUtils.escapeHtml(String(s.chart || 'bar')) + '"><h5>' + AppI18n.t(s.name) + '</h5>' +
        '<div class="report-chart-canvas-wrap" dir="ltr"><canvas id="' + chartPrefix + idx + '" dir="ltr"></canvas></div></div>';
    });
    html += '</div>';

    html += '<div class="report-table-wrap"><table class="report-table"><thead><tr>';
    (res.columns || []).forEach(function(col) {
      var numCls = isReportNumericCol_(col.key) ? ' class="is-num"' : '';
      html += '<th' + numCls + '>' + AppI18n.t(col.labelKey) + '</th>';
    });
    html += '</tr></thead><tbody>';
    res.rows.forEach(function(row, rIdx) {
      html += '<tr class="' + (rIdx % 2 ? 'is-alt' : '') + '">';
      (res.columns || []).forEach(function(col) {
        var cell = formatReportCell(col.key, row[col.key]);
        var numCls = isReportNumericCol_(col.key) ? ' class="is-num"' : '';
        html += '<td' + numCls + '>' + (String(cell).indexOf('<') === 0 ? cell : AppUtils.escapeHtml(cell)) + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';

    host.innerHTML = html;

    var seriesSnapshot = hydrateReportSeries_(res.series, res.rows);
    // تأخير بسيط حتى يستقر تخطيط الشبكة (مهم مع RTL)
    setTimeout(function() {
      mountReportCharts_(seriesSnapshot, chartPrefix);
    }, 50);
  }

  function normalizeSeriesList_(raw) {
    if (Array.isArray(raw)) return raw.slice();
    if (raw && typeof raw === 'object') {
      return Object.keys(raw).sort(function(a, b) {
        return (Number(a) || 0) - (Number(b) || 0);
      }).map(function(k) { return raw[k]; });
    }
    return [];
  }

  /** يعيد بناء سلاسل الرسم من الصفوف عند الحاجة — يضمن ظهور توزيع المستلف */
  function hydrateReportSeries_(seriesList, rows) {
    var list = Array.isArray(seriesList) ? seriesList : normalizeSeriesList_(seriesList);
    return list.map(function(s) {
      var out = {
        name: s.name,
        chart: String(s.chart || 'bar'),
        labels: normalizeSeriesList_(s.labels).map(function(x) { return x == null ? '' : String(x); }),
        values: normalizeSeriesList_(s.values).map(function(x) {
          var n = Number(x);
          return isFinite(n) ? n : 0;
        })
      };

      if (s.name === 'report.chart.byBorrower' && rows && rows.length) {
        var map = {};
        rows.forEach(function(row) {
          var k = row.borrower;
          if (k == null || k === '' || k === '-') k = '—';
          else k = String(k);
          var amt = Number(row.amount);
          if (!isFinite(amt)) amt = Number(row.total) || 0;
          map[k] = (map[k] || 0) + amt;
        });
        out.labels = Object.keys(map);
        out.values = out.labels.map(function(k) { return Math.round(map[k] * 100) / 100; });
        out.chart = 'doughnut';
      }

      // إذا وصلت التسميات فارغة والقيم موجودة — لا تترك الرسم أعمى
      if ((!out.labels.length || out.labels.every(function(l) { return !l; })) && out.values.length && rows && rows.length) {
        out.labels = out.values.map(function(_, i) { return String(i + 1); });
      }
      return out;
    });
  }

  function mountReportCharts_(seriesList, chartPrefix) {
    var palette = ['#00a86b', '#3b82f6', '#f5a623', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316', '#067a4f'];
    var tickColor = (document.documentElement.getAttribute('data-theme') === 'dark') ? '#a8b5af' : '#5a6b63';
    var gridColor = (document.documentElement.getAttribute('data-theme') === 'dark')
      ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
    var canvasBg = (document.documentElement.getAttribute('data-theme') === 'dark') ? '#1a221e' : '#ffffff';

    (seriesList || []).forEach(function(s, idx) {
      var canvas = document.getElementById(chartPrefix + idx);
      if (!canvas || typeof Chart === 'undefined') return;

      var wrap = canvas.parentNode;
      if (wrap) {
        wrap.setAttribute('dir', 'ltr');
        wrap.style.direction = 'ltr';
      }
      canvas.setAttribute('dir', 'ltr');
      canvas.style.direction = 'ltr';

      var labels = (s.labels || []).map(function(l) {
        return translateSeriesLabel(l == null ? '' : String(l));
      });
      var values = (s.values || []).map(function(v) {
        var n = Number(v);
        return isFinite(n) ? n : 0;
      });

      if (!labels.length || !values.length) {
        if (wrap) {
          wrap.innerHTML = '<div class="report-chart-empty">' + AppI18n.t('report.chartEmpty') + '</div>';
        }
        return;
      }
      if (values.length < labels.length) {
        while (values.length < labels.length) values.push(0);
      } else if (labels.length < values.length) {
        labels = labels.slice(0, values.length);
      }

      var rawType = String(s.chart || 'bar');
      var indexAxis = 'x';
      var type = rawType;
      if (rawType === 'hbar' || rawType === 'horizontalBar') {
        type = 'bar';
        indexAxis = 'y';
      }
      if (['bar', 'line', 'doughnut', 'pie', 'polarArea'].indexOf(type) === -1) type = 'bar';
      var isPieLike = type === 'doughnut' || type === 'pie';
      var isPolar = type === 'polarArea';
      var isBar = type === 'bar';
      var barColors = labels.map(function(_, i) { return palette[i % palette.length]; });

      var options = {
        indexAxis: indexAxis,
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 450 },
        layout: { padding: 8 },
        plugins: {
          legend: {
            display: isPieLike || isPolar,
            position: 'bottom',
            labels: { boxWidth: 12, font: { size: 11 }, color: tickColor, padding: 10 }
          },
          tooltip: { enabled: true }
        }
      };

      // تسميات قصيرة للمحور — التفاصيل الكاملة تبقى في التلميح (tooltip)
      var fullLabels = labels.slice();
      var axisLabels = labels.map(function(l) { return shortenChartAxisLabel_(l); });
      var tickBudget = type === 'line'
        ? (values.length > 40 ? 7 : (values.length > 20 ? 9 : 12))
        : (values.length > 16 ? 8 : 12);

      if (isPolar) {
        options.scales = {
          r: {
            beginAtZero: true,
            ticks: { backdropColor: 'transparent', color: tickColor, font: { size: 9 } },
            grid: { color: gridColor },
            pointLabels: { color: tickColor }
          }
        };
      } else if (!isPieLike) {
        var valueAxis = indexAxis === 'y' ? 'x' : 'y';
        var catAxis = indexAxis === 'y' ? 'y' : 'x';
        options.layout = {
          padding: {
            top: 8,
            right: 10,
            bottom: indexAxis === 'x' ? 18 : 8,
            left: 8
          }
        };
        options.scales = {};
        options.scales[valueAxis] = {
          beginAtZero: true,
          ticks: {
            font: { size: 10 },
            color: tickColor,
            maxTicksLimit: 8,
            callback: function(v) {
              var n = Number(v);
              if (!isFinite(n)) return v;
              try { return n.toLocaleString('en-US'); } catch (e) { return String(n); }
            }
          },
          grid: { color: gridColor }
        };
        options.scales[catAxis] = {
          ticks: {
            autoSkip: true,
            autoSkipPadding: 8,
            maxTicksLimit: tickBudget,
            maxRotation: indexAxis === 'x' ? 45 : 0,
            minRotation: 0,
            font: { size: 10 },
            color: tickColor
          },
          grid: { display: false }
        };
      }

      options.plugins.tooltip = {
        enabled: true,
        callbacks: {
          title: function(items) {
            if (!items || !items.length) return '';
            var i = items[0].dataIndex;
            return fullLabels[i] != null ? String(fullLabels[i]) : '';
          },
          label: function(ctx) {
            var n = Number(ctx.parsed && (ctx.parsed.y != null ? ctx.parsed.y : ctx.parsed.x));
            if (isPieLike || isPolar) n = Number(ctx.parsed);
            var num = isFinite(n) ? n.toLocaleString('en-US') : String(ctx.formattedValue || '');
            return (ctx.dataset && ctx.dataset.label ? ctx.dataset.label + ': ' : '') + num;
          }
        }
      };

      var pointR = 0;
      if (type === 'line') {
        if (values.length === 1) pointR = 5;
        else if (values.length <= 16) pointR = 3;
        else if (values.length <= 40) pointR = 2;
        else pointR = 0;
      }

      var dataset = {
        label: AppI18n.t(s.name),
        data: values,
        backgroundColor: (isPieLike || isPolar || isBar) ? barColors : 'rgba(0, 168, 107, 0.18)',
        borderColor: type === 'line' ? '#00a86b' : ((isPieLike || isPolar) ? canvasBg : '#00a86b'),
        borderWidth: type === 'line' ? 2.5 : ((isPieLike || isPolar) ? 2 : 1),
        fill: type === 'line',
        tension: type === 'line' ? 0.35 : 0,
        pointRadius: pointR,
        pointHoverRadius: type === 'line' ? 6 : 0,
        borderRadius: isBar ? 4 : 0,
        maxBarThickness: isBar ? 42 : undefined
      };

      try {
        var chart = new Chart(canvas, {
          type: type,
          data: { labels: axisLabels, datasets: [dataset] },
          options: options
        });
        reportCharts.push(chart);
        setTimeout(function() {
          try {
            chart.resize();
            chart.update('none');
          } catch (e2) {}
        }, 120);
      } catch (err) {
        if (wrap) {
          wrap.innerHTML = '<div class="report-chart-empty">' + AppI18n.t('report.chartEmpty') + '</div>';
        }
      }
    });
  }

  function isReportNumericCol_(key) {
    return key === 'amount' || key === 'rawAmount' || key === 'total' || key === 'exAmt' ||
      key === 'exRate' || key === 'qty' || key === 'seq';
  }

  /** اختصار تسمية محور الرسم لتفادي التداخل — التاريخ الكامل يظهر في التلميح */
  function shortenChartAxisLabel_(label) {
    var s = label == null ? '' : String(label).trim();
    if (!s) return '—';
    // "21/06/2026 · 3" → "21/06"
    var cut = s.indexOf(' · ');
    if (cut > 0) s = s.slice(0, cut);
    var p = s.split('/');
    if (p.length === 3 && p[0].length <= 2 && p[1].length <= 2) {
      return p[0] + '/' + p[1];
    }
    // مسارات صناديق طويلة
    if (s.length > 18) return s.slice(0, 16) + '…';
    return s;
  }

  function translateSeriesLabel(label) {
    var raw = label == null ? '' : String(label);
    if (!raw) return '—';
    // فقط المفاتيح المعروفة — أسماء المستلفين تُعرض كما هي
    if (raw === 'وارد') return AppI18n.t('sidebar.income');
    if (raw === 'صادر') return AppI18n.t('sidebar.outcome');
    if (raw === 'تصريف') return AppI18n.t('sidebar.exchange');
    if (raw === 'تحويل') return AppI18n.t('sidebar.transfer');
    if (raw === 'سلفة' || raw === 'السلف') return AppI18n.t('sidebar.advances');
    if (raw === 'شراء') return AppI18n.t('exchange.buy');
    if (raw === 'بيع') return AppI18n.t('exchange.sell');
    if (typeof displayProject === 'function') {
      var p = displayProject(raw);
      if (p && p !== raw) return p;
    }
    if (typeof displayFund === 'function') {
      var f = displayFund(raw);
      if (f && f !== raw && f !== '—') return f;
    }
    return raw;
  }

  function clearReportResult(silent) {
    if (AppLayout.currentSection === 'system-reports') setReportUiMode('system');
    else if (AppLayout.currentSection === 'reports') setReportUiMode('employee');
    lastReportByMode[reportUiMode] = null;
    lastReportResult = null;
    destroyReportCharts();
    setReportExportEnabled(false);
    var host = $r('result');
    if (host) host.innerHTML = '<div class="report-empty-state" data-i18n="report.empty">' + AppI18n.t('report.empty') + '</div>';
    var exportRoot = $r('exportRoot');
    if (exportRoot) exportRoot.innerHTML = '';
    if (!silent) AppUtils.showMessageKey(reportEls().message, 'report.cleared', 'info');
    else AppUtils.hideMessage(reportEls().message);
  }

  function captureReportChartImages(allowedIndexes) {
    var imgs = [];
    reportCharts.forEach(function(chart, idx) {
      if (allowedIndexes && allowedIndexes.indexOf(idx) === -1) return;
      try {
        var title = '';
        if (chart && chart.data && chart.data.datasets && chart.data.datasets[0]) {
          title = chart.data.datasets[0].label || '';
        }
        imgs.push({
          title: title,
          index: idx,
          dataUrl: chart.toBase64Image('image/png', 1)
        });
      } catch (e) {}
    });
    return imgs;
  }

  function buildExportDocumentHtml(res, chartImgs, opts) {
    chartImgs = chartImgs || [];
    opts = opts || { table: true };
    var html = '<div style="font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#1a1f1c;">';
    html += '<div style="text-align:center;border-bottom:2px dashed #c9d4ce;padding-bottom:12px;margin-bottom:14px;">';
    html += '<div style="font-size:16px;font-weight:800;color:#067a4f;direction:ltr;">' +
      AppUtils.escapeHtml((typeof AppBrand !== 'undefined') ? AppBrand.poweredBy : 'Powered by UNI GATE') + '</div>';
    html += '<div style="font-size:14px;font-weight:700;margin-top:6px;">' + AppUtils.escapeHtml(AppI18n.t(res.meta.titleKey)) + '</div>';
    var exportEmp = (res.meta.employee === 'ALL')
      ? AppI18n.t('monitor.allEmployees')
      : (res.meta.employee || '');
    html += '<div style="font-size:11px;color:#5a6b63;margin-top:4px;">' + AppUtils.escapeHtml(res.meta.generatedAt) +
      ' · ' + AppUtils.escapeHtml(exportEmp) +
      (res.meta.scope === 'system' ? ' · ' + AppUtils.escapeHtml(AppI18n.t('report.systemData')) : '') +
      '</div></div>';

    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">';
    (res.kpis || []).forEach(function(kpi) {
      html += '<div style="flex:1;min-width:120px;border:1px solid #cfe9db;background:#f3faf6;border-radius:8px;padding:10px;">' +
        '<div style="font-size:11px;color:#5a6b63;font-weight:700;">' + AppUtils.escapeHtml(AppI18n.t(kpi.labelKey)) + '</div>' +
        '<div style="font-size:16px;font-weight:800;">' + AppUtils.escapeHtml(String(kpi.value)) + '</div></div>';
    });
    html += '</div>';

    if (chartImgs.length) {
      html += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;">';
      chartImgs.forEach(function(img) {
        html += '<div style="flex:1;min-width:280px;border:1px solid #e4ebe7;border-radius:8px;padding:8px;background:#fafcfb;">';
        if (img.title) html += '<div style="font-size:11px;font-weight:800;color:#5a6b63;margin-bottom:6px;">' + AppUtils.escapeHtml(img.title) + '</div>';
        html += '<img src="' + img.dataUrl + '" style="width:100%;max-height:220px;object-fit:contain;" />';
        html += '</div>';
      });
      html += '</div>';
    }

    if (opts.table) {
      html += '<table style="width:100%;border-collapse:collapse;font-size:11px;">';
      html += '<thead><tr>';
      (res.columns || []).forEach(function(col) {
        html += '<th style="border-bottom:2px solid #067a4f;padding:6px;text-align:center;background:#f3faf6;">' +
          AppUtils.escapeHtml(AppI18n.t(col.labelKey)) + '</th>';
      });
      html += '</tr></thead><tbody>';
      (res.rows || []).forEach(function(row) {
        html += '<tr>';
        (res.columns || []).forEach(function(col) {
          var raw = formatReportCell(col.key, row[col.key]);
          var text = String(raw).replace(/<[^>]*>/g, '');
          html += '<td style="border-bottom:1px solid #e4ebe7;padding:6px;text-align:center;">' + AppUtils.escapeHtml(text) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    return html;
  }

  function prepareExportRoot(opts) {
    if (!lastReportResult || !(lastReportResult.rows && lastReportResult.rows.length)) return null;
    var root = $r('exportRoot');
    if (!root) return null;
    opts = opts || { table: true, chartIndexes: [] };
    var charts = (opts.chartIndexes && opts.chartIndexes.length)
      ? captureReportChartImages(opts.chartIndexes)
      : [];
    root.innerHTML = buildExportDocumentHtml(lastReportResult, charts, opts);
    return root;
  }

  function syncReportModeFromSection_() {
    if (AppLayout.currentSection === 'system-reports') setReportUiMode('system');
    else if (AppLayout.currentSection === 'reports') setReportUiMode('employee');
    lastReportResult = lastReportByMode[reportUiMode];
  }

  function exportReportExcel() {
    syncReportModeFromSection_();
    if (!lastReportResult || !(lastReportResult.rows && lastReportResult.rows.length)) return;
    var res = lastReportResult;
    var aoa = [];
    aoa.push((res.columns || []).map(function(c) { return AppI18n.t(c.labelKey); }));
    (res.rows || []).forEach(function(row) {
      aoa.push((res.columns || []).map(function(c) {
        var raw = formatReportCell(c.key, row[c.key]);
        var text = String(raw).replace(/<[^>]*>/g, '');
        if (isReportNumericCol_(c.key)) {
          var num = Number(String(text).replace(/[(),\s]/g, '').replace(/[^\d.\-]/g, ''));
          if (text !== '' && isFinite(num)) return num;
        }
        return text;
      }));
    });

    var filename = 'report_' + (res.meta.reportId || 'data') + '_' +
      String(res.meta.generatedAt || '').replace(/[^\d]/g, '') + '.xlsx';

    if (typeof XLSX !== 'undefined' && XLSX.utils) {
      var wb = XLSX.utils.book_new();
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, 'Report');
      XLSX.writeFile(wb, filename);
      AppUtils.showMessageKey(reportEls().message, 'report.exported', 'success');
      return;
    }

    // احتياط: SpreadsheetML باسم .xlsx إن تعذّر تحميل المكتبة
    function xmlEsc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    var rowsXml = '';
    aoa.forEach(function(row) {
      rowsXml += '<Row>';
      row.forEach(function(cell) {
        if (typeof cell === 'number' && isFinite(cell)) {
          rowsXml += '<Cell><Data ss:Type="Number">' + cell + '</Data></Cell>';
        } else {
          rowsXml += '<Cell><Data ss:Type="String">' + xmlEsc(cell) + '</Data></Cell>';
        }
      });
      rowsXml += '</Row>';
    });
    var xml = '<?xml version="1.0"?>'
      + '<?mso-application progid="Excel.Sheet"?>'
      + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"'
      + ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
      + '<Worksheet ss:Name="Report"><Table>' + rowsXml + '</Table></Worksheet></Workbook>';
    var blob = new Blob([xml], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    AppUtils.showMessageKey(reportEls().message, 'report.exported', 'success');
  }

  function csvEscape_(value) {
    var s = String(value == null ? '' : value);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function askReportContentOptions(done) {
    if (!lastReportResult || !(lastReportResult.rows && lastReportResult.rows.length)) return;
    var existing = document.getElementById('reportExportOptionsModal');
    if (existing) existing.remove();
    var series = lastReportResult.series || [];
    var modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'reportExportOptionsModal';
    modal.style.display = 'flex';
    modal.style.zIndex = '2600';

    var optsHtml =
      '<label class="export-opt-row">' +
      '<input type="checkbox" id="expOptTable" checked>' +
      '<span>' + AppI18n.t('report.printTable') + '</span></label>';
    series.forEach(function(s, idx) {
      optsHtml +=
        '<label class="export-opt-row">' +
        '<input type="checkbox" class="expOptChart" data-idx="' + idx + '" checked>' +
        '<span>' + AppI18n.t(s.name) + '</span></label>';
    });

    modal.innerHTML =
      '<div class="modal-content" style="max-width:400px;">' +
      '<h3 class="modal-title">' + AppI18n.t('report.printOpts') + '</h3>' +
      '<p class="reports-hint" style="margin:0 0 14px;">' + AppI18n.t('report.exportChoose') + '</p>' +
      '<div class="export-opt-list">' + optsHtml + '</div>' +
      '<div style="display:flex;gap:10px;margin-top:18px;">' +
      '<button type="button" class="btn btn-primary" id="expOptOk" style="flex:1;">' + AppI18n.t('confirm.ok') + '</button>' +
      '<button type="button" class="btn btn-danger-outline" id="expOptCancel" style="flex:1;">' + AppI18n.t('confirm.cancel') + '</button>' +
      '</div></div>';
    document.body.appendChild(modal);

    function finish(ok) {
      var table = !!(document.getElementById('expOptTable') || {}).checked;
      var chartIndexes = [];
      modal.querySelectorAll('.expOptChart').forEach(function(cb) {
        if (cb.checked) chartIndexes.push(Number(cb.getAttribute('data-idx')));
      });
      if (modal.parentNode) modal.parentNode.removeChild(modal);
      if (!ok) return;
      if (!table && !chartIndexes.length) table = true;
      done({ table: table, chartIndexes: chartIndexes });
    }
    document.getElementById('expOptOk').onclick = function() { finish(true); };
    document.getElementById('expOptCancel').onclick = function() { finish(false); };
    modal.addEventListener('mousedown', function(e) {
      if (e.target === modal) finish(false);
    });
  }

  function applyExportContentVisibility_(opts) {
    document.body.classList.toggle('print-hide-table', !(opts && opts.table));
    document.body.classList.toggle('print-hide-charts', !(opts && opts.chartIndexes && opts.chartIndexes.length));
  }

  function clearExportContentVisibility_() {
    document.body.classList.remove('print-hide-table', 'print-hide-charts', 'printing-report');
  }

  function exportReportPdf() {
    syncReportModeFromSection_();
    if (!lastReportResult || !(lastReportResult.rows && lastReportResult.rows.length)) return;
    askReportContentOptions(function(opts) {
      var root = prepareExportRoot(opts);
      var msgId = reportEls().message;
      if (!root || typeof html2canvas !== 'function') {
        AppUtils.showMessageKey(msgId, 'receipt.err.libs', 'danger');
        return;
      }
      var jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
      AppUtils.showMessageKey(msgId, 'receipt.working', 'info');
      html2canvas(root, { scale: 2, backgroundColor: '#ffffff', logging: false }).then(function(canvas) {
        var img = canvas.toDataURL('image/jpeg', 0.92);
        var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        var pageW = pdf.internal.pageSize.getWidth();
        var pageH = pdf.internal.pageSize.getHeight();
        var margin = 10;
        var imgW = pageW - margin * 2;
        var imgH = (canvas.height * imgW) / canvas.width;
        var y = margin;
        var left = margin;
        if (imgH <= pageH - margin * 2) {
          pdf.addImage(img, 'JPEG', left, y, imgW, imgH);
        } else {
          var pageCanvasH = Math.floor(canvas.width * ((pageH - margin * 2) / imgW));
          var sy = 0;
          var first = true;
          while (sy < canvas.height) {
            if (!first) pdf.addPage();
            first = false;
            var sliceH = Math.min(pageCanvasH, canvas.height - sy);
            var slice = document.createElement('canvas');
            slice.width = canvas.width;
            slice.height = sliceH;
            slice.getContext('2d').drawImage(canvas, 0, sy, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
            var sliceImg = slice.toDataURL('image/jpeg', 0.92);
            var drawH = (sliceH * imgW) / canvas.width;
            pdf.addImage(sliceImg, 'JPEG', left, margin, imgW, drawH);
            sy += sliceH;
          }
        }
        pdf.save('report_' + (lastReportResult.meta.reportId || 'data') + '.pdf');
        AppUtils.showMessageKey(msgId, 'report.exported', 'success');
      }).catch(function() {
        AppUtils.showMessageKey(msgId, 'receipt.err.export', 'danger');
      });
    });
  }

  function exportReportImage() {
    syncReportModeFromSection_();
    if (!lastReportResult || !(lastReportResult.rows && lastReportResult.rows.length)) return;
    askReportContentOptions(function(opts) {
      var root = prepareExportRoot(opts);
      var msgId = reportEls().message;
      if (!root || typeof html2canvas !== 'function') {
        AppUtils.showMessageKey(msgId, 'receipt.err.libs', 'danger');
        return;
      }
      AppUtils.showMessageKey(msgId, 'receipt.working', 'info');
      html2canvas(root, { scale: 2, backgroundColor: '#ffffff', logging: false }).then(function(canvas) {
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'report_' + lastReportResult.meta.reportId + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        AppUtils.showMessageKey(msgId, 'report.exported', 'success');
      }).catch(function() {
        AppUtils.showMessageKey(msgId, 'receipt.err.export', 'danger');
      });
    });
  }

  function printReportResult() {
    syncReportModeFromSection_();
    if (!lastReportResult || !(lastReportResult.rows && lastReportResult.rows.length)) return;
    askReportContentOptions(function(opts) {
      prepareExportRoot(opts);
      applyExportContentVisibility_(opts);
      document.body.classList.add('printing-report');
      window.print();
      setTimeout(function() { clearExportContentVisibility_(); }, 500);
    });
  }

  if (typeof AppI18n !== 'undefined' && AppI18n.onChange) {
    AppI18n.onChange(function() {
      var modes = AppLayout.isSupervisor() ? ['employee', 'system'] : ['employee'];
      var currentMode = reportUiMode;
      modes.forEach(function(mode) {
        setReportUiMode(mode);
        renderReportsGallery();
        var def = REPORT_DEFS.find(function(d) { return d.id === selectedReportId(); });
        if (def) {
          var titleEl = $r('activeTitle');
          if (titleEl) {
            titleEl.setAttribute('data-i18n', def.titleKey);
            titleEl.textContent = AppI18n.t(def.titleKey);
          }
        }
        if (lastReportByMode[mode]) renderReportResult(lastReportByMode[mode]);
      });
      setReportUiMode(currentMode);
    });
  }

  // تهيئة عند الإقلاع
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initReportsSection);
  } else {
    initReportsSection();
  }
</script>
