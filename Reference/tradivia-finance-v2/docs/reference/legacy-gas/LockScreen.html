<!-- ===================================================================
     شاشة القفل التلقائي — تظهر بعد 20 دقيقة من عدم النشاط
     مشتركة بين واجهة الموظف والمشرف (وأي واجهة مصادَق عليها مستقبلاً)
=================================================================== -->
<div class="lock-overlay" id="lockOverlay">
  <div class="card lock-card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    </div>
    <div class="lock-title" data-i18n="lock.title">الشاشة مقفلة</div>
    <div class="lock-employee-name" id="lockEmployeeName">—</div>
    <div class="lock-subtitle" data-i18n="lock.subtitle">تم القفل التلقائي بسبب عدم النشاط — أدخل كلمة المرور للمتابعة</div>

    <form id="lockForm" autocomplete="off">
      <div class="form-group">
        <label for="lockPassword" data-i18n="lock.password">كلمة المرور</label>
        <div class="input-wrap">
          <input
            type="password"
            id="lockPassword"
            data-i18n="login.passwordPlaceholder"
            placeholder="أدخل كلمة المرور"
            required
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            data-lpignore="true"
            data-1p-ignore
            data-bwignore="true">
          <button type="button" class="input-icon-btn" id="lockEyeToggle" title="عرض كلمة المرور" data-i18n-title="login.showPassword">
            <svg viewBox="0 0 24 24" id="lockEyeIcon"><path d="M12 6c-4.42 0-8.27 2.94-9.83 7 1.56 4.06 5.41 7 9.83 7s8.27-2.94 9.83-7C20.27 8.94 16.42 6 12 6zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="lockUnlockBtn" class="btn btn-primary auth-submit-btn">
        <span id="lockUnlockBtnText" data-i18n="lock.unlock">فتح القفل</span>
      </button>

      <div id="lockMessage" class="alert"></div>
    </form>
  </div>
</div>
