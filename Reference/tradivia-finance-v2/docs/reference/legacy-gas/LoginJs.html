<script>
  /* ========================================================
     تهيئة صفحة تسجيل الدخول الموحّدة (موظف + مشرف)
  ======================================================== */

  const EYE_ICON_VISIBLE = 'M12 6c-4.42 0-8.27 2.94-9.83 7 1.56 4.06 5.41 7 9.83 7s8.27-2.94 9.83-7C20.27 8.94 16.42 6 12 6zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z';
  const EYE_ICON_HIDDEN = 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z';

  const LOGIN_ERROR_KEYS = {
    INACTIVE: 'login.inactiveAccount',
    WRONG_CREDENTIALS: 'login.wrongCredentials'
  };

  function initLogin() {
    if (document.body) document.body.classList.add('auth-body');

    var mark = document.getElementById('loginBrandMark');
    if (mark && typeof AppBrand !== 'undefined') {
      mark.innerHTML = AppBrand.markHtml(72);
    }

    AppI18n.init();
    initLoginThemeIcon();
    document.getElementById('currentYear').textContent = new Date().getFullYear();
    AppI18n.apply();

    AppSelect.enhance('username');

    // قائمة موحّدة: موظفون + مشرفون
    google.script.run
      .withSuccessHandler(populateDropdown)
      .withFailureHandler(showConnectionError)
      .getLoginUsersList('all');

    bindLoginEvents();

    if (typeof AppI18n !== 'undefined' && AppI18n.onChange) {
      AppI18n.onChange(function() {
        // إعادة ترجمة خيار القائمة الافتراضي إن وُجد
        var sel = document.getElementById('username');
        if (sel) {
          Array.prototype.forEach.call(sel.options || [], function(opt) {
            var key = opt.getAttribute('data-i18n');
            if (key) opt.textContent = AppI18n.t(key);
          });
        }
        var btnText = document.getElementById('loginBtnText');
        var btn = document.getElementById('loginBtn');
        if (btnText && btn && !btn.disabled) {
          btnText.textContent = AppI18n.t('login.submit');
        }
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLogin);
  } else {
    initLogin();
  }

  function populateDropdown(employees) {
    const select = document.getElementById('username');
    select.innerHTML = '<option value="" disabled selected data-i18n="login.selectUser">' + AppI18n.t('login.selectUser') + '</option>';

    if (!employees || employees.length === 0) {
      select.innerHTML = '<option value="" disabled selected data-i18n="login.noAccounts">' + AppI18n.t('login.noAccounts') + '</option>';
      AppSelect.refresh('username');
      return;
    }

    employees.forEach(function(name) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });

    if (employees.length === 1) {
      select.innerHTML = '';
      const only = document.createElement('option');
      only.value = employees[0];
      only.textContent = employees[0];
      only.selected = true;
      select.appendChild(only);
      select.value = employees[0];
      AppSelect.refresh('username');
      var pass = document.getElementById('password');
      if (pass) pass.focus();
      return;
    }

    AppSelect.refresh('username');
    const trigger = document.getElementById('usernameTrigger');
    if (trigger) trigger.focus();
  }

  function showConnectionError() {
    AppUtils.showMessageKey('loginMessage', 'login.connectionError', 'danger');
  }

  function initLoginThemeIcon() {
    const theme = document.documentElement.getAttribute('data-theme') || 'dark';
    renderLoginThemeIcon(theme);
  }

  function toggleLoginTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('fx_theme', next);
    renderLoginThemeIcon(next);
  }

  function renderLoginThemeIcon(theme) {
    const icon = document.getElementById('loginThemeIcon');
    if (!icon) return;
    if (theme === 'dark') {
      icon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>';
    } else {
      icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
    }
  }

  function togglePasswordVisibility() {
    const input = document.getElementById('password');
    const btn = document.getElementById('eyeToggle');
    const icon = document.getElementById('eyeIcon');
    const isHidden = input.type === 'password';

    input.type = isHidden ? 'text' : 'password';
    icon.innerHTML = '<path d="' + (isHidden ? EYE_ICON_HIDDEN : EYE_ICON_VISIBLE) + '"/>';
    btn.classList.toggle('active', isHidden);
    btn.title = isHidden ? AppI18n.t('login.hidePassword') : AppI18n.t('login.showPassword');
    btn.setAttribute('data-i18n-title', isHidden ? 'login.hidePassword' : 'login.showPassword');

    input.focus();
  }

  function bindLoginEvents() {
    document.getElementById('username').addEventListener('change', function() {
      document.getElementById('password').focus();
    });

    document.getElementById('eyeToggle').addEventListener('click', togglePasswordVisibility);
    document.getElementById('loginThemeBtn').addEventListener('click', toggleLoginTheme);
    document.getElementById('loginLangBtn').addEventListener('click', function() {
      AppI18n.toggle();
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      attemptLogin();
    });

    document.addEventListener('keydown', function(e) {
      if (e.altKey && e.code === 'KeyV') {
        e.preventDefault();
        togglePasswordVisibility();
      }
    });
  }

  function attemptLogin() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    if (!username || !password) {
      AppUtils.showMessageKey('loginMessage', 'login.fillRequired', 'danger');
      return;
    }

    setLoginButtonState(true, AppI18n.t('login.verifying'));
    AppUtils.hideMessage('loginMessage');

    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          sessionStorage.setItem('currentUser', username);
          sessionStorage.setItem('fx_user_role', (response.session && response.session.role) || response.role || 'موظف');
          sessionStorage.setItem('fx_session_token', response.session && response.session.token || '');
          sessionStorage.setItem('fx_login_portal', 'all');
          sessionStorage.setItem('fx_login_date', (function() {
            var d = new Date();
            var m = (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
            var day = (d.getDate() < 10 ? '0' : '') + d.getDate();
            return d.getFullYear() + '-' + m + '-' + day;
          })());

          setLoginButtonState(true, AppI18n.t('login.redirecting'));

          const isSupervisor = ((response.session && response.session.role) || response.role) === 'مشرف';
          const targetUrl = isSupervisor
            ? (APP_URL + '?page=supervisor')
            : (APP_URL + '?page=employee');
          window.top.location.href = targetUrl;
        } else {
          const key = LOGIN_ERROR_KEYS[response.code] || 'login.wrongCredentials';
          AppUtils.showMessageKey('loginMessage', key, 'danger');
          setLoginButtonState(false);
        }
      })
      .withFailureHandler(function() {
        showConnectionError();
        setLoginButtonState(false);
      })
      .verifyLogin(username, password, 'all');
  }

  function setLoginButtonState(isLoading, loadingText) {
    const btn = document.getElementById('loginBtn');
    const textEl = document.getElementById('loginBtnText');
    btn.disabled = isLoading;
    textEl.innerHTML = isLoading
      ? '<span class="spinner"></span> ' + loadingText
      : AppI18n.t('login.submit');
  }
</script>
