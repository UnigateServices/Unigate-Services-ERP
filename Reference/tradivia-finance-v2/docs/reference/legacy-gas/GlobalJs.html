  /**

  var AppBrand = {
    name: 'Powered by UNI GATE',
    short: 'UG',
    poweredBy: 'Powered by UNI GATE',
    /** اللوغو الرسمي — شكل بوابة أسود بخلفية شفافة؛ اللون يتبع الثيم عبر CSS (أسود نهار / أبيض ليل) */
    logoDataUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALMAAAC1CAYAAAAUTc7uAAAC5klEQVR4nO3cy4rbQABFQTvk/3/ZwUwgmMQTe0aP7tNVG20bcXTRQuh6+XD7fYVp/Tj7ALAVMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGT8vbdezDzCw2yXGMpMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETIaYyRAzGWImQ8xkiJkMMZMhZjLETEY95tvZBxjY9RJTj5mFrBCzdV7ECjHz/OFOvWqsErN1fgw4GfQqMd8J+nnAiaBXivlO0M9NH/RqMRMOesWYrXM06BVjvhN0MOhVYyYY9MoxW+dY0CvHfCfokNVjvhP0566zLLSYedXwQYv5g3UOBC3mPwQ9OTE/EvTE6yxmMkGL+W/WedKgxfxvgp4waDE/J+jJghYzmaDF/DnrPFHQYv4/QU8StJhfI+gJghbz6wQ9eNBiJhO0mN9jnQcm5vcJetBvocX8NYIekJjJLLSYv846v2/XoMX8PYIeKGgxkwlazN9nnQcJWszbEPQAQYt5O4I+OWgxkwlazNuyzicGLebtCfqkoMW8D0GfELSY9yPog4MWM5mgxbwv63xg0GLen6APClrMxxD0AUGL+TiC3jloMZMJWszHss47Bi3m4wl6p6DFPAaBbxC0mMeI9/SfDk7q4b6J+TzWeOOgxXwuQZMg5G25nzQpm8vMfgH0GTJs0ILwlwAAAABJRU5ErkJggg==',
    markHtml: function(size) {
      var sz = size || 40;
      return '<img class="app-brand-mark" src="' + this.logoDataUrl + '" width="' + sz + '" height="' + sz + '" alt="UNI GATE" draggable="false">';
    },
    markSvg: function(size) { return this.markHtml(size); },
    wordmarkHtml: function(opts) {
      opts = opts || {};
      var cls = opts.className || 'logo-text';
      return '<div class="' + cls + ' brand-powered" aria-label="' + this.poweredBy + '">' +
        '<span class="brand-powered-by">Powered by</span>' +
        '<strong class="brand-product">UNI GATE</strong>' +
        '</div>';
    }
  };

  const AppUtils = {
    
    /**
     * عرض رسالة تنبيه في عنصر محدد
     * @param {string} elementId - معرف عنصر HTML (ID)
     * @param {string} message - نص الرسالة
     * @param {string} type - نوع الرسالة ('success', 'danger', 'info')
     */
    showMessage: function(elementId, message, type) {
      const el = document.getElementById(elementId);
      if(!el) return;

      delete el.dataset.i18nKey;
      el.textContent = message;
      el.className = 'alert alert-' + type;
      el.style.display = 'block';
    },

    /**
     * عرض رسالة تنبيه مترجمة عبر مفتاح ترجمة (بدل نص جاهز)
     * الميزة: إذا بدّل المستخدم اللغة أثناء ظهور الرسالة، تُعاد ترجمتها فوراً
     * تلقائياً دون أي كود إضافي (عبر AppI18n.onChange)
     * @param {string} elementId
     * @param {string} i18nKey - مفتاح الترجمة
     * @param {string} type - نوع الرسالة
     */
    showMessageKey: function(elementId, i18nKey, type) {
      const el = document.getElementById(elementId);
      if (!el) return;

      el.dataset.i18nKey = i18nKey;
      el.textContent = (typeof AppI18n !== 'undefined') ? AppI18n.t(i18nKey) : i18nKey;
      el.className = 'alert alert-' + type;
      el.style.display = 'block';
    },

    /**
     * إعادة ترجمة كل الرسائل المعروضة حالياً فوراً (تُستدعى تلقائياً عند تبديل اللغة)
     */
    retranslateMessages: function() {
      if (typeof AppI18n === 'undefined') return;
      document.querySelectorAll('[data-i18n-key]').forEach(function(el) {
        if (el.style.display !== 'none') {
          el.textContent = AppI18n.t(el.dataset.i18nKey);
        }
      });
    },

    /**
     * إخفاء رسالة تنبيه
     * @param {string} elementId - معرف عنصر HTML (ID)
     */
    hideMessage: function(elementId) {
      const el = document.getElementById(elementId);
      if(el) {
        el.style.display = 'none';
        el.textContent = '';
        el.className = 'alert';
        delete el.dataset.i18nKey;
      }
    },

    /**
     * تفعيل أو تعطيل زر وتغيير نصه (مفيد أثناء معالجة البيانات)
     * @param {string} buttonId - معرف الزر
     * @param {boolean} isLoading - حالة التحميل
     * @param {string} loadingText - النص أثناء التحميل
     * @param {string} originalText - النص الأصلي
     */
    setLoadingState: function(buttonId, isLoading, loadingText = 'جاري المعالجة...', originalText = '') {
      const btn = document.getElementById(buttonId);
      if(!btn) return;

      if (isLoading) {
        if (!btn.dataset.originalText) {
          btn.dataset.originalText = btn.textContent; // حفظ النص الأصلي
        }
        btn.disabled = true;
        btn.textContent = loadingText;
      } else {
        btn.disabled = false;
        btn.textContent = originalText || btn.dataset.originalText;
      }
    },

    /**
     * تعقيم أي نص قبل حقنه داخل innerHTML لمنع هجمات XSS
     * (يُستخدم عند عرض بيانات أدخلها المستخدم مثل الملاحظات وأسماء المستلمين)
     * @param {*} value - القيمة المطلوب تعقيمها
     * @returns {string} - نص آمن جاهز للعرض
     */
    escapeHtml: function(value) {
      if (value === null || value === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    },

    /**
     * تنسيق رقم مع قاعدة السالب الشاملة: (100) بدل -100
     */
    formatSignedNumber: function(value, options) {
      options = options || {};
      if (value === null || value === undefined || value === '' || value === '-') return String(value == null ? '' : value);
      const n = Number(String(value).replace(/[(),\s]/g, '').replace(/−/g, '-'));
      if (isNaN(n)) return String(value);

      const abs = Math.abs(n);
      let minFrac = options.minimumFractionDigits;
      let maxFrac = options.maximumFractionDigits;
      if (minFrac === undefined) minFrac = (abs % 1 === 0) ? 0 : 2;
      if (maxFrac === undefined) maxFrac = 2;

      const formatted = abs.toLocaleString('en-US', {
        minimumFractionDigits: minFrac,
        maximumFractionDigits: maxFrac
      });
      return n < 0 ? '(' + formatted + ')' : formatted;
    },

    /**
     * نفس formatSignedNumber مع وسم أحمر للأرقام السالبة (لـ innerHTML)
     */
    formatSignedNumberHtml: function(value, options) {
      const text = this.formatSignedNumber(value, options);
      const n = Number(String(value).replace(/[(),\s]/g, '').replace(/−/g, '-'));
      if (!isNaN(n) && n < 0) {
        return '<span class="num-negative">' + this.escapeHtml(text) + '</span>';
      }
      return this.escapeHtml(text);
    },

    /** تاريخ اليوم بصيغة YYYY-MM-DD لحقول date */
    todayInputValue: function() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
      const dd = (d.getDate() < 10 ? '0' : '') + d.getDate();
      return yyyy + '-' + mm + '-' + dd;
    },

    /* ====== محرك التصريف الموحّد (نسخة الواجهة — المرجع النهائي هو الخادم) ======
     * سعر الصرف = عدد الليرات مقابل دولار واحد، والمبلغ بعملة المصدر،
     * والإجمالي بعملة الوجهة: دولار→ليرة ضرب، وليرة→دولار قسمة
     */
    CURRENCY: { USD: 'دولار', SYP: 'ليرة سورية' },

    normalizeCurrency: function(value) {
      const v = String(value == null ? '' : value).trim();
      if (v === this.CURRENCY.USD || v.toUpperCase() === 'USD') return this.CURRENCY.USD;
      if (v === this.CURRENCY.SYP || v.toUpperCase() === 'SYP') return this.CURRENCY.SYP;
      return v;
    },

    /** الدولار بمنزلتين عشريتين والليرة برقم صحيح */
    roundMoney: function(value, currency) {
      const n = Number(value) || 0;
      if (this.normalizeCurrency(currency) === this.CURRENCY.SYP) return Math.round(n);
      return Math.round(n * 100) / 100;
    },

    convertByRate: function(amount, rate, fromCur, toCur) {
      const amt = Number(amount) || 0;
      const rt = Number(rate) || 0;
      const from = this.normalizeCurrency(fromCur);
      const to = this.normalizeCurrency(toCur);
      if (!amt || !from || !to) return 0;
      if (from === to) return this.roundMoney(amt, to);
      if (rt <= 0) return 0;
      if (from === this.CURRENCY.SYP && to === this.CURRENCY.USD) return this.roundMoney(amt / rt, to);
      return this.roundMoney(amt * rt, to);
    },

    /** وسم العملة بجانب اسم الحقل — يُترجم تلقائياً عند تبديل اللغة */
    setFieldCurrencyTag: function(elementId, currency) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const cur = this.normalizeCurrency(currency);
      if (!cur) {
        el.removeAttribute('data-i18n');
        el.textContent = '';
        return;
      }
      const key = cur === this.CURRENCY.USD ? 'currency.usd' : 'currency.syp';
      el.setAttribute('data-i18n', key);
      el.textContent = (typeof AppI18n !== 'undefined') ? AppI18n.t(key) : cur;
    },

    /** تحويل نص منسّق (1,234.56) إلى رقم خام */
    parseFormattedNumber: function(value) {
      if (value === null || value === undefined || value === '') return '';
      const cleaned = String(value).replace(/,/g, '').replace(/\s/g, '').replace(/[()]/g, '').trim();
      if (cleaned === '' || cleaned === '-') return '';
      const neg = String(value).indexOf('(') !== -1 || cleaned.charAt(0) === '-';
      const n = Number(cleaned.replace(/^-/, ''));
      if (isNaN(n)) return '';
      return neg ? -n : n;
    },

    /**
     * تنسيق أثناء الكتابة: فاصلة كل 3 مراتب مع الحفاظ على الكسور
     */
    formatAmountInputValue: function(raw) {
      let s = String(raw || '').replace(/[^\d.]/g, '');
      if (!s) return '';
      const parts = s.split('.');
      let intPart = parts[0] || '0';
      intPart = intPart.replace(/^0+(?=\d)/, '');
      intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      if (parts.length > 1) {
        return intPart + '.' + parts.slice(1).join('').slice(0, 4);
      }
      if (String(raw).slice(-1) === '.') return intPart + '.';
      return intPart;
    },

    /** ربط حقول المبالغ داخل حاوية لتنسيق الألف أثناء الكتابة */
    bindAmountInputs: function(root) {
      const scope = root || document;
      const self = this;
      scope.querySelectorAll('input.input-amount').forEach(function(input) {
        if (input.dataset.amountBound === '1') return;
        input.dataset.amountBound = '1';
        input.setAttribute('inputmode', 'decimal');
        input.addEventListener('input', function() {
          const start = input.selectionStart;
          const oldLen = input.value.length;
          const next = self.formatAmountInputValue(input.value);
          input.value = next;
          try {
            const diff = next.length - oldLen;
            const pos = Math.max(0, (start || 0) + diff);
            input.setSelectionRange(pos, pos);
          } catch (e) { /* ignore */ }
          if (typeof input.oninput === 'function') { /* native handlers via attribute still fire */ }
        });
        input.addEventListener('blur', function() {
          if (!input.value) return;
          const n = self.parseFormattedNumber(input.value);
          if (n === '') return;
          const absTxt = self.formatSignedNumber(Math.abs(n));
          input.value = (n < 0 ? '-' : '') + String(absTxt).replace(/[()]/g, '');
        });
      });
    }

  };
</script>
