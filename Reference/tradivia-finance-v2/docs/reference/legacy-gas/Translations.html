  const AppI18n = {
    currentLang: 'ar',
    _listeners: [],

    init: function() {
      const saved = localStorage.getItem('fx_lang');
      if (saved && I18N[saved]) this.currentLang = saved;
      this._syncDocumentDirection();
      this.apply();
    },

    /**
     * تبديل فوري للغة + الاتجاه + إعادة رسم كل النصوص والمكوّنات المشتركة
     * بدون الحاجة لإعادة تحميل الصفحة إطلاقاً
     */
    toggle: function() {
      this.currentLang = this.currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('fx_lang', this.currentLang);
      this._syncDocumentDirection();
      this.apply();
      // المستمعون فقط عند تبديل اللغة — وليس عند كل apply جزئي للقسم
      this._notifyChange();
    },

    _syncDocumentDirection: function() {
      const dir = this.currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = this.currentLang;
      document.documentElement.dir = dir;
      if (document.body) {
        document.body.dir = dir;
        document.body.setAttribute('dir', dir);
      }
    },

    t: function(key) {
      return (I18N[this.currentLang] && I18N[this.currentLang][key]) || key;
    },

    /**
     * تسجيل دالة تُستدعى تلقائياً بعد كل تحديث ترجمة (فوري، بدون Refresh)
     * تُستخدم من قبل المكوّنات الديناميكية (كالقوائم المخصصة، حالة الأزرار...)
     * لإعادة رسم نصوصها التي لا يغطيها data-i18n مباشرة
     */
    onChange: function(callback) {
      if (typeof callback === 'function') this._listeners.push(callback);
    },

    /**
     * تطبيق نصوص الترجمة على DOM فقط.
     * مهم: لا يستدعي مستمعي onChange — ذلك كان يسبب تعليق 5+ ثوانٍ
     * (إعادة بناء كل AppSelect + كل جداول السجل + تقارير في حلقة متكررة).
     * المستمعون يُستدعون فقط من toggle() عبر _notifyChange().
     * @param {Element|Document} [root] - نطاق التطبيق (افتراضي: كامل المستند)
     */
    apply: function(root) {
      const scope = (root && root.querySelectorAll) ? root : document;
      scope.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (!key || key === 'undefined') return;
        const text = this.t(key);
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
          el.placeholder = text;
        } else {
          el.textContent = text;
        }
      });

      scope.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = this.t(el.getAttribute('data-i18n-title'));
      });

      scope.querySelectorAll('[data-i18n-aria]').forEach(el => {
        el.setAttribute('aria-label', this.t(el.getAttribute('data-i18n-aria')));
      });

      if (scope === document || !root) {
        const langLabels = document.querySelectorAll('#langLabel, #loginLangLabel');
        langLabels.forEach(el => { el.textContent = this.currentLang === 'ar' ? 'EN' : 'AR'; });
      }

      if (typeof AppLayout !== 'undefined' && AppLayout.currentSection) {
        AppLayout.updateSectionTitle(AppLayout.currentSection);
      }
    },

    /** إشعار المكوّنات الديناميكية بعد تبديل اللغة فقط */
    _notifyChange: function() {
      this._listeners.forEach(function(fn) {
        try { fn(); } catch (e) { /* تجاهل أي مكوّن غير جاهز بعد */ }
      });
    }
  };

  // إعادة ترجمة أي رسالة تنبيه معروضة حالياً (نجاح/خطأ) فوراً عند تبديل اللغة
  if (typeof AppUtils !== 'undefined' && AppUtils.retranslateMessages) {
    AppI18n.onChange(function() { AppUtils.retranslateMessages(); });
  }
