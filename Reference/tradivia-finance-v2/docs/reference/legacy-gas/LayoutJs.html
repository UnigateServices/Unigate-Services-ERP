<script>
  /**
   * محرك التخطيط المشترك — Navbar + Sidebar + Theme + Refresh + الأمان
   * يُستخدم في واجهة الموظف والمشرف
   */
  const AppLayout = {
    currentSection: 'add-income',
    sidebarCollapsed: false,
    refreshInterval: null,
    silentRefreshCallback: null,

    // ===== إعدادات الأمان والتحديث =====
    IDLE_LIMIT_MS: 20 * 60 * 1000, // 20 دقيقة خمول قبل القفل التلقائي
    SILENT_REFRESH_MS: 5 * 60 * 1000, // 5 دقائق
    idleTimer: null,
    midnightTimer: null,
    midnightWatchInterval: null,
    lastActivityAt: Date.now(),
    isLocked: false,

    SECTION_TITLES: {
      'add-income': 'section.addIncome',
      'add-outcome': 'section.addOutcome',
      'add-exchange': 'section.addExchange',
      'add-transfer': 'section.addTransfer',
      'add-advances': 'section.addAdvances',
      'log-income': 'section.logIncome',
      'log-outcome': 'section.logOutcome',
      'log-exchange': 'section.logExchange',
      'log-transfer': 'section.logTransfer',
      'log-advances': 'section.logAdvances',
      'log-opening': 'section.logOpening',
      'reports': 'section.reports',
      'monitor-ops': 'section.monitorOps',
      'system-reports': 'section.systemReports',
      'opening-balance': 'section.openingBalance',
      'manage-employees': 'section.manageEmployees',
      'manage-borrowers': 'section.manageBorrowers',
      'manage-projects': 'section.manageProjects',
      'manage-banks': 'section.manageBanks',
      'employee-funds': 'section.employeeFunds'
    },

    ROLE_EMPLOYEE: 'موظف',
    ROLE_SUPERVISOR: 'مشرف',

    init: function(options) {
      options = options || {};
      this.silentRefreshCallback = options.onSilentRefresh || null;
      this.onSessionReady = options.onSessionReady || null;

      if (document.body) document.body.classList.add('app-body');
      this.applyBrandMarks_();

      const savedTheme = localStorage.getItem('fx_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      const savedSidebar = localStorage.getItem('fx_sidebar_collapsed');
      if (savedSidebar === 'true') this.setSidebarCollapsed(true);

      AppI18n.init();

      // بدون جلسة محلية صالحة: لا نكمل التهيئة (ونتجنّب SecurityError من التوجيه التلقائي)
      if (!this.hasClientSession() || !this.isSessionDateValid()) {
        this.forceLogout(this.hasClientSession() ? 'session.expiredMidnight' : 'session.loginRequired');
        return;
      }

      // إخفاء الواجهة حتى نعرف: مقفلة أم لا — حتى لا يُرى النظام أو تُطلَق طلبات تسبب خروج خاطئ
      this.setBootGate_(true);

      this.applyRoleUi();
      // أول قسم ظاهر حسب الدور (مشرف → مراقبة العمليات، موظف → أول قسم متاح)
      this.currentSection = options.defaultSection || this.resolveHomeSection_();
      this.bindEvents();
      this.initNetworkStatus_();
      this.updateThemeIcon(savedTheme);
      this.navigateTo(this.currentSection, true);
      this.updateLastUpdateTime();

      const self = this;
      this.enforceServerLockIfNeeded(function(ok) {
        self.setBootGate_(false);
        if (!ok) return;
        self.initSecurity();
        if (!self.isLocked) self.startSilentRefresh();
        if (typeof self.onSessionReady === 'function') {
          if (self.isLocked) {
            self._pendingDataLoad = true;
            self.onSessionReady(false);
          } else {
            self._pendingDataLoad = false;
            self.onSessionReady(true);
          }
        }
      });
    },

    /** أول قسم في ترتيب القائمة الظاهرة للمستخدم الحالي */
    resolveHomeSection_: function() {
      if (typeof AppShortcuts !== 'undefined' && typeof AppShortcuts.getSectionOrder === 'function') {
        var order = AppShortcuts.getSectionOrder();
        if (order && order.length) return order[0];
      }
      return this.isSupervisor() ? 'monitor-ops' : 'add-income';
    },

    /** أثناء التحقق من القفل: غطِّ التطبيق حتى لا يظهر شيء خلف الشاشة */
    setBootGate_: function(on) {
      if (on) {
        document.body.classList.add('app-booting');
        this.setAppShellInert(true);
        var shell = document.getElementById('appShell');
        if (shell) shell.style.visibility = 'hidden';
      } else {
        document.body.classList.remove('app-booting');
        if (!this.isLocked) {
          this.setAppShellInert(false);
          var shell2 = document.getElementById('appShell');
          if (shell2) shell2.style.visibility = '';
        }
      }
    },

    /**
     * معالجة موحّدة لردود السيرفر: القفل ≠ انتهاء الجلسة
     * @returns {boolean} true إذا تم التعامل مع الرد (لا تُكمل المنطق العادي)
     */
    handleAuthResult: function(res) {
      if (!res) return false;
      if (res.sessionLocked) {
        this.lockScreen();
        return true;
      }
      if (res.sessionExpired) {
        this.forceLogout(res.messageKey || 'session.expiredGeneric');
        return true;
      }
      return false;
    },

    /* ================= الجلسة والأمان ================= */

    getSession: function() {
      return {
        username: sessionStorage.getItem('currentUser') || '',
        token: sessionStorage.getItem('fx_session_token') || '',
        role: sessionStorage.getItem('fx_user_role') || this.ROLE_EMPLOYEE
      };
    },

    /** هل توجد بيانات جلسة محلية كافية لفتح الواجهة؟ */
    hasClientSession: function() {
      try {
        return !!(
          sessionStorage.getItem('currentUser') &&
          sessionStorage.getItem('fx_session_token') &&
          sessionStorage.getItem('fx_login_date')
        );
      } catch (e) {
        return false;
      }
    },

    getRole: function() {
      return sessionStorage.getItem('fx_user_role') || this.ROLE_EMPLOYEE;
    },

    isSupervisor: function() {
      return this.getRole() === this.ROLE_SUPERVISOR;
    },

    /**
     * إظهار أقسام المشرف في السايد بار وإخفاؤها عن الموظف
     * المشرف = نفس واجهة الموظف + أقسام إضافية (وليس شاشة Admin منفصلة)
     */
    applyRoleUi: function() {
      // Employee.html: إخفاء أدوات المشرف دائماً | Supervisor.html: إظهارها
      const onSupervisorShell = (typeof APP_INTERFACE !== 'undefined' && APP_INTERFACE === 'supervisor');
      document.querySelectorAll('[data-role="supervisor"]').forEach(function(el) {
        el.classList.toggle('hidden', !onSupervisorShell);
      });
      if (document.body) {
        document.body.classList.toggle('role-supervisor', onSupervisorShell);
        document.body.classList.toggle('role-employee', !onSupervisorShell);
      }
    },

    clearLocalSession_: function() {
      try {
        var portal = sessionStorage.getItem('fx_login_portal') || '';
        if (!portal && typeof APP_INTERFACE !== 'undefined' && APP_INTERFACE === 'supervisor') {
          portal = 'supervisor';
        }
        sessionStorage.removeItem('currentUser');
        sessionStorage.removeItem('fx_user_role');
        sessionStorage.removeItem('fx_session_token');
        sessionStorage.removeItem('fx_login_date');
        if (portal) sessionStorage.setItem('fx_login_portal', portal);
      } catch (e) {}
    },

    loginUrl_: function() {
      if (typeof APP_URL === 'undefined' || !APP_URL) return '';
      return APP_URL;
    },

    /** تطبيق شعار Powered by UNI GATE في السايدبار وأي موضع معلّم */
    applyBrandMarks_: function() {
      if (typeof AppBrand === 'undefined') return;
      var mark = document.getElementById('sidebarBrandMark');
      if (mark) {
        mark.innerHTML = AppBrand.markHtml(40);
        mark.setAttribute('data-branded', '1');
      }
    },

    /**
     * توجيه آمن لصفحة الدخول.
     * داخل iframe تطبيقات GAS، تغيير window.top بدون نقرة مستخدم ممنوع.
     * لذلك نعرض بوابة بزر/رابط target=_top (النقرة = تفعيل مستخدم مسموح).
     */
    goToLogin: function(reasonKey) {
      try {
        if (reasonKey) sessionStorage.setItem('fx_logout_reason', reasonKey);
      } catch (e) {}

      this.clearLocalSession_();
      // لا نلمس window.top هنا أبداً — فقط بوابة بنقرة مستخدم
      this.showLoginGate_(reasonKey);
    },

    /** شاشة وسيطة بزر تسجيل دخول — النقرة تسمح بـ top navigation */
    showLoginGate_: function(reasonKey) {
      if (document.getElementById('fxLoginGate')) return;
      const url = this.loginUrl_() || '#';
      const msg = (typeof AppI18n !== 'undefined')
        ? AppI18n.t(reasonKey || 'session.loginRequired')
        : 'يرجى تسجيل الدخول للمتابعة.';
      const btn = (typeof AppI18n !== 'undefined')
        ? AppI18n.t('session.goToLogin')
        : 'الذهاب لتسجيل الدخول';

      const gate = document.createElement('div');
      gate.id = 'fxLoginGate';
      gate.style.cssText = 'position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:rgba(8,12,10,0.92);padding:24px;';
      var brandMark = (typeof AppBrand !== 'undefined')
        ? '<div style="display:flex;justify-content:center;margin-bottom:14px;"><div style="width:56px;height:56px;border-radius:12px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,0.28);">' +
          AppBrand.markSvg(56) +
          '</div></div>'
        : '';
      gate.innerHTML =
        '<div style="max-width:420px;width:100%;background:var(--surface-color,#1a221e);border:1px solid rgba(0,168,107,0.35);border-radius:16px;padding:28px 24px;text-align:center;color:var(--text-primary,#e8f0ec);font-family:Tahoma,Segoe UI,sans-serif;">' +
          brandMark +
          '<div style="margin-bottom:14px;direction:ltr;line-height:1.2;">' +
            '<div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-secondary,#a8b5af);">Powered by</div>' +
            '<div style="font-size:17px;font-weight:800;letter-spacing:0.08em;color:#00a86b;">UNI GATE</div>' +
          '</div>' +
          '<p id="fxLoginGateMsg" style="margin:0 0 20px;line-height:1.7;color:var(--text-secondary,#a8b5af);font-size:14px;"></p>' +
          '<a id="fxLoginGateBtn" href="' + url + '" target="_top" rel="noopener" ' +
            'style="display:inline-block;padding:12px 22px;border-radius:10px;background:#00a86b;color:#fff;font-weight:700;text-decoration:none;font-size:14px;">' +
          '</a>' +
        '</div>';
      document.body.appendChild(gate);
      const msgEl = document.getElementById('fxLoginGateMsg');
      const btnEl = document.getElementById('fxLoginGateBtn');
      if (msgEl) msgEl.textContent = msg;
      if (btnEl) btnEl.textContent = btn;
      // إخفاء الواجهة خلف البوابة
      const shell = document.getElementById('appShell');
      if (shell) shell.style.visibility = 'hidden';
    },

    /** تاريخ محلي ثابت YYYY-MM-DD لمقارنة يوم الجلسة */
    todayKey: function() {
      const d = new Date();
      const m = (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
      const day = (d.getDate() < 10 ? '0' : '') + d.getDate();
      return d.getFullYear() + '-' + m + '-' + day;
    },

    isSessionDateValid: function() {
      const loginDate = sessionStorage.getItem('fx_login_date');
      if (!loginDate) return false; // بدون تاريخ جلسة نُخرج للأمان
      // توافق خلفي مع toDateString() القديم إن وُجد
      if (loginDate.indexOf('-') === -1) {
        return loginDate === new Date().toDateString();
      }
      return loginDate === this.todayKey();
    },

    initSecurity: function() {
      this.scheduleMidnightLogout();
      this.setupIdleWatcher();
      this.setupVisibilityGuard();
    },

    /**
     * جدولة إنهاء إجباري للجلسة عند منتصف الليل، مع فحص احتياطي دوري
     */
    scheduleMidnightLogout: function() {
      const self = this;
      const now = new Date();
      const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5, 0);
      const msUntilMidnight = Math.max(1000, midnight.getTime() - now.getTime());

      if (this.midnightTimer) clearTimeout(this.midnightTimer);
      this.midnightTimer = setTimeout(function() {
        self.forceLogout('session.expiredMidnight');
      }, msUntilMidnight);

      if (this.midnightWatchInterval) clearInterval(this.midnightWatchInterval);
      this.midnightWatchInterval = setInterval(function() {
        if (!self.isSessionDateValid()) self.forceLogout('session.expiredMidnight');
      }, 60000);
    },

    /**
     * عند العودة للتبويب: فحص يوم الجلسة + قفل فوري إن تجاوز الخمول أثناء الإخفاء
     */
    setupVisibilityGuard: function() {
      const self = this;
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          self.stopSilentRefresh();
          return;
        }
        if (!self.isSessionDateValid()) {
          self.forceLogout('session.expiredMidnight');
          return;
        }
        if (!self.isLocked && (Date.now() - self.lastActivityAt) >= self.IDLE_LIMIT_MS) {
          self.lockScreen();
        }
        self.startSilentRefresh();
        self.performSilentRefresh(false);
      });

      window.addEventListener('focus', function() {
        if (document.hidden) return;
        if (!self.isSessionDateValid()) {
          self.forceLogout('session.expiredMidnight');
          return;
        }
        if (!self.isLocked && (Date.now() - self.lastActivityAt) >= self.IDLE_LIMIT_MS) {
          self.lockScreen();
        }
      });
    },

    /**
     * مراقبة خمول الموظف — أي تفاعل يعيد ضبط المؤقت (ما عدا أثناء القفل)
     */
    setupIdleWatcher: function() {
      const self = this;
      const resetIdle = function() {
        if (self.isLocked) return;
        self.lastActivityAt = Date.now();
        if (self.idleTimer) clearTimeout(self.idleTimer);
        self.idleTimer = setTimeout(function() { self.lockScreen(); }, self.IDLE_LIMIT_MS);
      };

      ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(function(evt) {
        document.addEventListener(evt, resetIdle, { passive: true });
      });

      resetIdle();
    },

    setAppShellInert: function(inert) {
      const shell = document.getElementById('appShell');
      if (!shell) return;
      if (inert) {
        shell.setAttribute('inert', '');
        shell.setAttribute('aria-hidden', 'true');
      } else {
        shell.removeAttribute('inert');
        shell.removeAttribute('aria-hidden');
      }
    },

    /**
     * قفل الشاشة تلقائياً — يُثبَّت على السيرفر ولا يُتجاوز بالريفرش
     */
    lockScreen: function() {
      const overlay = document.getElementById('lockOverlay');
      if (!overlay) return;
      if (this.isLocked) {
        overlay.classList.add('visible');
        var shellKeep = document.getElementById('appShell');
        if (shellKeep) shellKeep.style.visibility = 'hidden';
        return;
      }

      this.isLocked = true;
      document.body.classList.add('app-locked');
      this.stopSilentRefresh();
      this.setAppShellInert(true);
      var shell = document.getElementById('appShell');
      if (shell) shell.style.visibility = 'hidden';

      const session = this.getSession();
      const nameEl = document.getElementById('lockEmployeeName');
      if (nameEl) nameEl.textContent = session.username || '—';

      // تثبيت القفل على السيرفر فوراً
      try {
        google.script.run
          .withFailureHandler(function() { /* لا نمنع العرض المحلي */ })
          .lockActiveSession(session);
      } catch (e) {}

      overlay.classList.add('visible');
      overlay.onclick = function(e) {
        if (e.target === overlay) {
          e.preventDefault();
          e.stopPropagation();
          const pw = document.getElementById('lockPassword');
          if (pw) pw.focus();
        }
      };

      const pwInput = document.getElementById('lockPassword');
      if (pwInput) {
        pwInput.value = '';
        setTimeout(function() { pwInput.focus(); }, 50);
      }

      if (typeof AppUtils !== 'undefined') AppUtils.hideMessage('lockMessage');
      var lockCard = document.querySelector('.lock-card');
      if (lockCard && typeof AppI18n !== 'undefined') AppI18n.apply(lockCard);
    },

    /**
     * إلغاء القفل بعد التحقق الناجح من كلمة المرور
     */
    unlockScreen: function() {
      const overlay = document.getElementById('lockOverlay');
      if (overlay) overlay.classList.remove('visible');
      this.isLocked = false;
      document.body.classList.remove('app-locked');
      this.setAppShellInert(false);
      var shell = document.getElementById('appShell');
      if (shell) shell.style.visibility = '';
      this.lastActivityAt = Date.now();

      if (this.idleTimer) clearTimeout(this.idleTimer);
      const self = this;
      this.idleTimer = setTimeout(function() { self.lockScreen(); }, this.IDLE_LIMIT_MS);
      this.startSilentRefresh();
      this.performSilentRefresh(false);
      if (this._pendingDataLoad && typeof this.onSessionReady === 'function') {
        this._pendingDataLoad = false;
        this.onSessionReady(true);
      }
    },

    /**
     * عند الإقلاع: إن كانت الجلسة مقفلة على السيرفر أظهر القفل فوراً
     */
    enforceServerLockIfNeeded: function(done) {
      const self = this;
      const session = this.getSession();
      if (!session.username || !session.token) {
        if (done) done(false);
        return;
      }
      google.script.run
        .withSuccessHandler(function(res) {
          res = res || {};
          if (res.sessionExpired || !res.ok) {
            self.forceLogout(res.messageKey || 'session.expiredGeneric');
            if (done) done(false);
            return;
          }
          if (res.locked) {
            self.lockScreen();
          }
          if (done) done(true);
        })
        .withFailureHandler(function() {
          if (done) done(true);
        })
        .checkClientSession(session);
    },

    /**
     * إنهاء الجلسة إجبارياً (انتهاء يومي أو جلسة غير صالحة) والتوجيه لصفحة الدخول
     * @param {string} reasonKey - مفتاح ترجمة للسبب (يُعرض للمستخدم عبر تخزينه مؤقتاً)
     */
    forceLogout: function(reasonKey) {
      const session = this.getSession();
      // أوقف أي مؤقتات قد تعيد إطلاق forceLogout أو تفحص جلسة فارغة
      this.stopSilentRefresh();
      if (this.midnightTimer) { clearTimeout(this.midnightTimer); this.midnightTimer = null; }
      if (this.midnightWatchInterval) { clearInterval(this.midnightWatchInterval); this.midnightWatchInterval = null; }
      if (this.idleTimer) { clearTimeout(this.idleTimer); this.idleTimer = null; }

      try {
        // مهم: نمرّر الرمز حتى لا يُمسح دخول جديد لنفس المستخدم (سباق destroySession القديم)
        if (session.username && session.token) {
          google.script.run.destroySession(session.username, session.token);
        }
      } catch (e) { /* لا نمنع تسجيل الخروج حتى لو فشل استدعاء السيرفر */ }

      this.goToLogin(reasonKey || 'session.expiredGeneric');
    },

    /* ================= أحداث الواجهة ================= */

    bindEvents: function() {
      const self = this;

      const btnLogout = document.getElementById('btnLogout');
      if (btnLogout) btnLogout.addEventListener('click', function() {
        const session = self.getSession();
        self.stopSilentRefresh();
        try {
          if (session.username && session.token) {
            google.script.run.destroySession(session.username, session.token);
          }
        } catch (e) {}
        try { sessionStorage.clear(); } catch (e2) {}
        // النقرة = user activation → التوجيه للأعلى يعمل عادة
        const url = self.loginUrl_();
        try {
          if (window.top) window.top.location.href = url;
          else window.location.href = url;
        } catch (e3) {
          self.showLoginGate_('session.expiredGeneric');
        }
      });

      const btnSidebarToggle = document.getElementById('btnSidebarToggle');
      if (btnSidebarToggle) btnSidebarToggle.addEventListener('click', function() {
        self.toggleSidebar();
      });

      const btnThemeToggle = document.getElementById('btnThemeToggle');
      if (btnThemeToggle) btnThemeToggle.addEventListener('click', function() {
        self.toggleTheme();
      });

      const btnTranslate = document.getElementById('btnTranslate');
      if (btnTranslate) btnTranslate.addEventListener('click', function() {
        AppI18n.toggle();
      });

      const btnFullscreen = document.getElementById('btnFullscreen');
      if (btnFullscreen) btnFullscreen.addEventListener('click', function() {
        self.toggleFullscreen();
      });

      const btnSilentRefresh = document.getElementById('btnSilentRefresh');
      if (btnSilentRefresh) btnSilentRefresh.addEventListener('click', function() {
        self.performSilentRefresh(true);
      });

      document.addEventListener('fullscreenchange', function() {
        self.updateFullscreenIcon();
      });

      this.bindLockScreenEvents();
    },

    bindLockScreenEvents: function() {
      const lockForm = document.getElementById('lockForm');
      const lockEye = document.getElementById('lockEyeToggle');
      if (!lockForm) return;

      lockForm.addEventListener('submit', function(e) {
        e.preventDefault();
        AppLayout.submitUnlock();
      });

      if (lockEye) {
        lockEye.addEventListener('click', function() {
          const input = document.getElementById('lockPassword');
          const icon = document.getElementById('lockEyeIcon');
          const isHidden = input.type === 'password';
          input.type = isHidden ? 'text' : 'password';
          icon.innerHTML = '<path d="' + (isHidden
            ? 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z'
            : 'M12 6c-4.42 0-8.27 2.94-9.83 7 1.56 4.06 5.41 7 9.83 7s8.27-2.94 9.83-7C20.27 8.94 16.42 6 12 6zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z')
            + '"/>';
          input.focus();
        });
      }
    },

    submitUnlock: function() {
      const session = this.getSession();
      const password = document.getElementById('lockPassword').value;
      const btn = document.getElementById('lockUnlockBtn');
      const btnText = document.getElementById('lockUnlockBtnText');

      if (!password) return;

      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> ' + AppI18n.t('lock.unlocking');
      AppUtils.hideMessage('lockMessage');

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btnText.textContent = AppI18n.t('lock.unlock');

          if (res && res.sessionExpired) {
            AppLayout.forceLogout(res.messageKey || 'session.expiredGeneric');
            return;
          }
          if (res && res.sessionLocked) {
            AppLayout.lockScreen();
            return;
          }
          if (res && res.success) {
            AppLayout.unlockScreen();
          } else {
            const key = (res && res.code === 'INACTIVE') ? 'lock.notActive' : 'lock.wrongPassword';
            AppUtils.showMessage('lockMessage', AppI18n.t(key), 'danger');
            const card = document.querySelector('.lock-card');
            if (card) {
              card.classList.remove('lock-shake');
              void card.offsetWidth;
              card.classList.add('lock-shake');
            }
          }
        })
        .withFailureHandler(function() {
          btn.disabled = false;
          btnText.textContent = AppI18n.t('lock.unlock');
          AppUtils.showMessage('lockMessage', AppI18n.t('login.connectionError'), 'danger');
        })
        .unlockActiveSession(session, password);
    },

    toggleNavGroup: function(titleEl) {
      const sidebar = document.getElementById('appSidebar');
      if (sidebar.classList.contains('collapsed')) {
        this.setSidebarCollapsed(false);
        return;
      }
      titleEl.closest('.nav-group').classList.toggle('open');
    },

    /** يفتح مجموعة القسم النشط فقط ويطوي الباقي */
    syncNavGroupsForSection_: function(sectionId) {
      var activeItem = document.querySelector('.nav-item[data-section="' + sectionId + '"]');
      var activeGroup = activeItem ? activeItem.closest('.nav-group') : null;
      document.querySelectorAll('#sidebarNav .nav-group').forEach(function(group) {
        group.classList.toggle('open', !!activeGroup && group === activeGroup);
      });
    },

    initNetworkStatus_: function() {
      var self = this;
      this.updateNetworkStatus_();
      window.addEventListener('online', function() { self.updateNetworkStatus_(); });
      window.addEventListener('offline', function() { self.updateNetworkStatus_(); });
      if (this._netPollTimer) clearInterval(this._netPollTimer);
      this._netPollTimer = setInterval(function() { self.updateNetworkStatus_(); }, 8000);
    },

    updateNetworkStatus_: function() {
      var box = document.getElementById('sidebarNetStatus');
      var text = document.getElementById('sidebarNetStatusText');
      if (!box || !text) return;
      var online = typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
      box.classList.toggle('is-offline', !online);
      box.setAttribute('data-online', online ? '1' : '0');
      var key = online ? 'net.online' : 'net.offline';
      text.setAttribute('data-i18n', key);
      text.textContent = AppI18n.t(key);
    },

    navigateTo: function(sectionId, skipCallback) {
      if (this.isLocked) return;
      var prev = this.currentSection;
      this.currentSection = sectionId;

      document.querySelectorAll('.nav-item').forEach(function(item) {
        item.classList.toggle('active', item.dataset.section === sectionId);
      });

      document.querySelectorAll('.collapsed-nav-item').forEach(function(item) {
        item.classList.toggle('active', item.dataset.section === sectionId);
      });

      this.syncNavGroupsForSection_(sectionId);

      // تبديل لوحتين فقط بدل المرور على كل الأقسام (أخف بكثير)
      if (prev && prev !== sectionId) {
        var prevPanel = document.querySelector('.content-panel[data-section="' + prev + '"]');
        if (prevPanel) prevPanel.classList.remove('active');
      }
      var nextPanel = document.querySelector('.content-panel[data-section="' + sectionId + '"]');
      if (nextPanel) nextPanel.classList.add('active');
      else {
        document.querySelectorAll('.content-panel').forEach(function(panel) {
          panel.classList.toggle('active', panel.dataset.section === sectionId);
        });
      }

      this.updateSectionTitle(sectionId);

      if (!skipCallback && typeof this.onSectionChange === 'function') {
        this.onSectionChange(sectionId);
      }
    },

    updateSectionTitle: function(sectionId) {
      const titleKey = this.SECTION_TITLES[sectionId];
      const el = document.getElementById('activeSectionTitle');
      if (el && titleKey) el.textContent = AppI18n.t(titleKey);
    },

    toggleSidebar: function() {
      this.setSidebarCollapsed(!this.sidebarCollapsed);
    },

    setSidebarCollapsed: function(collapsed) {
      this.sidebarCollapsed = collapsed;
      const sidebar = document.getElementById('appSidebar');
      const shell = document.querySelector('.app-shell');
      sidebar.classList.toggle('collapsed', collapsed);
      if (shell) shell.classList.toggle('sidebar-collapsed', collapsed);
      localStorage.setItem('fx_sidebar_collapsed', collapsed);
    },

    toggleTheme: function() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('fx_theme', next);
      this.updateThemeIcon(next);
    },

    updateThemeIcon: function(theme) {
      const icon = document.getElementById('themeIcon');
      if (!icon) return;
      if (theme === 'dark') {
        icon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>';
      } else {
        icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
      }
    },

    toggleFullscreen: function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
      } else {
        document.exitFullscreen();
      }
    },

    updateFullscreenIcon: function() {
      const icon = document.getElementById('fullscreenIcon');
      const btn = document.getElementById('btnFullscreen');
      if (!icon || !btn) return;
      if (document.fullscreenElement) {
        icon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
        btn.title = AppI18n.t('nav.exitFullscreen');
      } else {
        icon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        btn.title = AppI18n.t('nav.fullscreen');
      }
    },

    updateLastUpdateTime: function(timeStr) {
      const el = document.getElementById('lastUpdateTime');
      if (!el) return;
      if (timeStr) {
        el.textContent = timeStr;
      } else {
        const now = new Date();
        el.textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }
    },

    stopSilentRefresh: function() {
      if (this.refreshInterval) {
        clearInterval(this.refreshInterval);
        this.refreshInterval = null;
      }
    },

    startSilentRefresh: function() {
      const self = this;
      this.stopSilentRefresh();
      if (document.hidden || this.isLocked) return;
      this.refreshInterval = setInterval(function() {
        self.performSilentRefresh(false);
      }, this.SILENT_REFRESH_MS);
    },

    performSilentRefresh: function(manual) {
      const self = this;
      if (!manual && (document.hidden || this.isLocked)) return;
      if (!this.isSessionDateValid()) {
        this.forceLogout('session.expiredMidnight');
        return;
      }

      const btn = document.getElementById('btnSilentRefresh');

      if (manual && btn) {
        btn.style.pointerEvents = 'none';
        btn.style.opacity = '0.5';
      }

      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.time) self.updateLastUpdateTime(result.time);
          else self.updateLastUpdateTime();

          if (result && result.sessionValid === false) {
            self.forceLogout('session.expiredGeneric');
            return;
          }
          if (result && result.sessionLocked) {
            self.lockScreen();
            if (manual && btn) {
              btn.style.pointerEvents = '';
              btn.style.opacity = '';
            }
            return;
          }

          if (!self.isLocked && self.silentRefreshCallback) self.silentRefreshCallback(manual);

          if (manual && btn) {
            btn.style.pointerEvents = '';
            btn.style.opacity = '';
          }
        })
        .withFailureHandler(function() {
          self.updateLastUpdateTime();
          if (manual && btn) {
            btn.style.pointerEvents = '';
            btn.style.opacity = '';
          }
        })
        .getSystemLastUpdate(this.getSession());
    },

    setEmployeeName: function(name) {
      const el = document.getElementById('employeeNameDisplay');
      if (el) el.textContent = name || '—';
    },

    showNotifBadge: function(show) {
      const badge = document.getElementById('notifBadge');
      if (badge) badge.classList.toggle('hidden', !show);
    }
  };
</script>
