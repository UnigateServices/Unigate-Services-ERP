<script>
  /**
   * إدارة المستلفين — مشرف فقط (إضافة / تعديل / حذف)
   * تظهر القائمة ديناميكياً في كل النظام بعد الحفظ
   */
  var ManageBorrowers = {
    ready: false,
    cache: [],
    loadedOnce: false,

    ensureReady: function() {
      if (typeof APP_INTERFACE !== 'undefined' && APP_INTERFACE !== 'supervisor') return;
      this.bindOnce();
      var panel = document.querySelector('.content-panel[data-section="manage-borrowers"]');
      if (panel) AppI18n.apply(panel);
      var self = this;
      if (!this.loadedOnce) setTimeout(function() { self.load(); }, 0);
    },

    bindOnce: function() {
      if (this.ready) return;
      this.ready = true;
      var self = this;
      var btnAdd = document.getElementById('btnBorrowerAdd');
      if (btnAdd) btnAdd.addEventListener('click', function() { self.openForm('add'); });
      var btnSave = document.getElementById('btnBorrowerSave');
      if (btnSave) btnSave.addEventListener('click', function() { self.save(); });
      var btnCancel = document.getElementById('btnBorrowerCancel');
      if (btnCancel) btnCancel.addEventListener('click', function() { self.closeForm(); });
      var btnRefresh = document.getElementById('btnBorrowerRefresh');
      if (btnRefresh) btnRefresh.addEventListener('click', function() { self.load(); });
    },

    load: function() {
      var tbody = document.getElementById('tbody-borrowers');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="3" class="log-empty">' + AppI18n.t('log.loading') + '</td></tr>';
      var self = this;
      google.script.run
        .withSuccessHandler(function(res) {
          res = res || {};
          if (AppLayout.handleAuthResult(res)) return;
          if (!res.success) {
            tbody.innerHTML = '<tr><td colspan="3" class="log-empty-warn">' +
              AppI18n.t(res.messageKey || 'auth.forbidden') + '</td></tr>';
            return;
          }
          self.loadedOnce = true;
          self.cache = res.rows || [];
          self.render(self.cache);
          if (typeof loadBorrowersFromServer === 'function') loadBorrowersFromServer();
        })
        .withFailureHandler(function() {
          tbody.innerHTML = '<tr><td colspan="3" class="log-empty-warn" data-i18n="form.err.connection">' +
            AppI18n.t('form.err.connection') + '</td></tr>';
        })
        .listManagedBorrowers(AppLayout.getSession());
    },

    render: function(rows) {
      var tbody = document.getElementById('tbody-borrowers');
      if (!tbody) return;
      var esc = AppUtils.escapeHtml;
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="log-empty">' + AppI18n.t('log.noRecords') + '</td></tr>';
        return;
      }
      var html = '';
      rows.forEach(function(row, idx) {
        var statusLabel = row.status === 'نشط'
          ? AppI18n.t('employees.statusActive')
          : AppI18n.t('employees.statusInactive');
        html += '<tr>' +
          '<td><b>' + esc(row.name) + '</b></td>' +
          '<td>' + esc(statusLabel) + '</td>' +
          '<td><div class="log-actions">' +
            '<button type="button" class="btn-log btn-log-edit" data-idx="' + idx + '">' + AppI18n.t('log.edit') + '</button>' +
            '<button type="button" class="btn-log btn-log-delete" data-idx="' + idx + '">' + AppI18n.t('log.delete') + '</button>' +
          '</div></td></tr>';
      });
      tbody.innerHTML = html;
      tbody.querySelectorAll('.btn-log-edit').forEach(function(btn) {
        btn.addEventListener('click', function() {
          ManageBorrowers.openForm('edit', ManageBorrowers.cache[Number(btn.getAttribute('data-idx'))]);
        });
      });
      tbody.querySelectorAll('.btn-log-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var row = ManageBorrowers.cache[Number(btn.getAttribute('data-idx'))];
          if (!row) return;
          if (typeof showCustomConfirm === 'function') {
            showCustomConfirm(AppI18n.t('borrowers.confirmDelete') + ' «' + row.name + '»؟', function() {
              ManageBorrowers.remove(row.name);
            });
          } else if (window.confirm(AppI18n.t('borrowers.confirmDelete'))) {
            ManageBorrowers.remove(row.name);
          }
        });
      });
    },

    openForm: function(mode, row) {
      var box = document.getElementById('borrowerFormBox');
      if (!box) return;
      box.classList.remove('hidden');
      document.getElementById('borrower-mode').value = mode;
      document.getElementById('borrower-original').value = (row && row.name) || '';
      document.getElementById('borrower-name').value = (row && row.name) || '';
      document.getElementById('borrower-status').value = (row && row.status) || 'نشط';
      AppSelect.destroy('borrower-status');
      if (document.getElementById('borrower-status')) AppSelect.enhance('borrower-status');
      AppUtils.hideMessage('borrowerMessage');
      var title = document.getElementById('borrowerFormTitle');
      if (title) {
        var key = mode === 'edit' ? 'borrowers.editTitle' : 'borrowers.addTitle';
        title.setAttribute('data-i18n', key);
        title.textContent = AppI18n.t(key);
      }
    },

    closeForm: function() {
      var box = document.getElementById('borrowerFormBox');
      if (box) box.classList.add('hidden');
      AppUtils.hideMessage('borrowerMessage');
    },

    remove: function(name) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (AppLayout.handleAuthResult(res)) return;
          if (!res || !res.success) {
            AppUtils.showMessageKey('borrowerMessage', (res && res.messageKey) || 'form.err.server', 'danger');
            return;
          }
          ManageBorrowers.load();
        })
        .saveManagedBorrower(AppLayout.getSession(), { mode: 'delete', originalName: name, name: name });
    },

    save: function() {
      var payload = {
        mode: document.getElementById('borrower-mode').value || 'add',
        name: (document.getElementById('borrower-name') || {}).value || '',
        status: (document.getElementById('borrower-status') || {}).value || 'نشط',
        originalName: (document.getElementById('borrower-original') || {}).value || ''
      };
      AppUtils.setLoadingState('btnBorrowerSave', true, AppI18n.t('form.savingServer'));
      var self = this;
      google.script.run
        .withSuccessHandler(function(res) {
          AppUtils.setLoadingState('btnBorrowerSave', false, '', AppI18n.t('employees.save'));
          if (AppLayout.handleAuthResult(res)) return;
          if (!res || !res.success) {
            AppUtils.showMessageKey('borrowerMessage', (res && res.messageKey) || 'form.err.server', 'danger');
            return;
          }
          AppUtils.showMessageKey('borrowerMessage', res.messageKey || 'borrowers.updated', 'success');
          self.closeForm();
          self.load();
        })
        .withFailureHandler(function(err) {
          AppUtils.setLoadingState('btnBorrowerSave', false, '', AppI18n.t('employees.save'));
          var detail = (err && (err.message || err)) ? String(err.message || err) : '';
          if (detail && typeof AppUtils.showMessage === 'function') {
            AppUtils.showMessage('borrowerMessage', AppI18n.t('form.err.connection') + (detail ? (' — ' + detail) : ''), 'danger');
          } else {
            AppUtils.showMessageKey('borrowerMessage', 'form.err.connection', 'danger');
          }
        })
        .saveManagedBorrower(AppLayout.getSession(), payload);
    }
  };

  if (typeof AppI18n !== 'undefined' && AppI18n.onChange) {
    AppI18n.onChange(function() {
      if (!ManageBorrowers.ready) return;
      var panel = document.querySelector('.content-panel[data-section="manage-borrowers"]');
      if (panel) AppI18n.apply(panel);
      if (ManageBorrowers.loadedOnce) ManageBorrowers.render(ManageBorrowers.cache || []);
    });
  }
</script>
