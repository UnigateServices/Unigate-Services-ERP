<style>
  /* ===================================================================
     صفحات المصادقة (تسجيل الدخول، استعادة كلمة السر، ...) — مشتركة
  =================================================================== */
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
    background: var(--bg-color);
  }

  .auth-page::before,
  .auth-page::after {
    content: '';
    position: absolute;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--primary-glow), transparent 70%);
    filter: blur(10px);
    pointer-events: none;
    z-index: 0;
  }

  .auth-page::before { top: -220px; right: -220px; }
  .auth-page::after { bottom: -220px; left: -220px; }

  .auth-toolbar {
    position: fixed;
    top: 20px;
    inset-inline-start: 20px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }

  .auth-toolbar .nav-btn {
    background: var(--surface-color);
    box-shadow: var(--shadow-sm);
  }

  .auth-card {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
    padding: 32px;
    animation: authFadeIn 0.45s ease;
  }

  @keyframes authFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 28px;
    gap: 0;
  }

  .auth-logo-icon {
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  .auth-logo-icon svg,
  .auth-logo-icon .app-brand-mark {
    width: 72px;
    height: 72px;
    display: block;
    object-fit: contain;
  }

  .auth-brand-name,
  .auth-brand-name.brand-powered {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 15px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: 0.2px;
    direction: ltr;
    text-align: center;
    line-height: 1.2;
  }

  .auth-brand-name .brand-powered-by,
  .brand-powered .brand-powered-by {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .auth-brand-name .brand-product,
  .brand-powered .brand-product {
    display: block;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--primary-color);
  }

  .auth-brand-name span { color: var(--primary-color); }

  .auth-brand-sub {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: var(--text-muted);
    text-transform: none;
    margin-top: 10px;
  }

  .auth-footer-brand {
    direction: ltr;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  /* حقل إدخال بأيقونة داخلية (كلمة المرور / السهم) */
  .input-wrap { position: relative; }

  .input-wrap input,
  .input-wrap select {
    padding-inline-end: 42px;
  }

  .input-icon-btn {
    position: absolute;
    top: 50%;
    inset-inline-end: 6px;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    opacity: 0.55;
    transition: all 0.2s;
    padding: 0;
    color: var(--text-secondary);
  }

  .input-icon-btn svg {
    width: 19px;
    height: 19px;
    fill: currentColor;
  }

  .input-icon-btn:hover {
    opacity: 1;
    background: var(--surface-hover);
  }

  .input-icon-btn.active { opacity: 1; color: var(--primary-color); }

  /* قائمة منسدلة مخصصة المظهر */
  .select-wrap { position: relative; }

  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    padding-inline-end: 38px;
    cursor: pointer;
  }

  .select-wrap .select-arrow {
    position: absolute;
    top: 50%;
    inset-inline-end: 12px;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--text-muted);
    font-size: 11px;
    transition: transform 0.2s;
  }

  .select-wrap select:focus ~ .select-arrow { color: var(--primary-color); }

  .auth-submit-btn {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .auth-footer {
    text-align: center;
    margin-top: 22px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .spinner {
    width: 15px;
    height: 15px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 420px) {
    .auth-card { padding: 24px; }
    .auth-toolbar { top: 12px; inset-inline-start: 12px; }
  }

  /* ===== هيكل التطبيق ===== */
  .app-shell {
    display: flex;
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
  }

  /* ===== السايد بار ===== */
  .sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100vh;
    position: fixed;
    top: 0;
    inset-inline-start: 0;
    background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--surface-color) 100%);
    border-inline-end: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    z-index: 200;
    transition: width var(--transition), min-width var(--transition);
    overflow: hidden;
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.12);
  }

  html[dir="ltr"] .sidebar { box-shadow: -4px 0 24px rgba(0, 0, 0, 0.12); }

  .sidebar.collapsed {
    width: var(--sidebar-collapsed-width);
    min-width: var(--sidebar-collapsed-width);
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 18px;
    border-bottom: 1px solid var(--border-color);
    min-height: 72px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    min-width: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg,
  .logo-icon .app-brand-mark {
    width: 40px;
    height: 40px;
    display: block;
    object-fit: contain;
  }

  .logo-text,
  .logo-text.brand-powered {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1px;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-primary);
    white-space: nowrap;
    letter-spacing: 0.2px;
    direction: ltr;
    line-height: 1.15;
    min-width: 0;
  }

  .logo-text .brand-powered-by {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .logo-text .brand-product {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--primary-color);
  }

  .logo-text span { color: var(--primary-color); }

  .sidebar.collapsed .logo-text { opacity: 0; width: 0; overflow: hidden; }

  .app-brand-mark {
    display: block;
    user-select: none;
    /* نهار: اللوغو أسود على خلفية شفافة */
  }

  /*
   * ليلي: شكل اللوغو فقط — بدون مربع/خلفية إضافية —
   * قلب اللون ليظهر أبيض فوق الخلفية الداكنة
   */
  html[data-theme="dark"] .logo-icon .app-brand-mark,
  html[data-theme="dark"] .auth-logo-icon .app-brand-mark {
    filter: brightness(0) invert(1);
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 0;
  }

  /* السكرول يُورَّث من التنسيق العام الموحّد */

  .nav-group { margin-bottom: 4px; }

  .nav-group-title {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
    white-space: nowrap;
  }

  .nav-group-title:hover { color: var(--text-primary); }

  .nav-group-title .nav-icon {
    width: 20px;
    height: 20px;
    min-width: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }

  .nav-group-title .nav-icon svg { width: 18px; height: 18px; fill: currentColor; }

  .nav-group-title .chevron {
    margin-inline-start: auto;
    transition: transform 0.2s;
    font-size: 10px;
    color: var(--text-muted);
  }

  .nav-group.open .nav-group-title .chevron { transform: rotate(180deg); }

  .sidebar.collapsed .nav-group-title span.label,
  .sidebar.collapsed .nav-group-title .chevron { display: none; }

  .sidebar.collapsed .nav-group-title { justify-content: center; padding: 12px 0; }

  .nav-subitems {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
  }

  .nav-group.open .nav-subitems { max-height: 480px; }

  .sidebar.collapsed .nav-subitems { display: none; }

  .collapsed-nav { display: none; padding: 8px 0; }
  .sidebar.collapsed .collapsed-nav { display: block; }
  .sidebar.collapsed .nav-group { display: none; }

  .collapsed-nav-item {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; margin: 4px auto;
    border-radius: 10px; cursor: pointer;
    color: var(--text-muted); transition: all 0.2s;
  }
  .collapsed-nav-item:hover { background: var(--surface-hover); color: var(--text-primary); }
  .collapsed-nav-item.active { background: var(--accent-soft-strong); color: var(--primary-color); }
  .collapsed-nav-item svg { width: 20px; height: 20px; fill: currentColor; }
  .collapsed-divider { height: 1px; background: var(--border-color); margin: 8px 14px; }

  /* مؤشر الاتصال أسفل السايد بار */
  .sidebar-net-status {
    flex-shrink: 0;
    margin: 10px 12px 14px;
    padding: 12px 14px;
    border-radius: 12px;
    background: linear-gradient(145deg, rgba(0, 168, 107, 0.08), rgba(0, 0, 0, 0.22));
    border: 1px solid rgba(0, 168, 107, 0.28);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  html[data-theme="light"] .sidebar-net-status {
    background: linear-gradient(145deg, rgba(0, 168, 107, 0.08), rgba(255, 255, 255, 0.7));
    border-color: rgba(0, 168, 107, 0.22);
  }
  .sidebar-net-status.is-offline {
    background: linear-gradient(145deg, rgba(239, 68, 68, 0.1), rgba(0, 0, 0, 0.22));
    border-color: rgba(239, 68, 68, 0.35);
  }
  html[data-theme="light"] .sidebar-net-status.is-offline {
    background: linear-gradient(145deg, rgba(239, 68, 68, 0.08), rgba(255, 255, 255, 0.7));
  }
  .net-status-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .net-status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--primary-color);
  }
  .net-status-dot {
    position: relative;
    width: 10px;
    height: 10px;
    min-width: 10px;
    border-radius: 50%;
    background: var(--primary-color);
    box-shadow: 0 0 0 0 rgba(0, 168, 107, 0.55);
  }
  .net-status-pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: inherit;
    animation: netPulse 1.8s ease-out infinite;
  }
  @keyframes netPulse {
    0% { transform: scale(1); opacity: 0.75; }
    70% { transform: scale(2.4); opacity: 0; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  .sidebar-net-status.is-offline .net-status-row { color: #ef4444; }
  .sidebar-net-status.is-offline .net-status-dot {
    background: #ef4444;
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55);
  }
  .sidebar-net-status.is-offline .net-status-pulse {
    animation-name: netPulseOffline;
  }
  @keyframes netPulseOffline {
    0% { transform: scale(1); opacity: 0.7; }
    70% { transform: scale(2.2); opacity: 0; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .sidebar.collapsed .sidebar-net-status {
    margin: 8px auto 14px;
    padding: 10px 0;
    width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar.collapsed .net-status-label,
  .sidebar.collapsed .net-status-text { display: none; }
  .sidebar.collapsed .net-status-row { justify-content: center; gap: 0; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-block: 9px;
    padding-inline: 18px 32px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    border-inline-start: 3px solid transparent;
    white-space: nowrap;
  }

  .nav-item:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
  }

  .nav-item.active {
    color: var(--primary-color);
    background: var(--accent-soft);
    border-inline-start-color: var(--primary-color);
    font-weight: 600;
  }

  .nav-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    min-width: 6px;
  }

  .nav-item.active .dot { background: var(--primary-color); }

  /* ===== المحتوى الرئيسي ===== */
  .main-wrapper {
    flex: 1;
    margin-inline-start: var(--sidebar-width);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    height: 100vh;
    overflow: hidden;
    transition: margin-inline-start var(--transition);
  }

  .sidebar.collapsed ~ .main-wrapper,
  .app-shell.sidebar-collapsed .main-wrapper {
    margin-inline-start: var(--sidebar-collapsed-width);
  }

  /* ===== الناف بار ===== */
  .top-navbar {
    height: var(--navbar-height);
    min-height: var(--navbar-height);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    box-shadow: 0 1px 0 var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 12px;
  }

  .navbar-start {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .navbar-center {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: center;
    min-width: 0;
  }

  .navbar-end {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .nav-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
    padding: 0;
  }

  .nav-btn:hover {
    background: var(--surface-hover);
    color: var(--primary-color);
    border-color: var(--primary-color);
  }

  .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .nav-btn.danger {
    color: #fff;
    background: var(--danger-color);
    border-color: var(--danger-color);
  }

  .nav-btn.danger:hover {
    color: #fff;
    background: #c62828;
    border-color: #b71c1c;
    box-shadow: 0 0 0 3px rgba(248, 81, 73, 0.35);
    transform: translateY(-1px);
  }

  .nav-btn .badge-dot {
    position: absolute;
    top: 6px;
    inset-inline-end: 6px;
    width: 7px;
    height: 7px;
    background: var(--danger-color);
    border-radius: 50%;
    border: 1.5px solid var(--bg-secondary);
  }

  .employee-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--accent-soft-strong);
    border: 1px solid rgba(0, 168, 107, 0.35);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--primary-color);
    white-space: nowrap;
    box-shadow: 0 2px 8px var(--primary-glow);
  }

  .employee-pill svg { width: 16px; height: 16px; fill: currentColor; }

  .last-update-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--surface-hover);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .last-update-pill .update-time {
    color: var(--text-secondary);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .section-title-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
  }

  .section-title-nav .status-dot {
    width: 8px;
    height: 8px;
    background: var(--primary-color);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--primary-glow);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .sidebar-toggle-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    padding: 0;
  }

  .sidebar-toggle-btn:hover {
    background: var(--surface-hover);
    color: var(--primary-color);
  }

  .sidebar-toggle-btn svg { width: 20px; height: 20px; fill: currentColor; }

  /* ===== منطقة المحتوى — السكرول الوحيد في الواجهة ===== */
  .main-content {
    flex: 1;
    min-height: 0;
    padding: 20px 24px;
    overflow-x: hidden;
    overflow-y: auto;
    background:
      radial-gradient(ellipse 80% 40% at 100% 0%, var(--accent-soft) 0%, transparent 55%),
      radial-gradient(ellipse 60% 30% at 0% 100%, var(--accent-soft) 0%, transparent 50%),
      var(--bg-color);
  }

  /* بدون animation عند التبديل — أسرع وأقل تعليق على أقسام المشرف */
  .content-panel {
    display: none;
    content-visibility: hidden;
  }
  .content-panel.active {
    display: block;
    content-visibility: visible;
  }

  /* ===================================================================
     شاشة القفل التلقائي (Idle Lock Screen) — مشتركة لكل الواجهات المصادَق عليها
  =================================================================== */
  .lock-overlay {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--bg-color) 85%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 5000;
    padding: 20px;
    user-select: none;
  }

  .lock-overlay.visible { display: flex; }
  .lock-overlay .lock-card { user-select: text; pointer-events: auto; }
  body.app-locked #appShell { pointer-events: none !important; }

  .lock-card {
    width: 100%;
    max-width: 380px;
    text-align: center;
    padding: 32px;
    animation: authFadeIn 0.3s ease;
  }

  .lock-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--primary-color), #006644);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px var(--primary-glow);
  }

  .lock-icon svg { width: 28px; height: 28px; fill: #fff; }

  .lock-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .lock-employee-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary-color);
    margin-bottom: 10px;
  }

  .lock-subtitle {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 22px;
    line-height: 1.6;
  }

  .lock-card .form-group { text-align: start; }

  .lock-shake { animation: lockShake 0.4s; }

  @keyframes lockShake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  /* ===== استجابة الشاشات الصغيرة ===== */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(100%);
      width: var(--sidebar-width) !important;
      min-width: var(--sidebar-width) !important;
    }

    html[dir="ltr"] .sidebar { transform: translateX(-100%); }
