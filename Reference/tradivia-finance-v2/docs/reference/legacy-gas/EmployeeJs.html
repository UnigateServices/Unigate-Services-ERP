<script>
  window.recentTransactionsCache = { incomes: [], outcomes: [], exchanges: [], transfers: [], advances: [] };
  window.fundsBalancesCache = { vault: [], sham: [], advances: [], banks: [] };
  let confirmCallback = null;

  var FUND_VISIBILITY = {
    vaultSham: ['add-income', 'add-outcome', 'add-exchange', 'add-transfer'],
    bank: ['add-income', 'add-outcome', 'add-exchange', 'add-transfer'],
    advances: ['add-transfer', 'add-advances']
  };

  /* ===== إقلاع الواجهة ===== */
  function initEmployeeDashboard() {
    // لا نوجّه تلقائياً عبر window.top هنا — ذلك يرمي SecurityError داخل iframe GAS
    // بدون جلسة: بوابة تسجيل الدخول بزر قابل للنقر (تفعيل مستخدم)
    if (!AppLayout.hasClientSession()) {
      try { AppI18n.init(); } catch (e) {}
      AppLayout.forceLogout('session.loginRequired');
      return;
    }

    // فصل الواجهتين: مشرف لا يعمل داخل Employee.html والعكس
    var shell = (typeof APP_INTERFACE !== 'undefined') ? APP_INTERFACE : 'employee';
    var isSupervisor = (sessionStorage.getItem('fx_user_role') || '') === 'مشرف';
    if (shell === 'supervisor' && !isSupervisor) {
      try { sessionStorage.setItem('fx_login_portal', 'supervisor'); } catch (e1) {}
      try { AppI18n.init(); } catch (e2) {}
      AppLayout.forceLogout('login.wrongPortal');
      return;
    }
    if (shell === 'employee' && isSupervisor) {
      try { sessionStorage.setItem('fx_login_portal', 'supervisor'); } catch (e3) {}
      try { AppI18n.init(); } catch (e4) {}
      AppLayout.forceLogout('login.wrongPortal');
      return;
    }

    const empName = sessionStorage.getItem('currentUser') || 'موظف غير معروف';

    buildAddForms();
    loadBorrowersFromServer();
    AppI18n.apply();

    AppLayout.init({
      onSilentRefresh: function(manual) {
        refreshVisibleAppData(!!manual);
      },
      onSessionReady: function(canLoad) {
        if (document.getElementById('fxLoginGate')) return;
        AppLayout.setEmployeeName(empName);
        AppLayout.onSectionChange = onSectionChange;
        onSectionChange(AppLayout.currentSection);
        var btnNotif = document.getElementById('btnNotifications');
        if (btnNotif && !btnNotif._boundNotif) {
          btnNotif._boundNotif = true;
          btnNotif.addEventListener('click', toggleNotifications);
        }
        // لا تحمّل البيانات والشاشة مقفلة — بعد فتح القفل يُستدعى مجدداً
        if (!canLoad || AppLayout.isLocked) return;
        updateSafeBalances();
        loadTransactions();
        checkNotificationsBadge();
        if (typeof loadBorrowersFromServer === 'function') loadBorrowersFromServer();
        if (typeof loadProjectsFromServer === 'function') loadProjectsFromServer();
        if (typeof loadBanksFromServer === 'function') loadBanksFromServer();
      }
    });
  }

  function onSectionChange(sectionId) {
    const balancesBar = document.getElementById('balancesBar');
    const showVaultSham = FUND_VISIBILITY.vaultSham.indexOf(sectionId) !== -1;
    const showBank = FUND_VISIBILITY.bank.indexOf(sectionId) !== -1;
    const showAdvances = FUND_VISIBILITY.advances.indexOf(sectionId) !== -1;
    const showBar = showVaultSham || showBank || showAdvances;

    balancesBar.style.display = showBar ? 'grid' : 'none';

    const vaultCard = document.getElementById('fundCardVault');
    const shamCard = document.getElementById('fundCardSham');
    const bankCard = document.getElementById('fundCardBank');
    const advancesCard = document.getElementById('fundCardAdvances');

    if (vaultCard) vaultCard.classList.toggle('hidden', !showVaultSham);
    if (shamCard) shamCard.classList.toggle('hidden', !showVaultSham);
    if (bankCard) bankCard.classList.toggle('hidden', !showBank);
    if (advancesCard) advancesCard.classList.toggle('hidden', !showAdvances);

    // تأجيل تهيئة الأقسام الثقيلة بعد رسم القسم — يمنع صفن المتصفح 5+ ثوانٍ
    if (sectionId === 'monitor-ops' && typeof MonitorOps !== 'undefined') {
      scheduleSectionWork_(function() { MonitorOps.ensureReady(); });
    }
    if (sectionId === 'system-reports' && typeof ensureSystemReportsReady === 'function') {
      scheduleSectionWork_(function() { ensureSystemReportsReady(); });
    }
    if (sectionId === 'opening-balance' && typeof OpeningBalance !== 'undefined') {
      scheduleSectionWork_(function() { OpeningBalance.ensureReady(); });
    }
    if (sectionId === 'log-opening' && typeof OpeningLog !== 'undefined') {
      scheduleSectionWork_(function() { OpeningLog.ensureReady(); });
    }
    if (sectionId === 'manage-employees' && typeof ManageEmployees !== 'undefined') {
      scheduleSectionWork_(function() { ManageEmployees.ensureReady(); });
    }
    if (sectionId === 'manage-borrowers' && typeof ManageBorrowers !== 'undefined') {
      scheduleSectionWork_(function() { ManageBorrowers.ensureReady(); });
    }
    if (sectionId === 'manage-projects' && typeof ManageProjects !== 'undefined') {
      scheduleSectionWork_(function() { ManageProjects.ensureReady(); });
    }
    if (sectionId === 'manage-banks' && typeof ManageBanks !== 'undefined') {
      scheduleSectionWork_(function() { ManageBanks.ensureReady(); });
    }
    if (sectionId === 'employee-funds' && typeof EmployeeFunds !== 'undefined') {
      scheduleSectionWork_(function() { EmployeeFunds.ensureReady(); });
    }
    if (sectionId === 'reports' && typeof setReportUiMode === 'function') {
      setReportUiMode('employee');
    }
  }

  var _sectionWorkTimer = null;
  function resetLogAdvancedFlags_() {
    if (typeof LOG_META === 'undefined') return;
    window.advancedSearchCache = {};
    Object.keys(LOG_META).forEach(function(tbodyId) {
      var tbody = document.getElementById(tbodyId);
      if (tbody) tbody.dataset.advanced = 'false';
      var reset = document.getElementById(LOG_META[tbodyId].reset);
      if (reset) reset.classList.add('hidden');
    });
  }

  /** تحديث بيانات الواجهة الظاهرة دون إعادة تحميل الصفحة */
  function refreshVisibleAppData(forceServer) {
    if (typeof updateSafeBalances === 'function') updateSafeBalances(!!forceServer);
    resetLogAdvancedFlags_();
    if (typeof loadTransactions === 'function') loadTransactions();
    if (typeof checkNotificationsBadge === 'function') checkNotificationsBadge();
    if (typeof invalidateNotifCache_ === 'function') invalidateNotifCache_();
    if (typeof refreshNotifTabCounts_ === 'function') refreshNotifTabCounts_(true);
    var notifModal = document.getElementById('notificationsModal');
    if (notifModal && notifModal.style.display === 'flex' && typeof loadNotifsFeed === 'function') {
      loadNotifsFeed(true, true);
    }
    if (typeof refreshAllOpNumbers === 'function') refreshAllOpNumbers();
    if (typeof loadBorrowersFromServer === 'function') loadBorrowersFromServer();
    if (typeof loadProjectsFromServer === 'function') loadProjectsFromServer();
    if (typeof loadBanksFromServer === 'function') loadBanksFromServer();

    var section = (typeof AppLayout !== 'undefined') ? AppLayout.currentSection : '';
    if (section === 'monitor-ops' && typeof MonitorOps !== 'undefined' && MonitorOps.initialized) {
      var monitorBody = document.getElementById('tbody-monitor');
      if (monitorBody && monitorBody.dataset.loaded) MonitorOps.runSearch();
    }
    if (section === 'manage-employees' && typeof ManageEmployees !== 'undefined' && typeof ManageEmployees.load === 'function') {
      ManageEmployees.load();
    }
    if (section === 'manage-borrowers' && typeof ManageBorrowers !== 'undefined' && typeof ManageBorrowers.load === 'function') {
      ManageBorrowers.load();
    }
    if (section === 'manage-projects' && typeof ManageProjects !== 'undefined' && typeof ManageProjects.load === 'function') {
      ManageProjects.load();
    }
    if (section === 'manage-banks' && typeof ManageBanks !== 'undefined' && typeof ManageBanks.load === 'function') {
      ManageBanks.load();
    }
    if (section === 'employee-funds' && typeof EmployeeFunds !== 'undefined') {
      if (typeof EmployeeFunds.loadOverview === 'function') EmployeeFunds.loadOverview();
    }
    if (section === 'log-opening' && typeof OpeningLog !== 'undefined' && typeof OpeningLog.reload === 'function') {
      OpeningLog.reload();
    }
    if (section === 'opening-balance' && typeof OpeningBalance !== 'undefined') {
      OpeningBalance.employeesLoaded = false;
      if (typeof OpeningBalance.loadEmployees === 'function') OpeningBalance.loadEmployees();
    }
    if ((section === 'reports' || section === 'system-reports') && typeof runSelectedReport === 'function') {
      if (typeof lastReportResult !== 'undefined' && lastReportResult) runSelectedReport();
    }
  }

  function scheduleSectionWork_(fn) {
    if (_sectionWorkTimer) clearTimeout(_sectionWorkTimer);
    // إطاران رسم ثم setTimeout — القسم يظهر فوراً قبل أي تهيئة
    _sectionWorkTimer = setTimeout(function() {
      _sectionWorkTimer = null;
      requestAnimationFrame(function() {
        setTimeout(function() {
          try { fn(); } catch (e) { /* لا نكسر التنقل */ }
        }, 0);
      });
    }, 0);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initEmployeeDashboard);
  } else {
    initEmployeeDashboard();
  }

  /* ===== الحسابات ===== */
  function handleExchangeLogic() {
    const typeEl = document.getElementById('exchange-type');
    if (!typeEl) return;
    const exType = typeEl.value;
    const paid = exType === 'شراء' ? 'ليرة سورية' : 'دولار';
    const received = exType === 'شراء' ? 'دولار' : 'ليرة سورية';
    const paidEl = document.getElementById('exchange-paid');
    const recEl = document.getElementById('exchange-received');
    const paidDisp = document.getElementById('exchange-paid-display');
    const recDisp = document.getElementById('exchange-received-display');
    if (paidEl) paidEl.value = paid;
    if (recEl) recEl.value = received;
    if (paidDisp) paidDisp.value = typeof currencyLabel === 'function' ? currencyLabel(paid) : paid;
    if (recDisp) recDisp.value = typeof currencyLabel === 'function' ? currencyLabel(received) : received;
    calculateTotal('exchange');
  }

  /** اتجاه التصريف لنموذج ما: تصريف الصندوق يشتقّه من النوع، والسلف من قائمتَي العملة */
  function exchangeFormDirection(prefix) {
    if (prefix === 'exchange') {
      return {
        from: (document.getElementById('exchange-paid') || {}).value || '',
        to: (document.getElementById('exchange-received') || {}).value || ''
      };
    }
    return {
      from: (document.getElementById(prefix + '-fromCurrency') || {}).value || '',
      to: (document.getElementById(prefix + '-toCurrency') || {}).value || ''
    };
  }

  function calculateTotal(prefix) {
    const totalInput = document.getElementById(prefix + '-total');
    if (!totalInput) return;
    let total = 0;
    const rateEl = document.getElementById(prefix + '-rate');
    if (rateEl) {
      const dir = exchangeFormDirection(prefix);
      const amt = AppUtils.parseFormattedNumber((document.getElementById(prefix + '-amount') || {}).value) || 0;
      const rate = AppUtils.parseFormattedNumber(rateEl.value) || 0;
      total = AppUtils.convertByRate(amt, rate, dir.from, dir.to);
      AppUtils.setFieldCurrencyTag(prefix + '-amount-cur', dir.from);
      AppUtils.setFieldCurrencyTag(prefix + '-total-cur', dir.to);
    } else {
      const qty = AppUtils.parseFormattedNumber((document.getElementById(prefix + '-quantity') || {}).value) || 0;
      const amt = AppUtils.parseFormattedNumber((document.getElementById(prefix + '-amount') || {}).value) || 0;
      total = Number(qty) * Number(amt);
    }
    if (total > 0) {
      const absTxt = AppUtils.formatSignedNumber(total);
      totalInput.value = String(absTxt).replace(/[()]/g, '');
    } else {
      totalInput.value = '';
    }
  }

  function currencyCodeFromName(name) {
    if (name === 'دولار' || name === 'USD') return 'USD';
    if (name === 'ليرة سورية' || name === 'SYP') return 'SYP';
    return String(name || '').slice(0, 6).toUpperCase() || '—';
  }

  function renderCurrencyFundBody(containerId, currencies, emptyKey) {
    const body = document.getElementById(containerId);
    if (!body) return;

    if (!currencies || currencies.length === 0) {
      body.innerHTML = '<div class="fund-empty">' + AppI18n.t(emptyKey || 'safe.empty') + '</div>';
      return;
    }

    body.innerHTML = currencies.map(function(item) {
      const amount = Number(item.amount) || 0;
      const neg = amount < 0 ? ' is-negative' : '';
      const rawName = item.currency || item.name || '';
      const label = typeof currencyLabel === 'function' ? currencyLabel(rawName) : rawName;
      return '<div class="fund-currency-cell">' +
        '<div class="fund-currency-amount' + neg + '">' + AppUtils.formatSignedNumber(amount) + '</div>' +
        '<div class="fund-currency-code">' + AppUtils.escapeHtml(label) + '</div>' +
        '</div>';
    }).join('');
  }

  function renderAdvancesFundBody(borrowers) {
    const body = document.getElementById('fundBodyAdvances');
    if (!body) return;

    if (!borrowers || borrowers.length === 0) {
      body.innerHTML = '<div class="fund-empty">' + AppI18n.t('safe.emptyAdvances') + '</div>';
      return;
    }

    body.innerHTML = borrowers.map(function(b) {
      const name = AppUtils.escapeHtml(
        typeof borrowerLabel === 'function' ? borrowerLabel(b.name) : (b.name || '—')
      );
      const bals = b.balances || b.currencies || [];
      const lines = bals.map(function(c) {
        const amount = Number(c.amount) || 0;
        const neg = amount < 0 ? ' is-negative' : '';
        const rawName = c.currency || '';
        const label = typeof currencyLabel === 'function' ? currencyLabel(rawName) : rawName;
        return '<div class="fund-borrower-line">' +
          '<div class="fund-currency-amount' + neg + '">' + AppUtils.formatSignedNumber(amount) + '</div>' +
          '<div class="fund-currency-code">' + AppUtils.escapeHtml(label) + '</div>' +
          '</div>';
      }).join('');

      return '<div class="fund-borrower-cell">' +
        '<div class="fund-borrower-name">' + name + '</div>' +
        '<div class="fund-borrower-balances">' + (lines || '<span class="fund-empty">—</span>') + '</div>' +
        '</div>';
    }).join('');
  }

  function renderBanksFundBody(banks) {
    const body = document.getElementById('fundBodyBank');
    if (!body) return;

    if (!banks || banks.length === 0) {
      body.innerHTML = '<div class="fund-empty">' + AppI18n.t('safe.emptyBanks') + '</div>';
      return;
    }

    body.innerHTML = banks.map(function(b) {
      const name = AppUtils.escapeHtml(b.name || '—');
      const bals = b.balances || b.currencies || [];
      const lines = bals.map(function(c) {
        const amount = Number(c.amount) || 0;
        const neg = amount < 0 ? ' is-negative' : '';
        const rawName = c.currency || c.code || '';
        const label = typeof currencyLabel === 'function' ? currencyLabel(rawName) : rawName;
        return '<div class="fund-borrower-line">' +
          '<div class="fund-currency-amount' + neg + '">' + AppUtils.formatSignedNumber(amount) + '</div>' +
          '<div class="fund-currency-code">' + AppUtils.escapeHtml(label) + '</div>' +
          '</div>';
      }).join('');

      return '<div class="fund-borrower-cell">' +
        '<div class="fund-borrower-name">' + name + '</div>' +
        '<div class="fund-borrower-balances">' + (lines || '<span class="fund-empty">—</span>') + '</div>' +
        '</div>';
    }).join('');
  }

  function renderFundsBalances(funds) {
    funds = funds || {};
    window.fundsBalancesCache = {
      vault: funds.vault || [],
      sham: funds.sham || [],
      advances: funds.advances || [],
      banks: funds.banks || []
    };
    renderCurrencyFundBody('fundBodyVault', window.fundsBalancesCache.vault, 'safe.empty');
    renderCurrencyFundBody('fundBodySham', window.fundsBalancesCache.sham, 'safe.empty');
    renderBanksFundBody(window.fundsBalancesCache.banks);
    renderAdvancesFundBody(window.fundsBalancesCache.advances);
  }

  function updateSafeBalances(skipCache) {
    google.script.run
      .withSuccessHandler(function(response) {
        if (!response) return;
        if (AppLayout.handleAuthResult(response)) return;
        if (!response.success) return;

        if (response.funds) {
          renderFundsBalances(response.funds);
          return;
        }

        // توافق خلفي مع الاستجابة القديمة { usd, syp }
        const vault = [];
        if (typeof response.usd === 'number') {
          vault.push({ currency: 'دولار', code: 'USD', amount: response.usd });
        }
        if (typeof response.syp === 'number') {
          vault.push({ currency: 'ليرة سورية', code: 'SYP', amount: response.syp });
        }
        renderFundsBalances({ vault: vault, sham: [], advances: [], banks: [] });
      })
      .getSafeBalances(AppLayout.getSession(), !!skipCache);
  }

  if (typeof AppI18n !== 'undefined' && AppI18n.onChange) {
    AppI18n.onChange(function() {
      renderFundsBalances(window.fundsBalancesCache);
      if (typeof handleExchangeLogic === 'function') handleExchangeLogic();
    });
  }

  /* ===== نوافذ مخصصة ===== */
  function showCustomConfirm(msg, callback) {
    document.getElementById('customConfirmMessage').textContent = msg;
    confirmCallback = callback;
    document.getElementById('customConfirmModal').style.display = 'flex';
  }
  function closeCustomConfirm() {
    document.getElementById('customConfirmModal').style.display = 'none';
    confirmCallback = null;
  }
  document.getElementById('btnCustomConfirm').addEventListener('click', function() {
    const cb = confirmCallback;
    closeCustomConfirm();
    if (cb) cb();
  });
  function showCustomAlert(msg) {
    var el = document.getElementById('customAlertMessage');
    el.style.whiteSpace = 'pre-line';
    el.textContent = msg;
    document.getElementById('customAlertModal').style.display = 'flex';
  }
  function closeCustomAlert() { document.getElementById('customAlertModal').style.display = 'none'; }

  /* ===== الإشعارات ===== */
  var notifState = { category: 'pending', offset: 0, limit: 10, hasMore: false, loading: false };
  var notifCache = { pending: null, approved: null, rejected: null, ts: {}, ttlMs: 60000, counts: null, countsTs: 0 };
  var notifItemByAudit_ = {};

  function invalidateNotifCache_(cat) {
    if (cat) {
      notifCache[cat] = null;
      delete notifCache.ts[cat];
    } else {
      notifCache.pending = notifCache.approved = notifCache.rejected = null;
      notifCache.ts = {};
    }
    notifCache.counts = null;
    notifCache.countsTs = 0;
    notifItemByAudit_ = {};
  }

  function checkNotificationsBadge() {
    google.script.run
      .withSuccessHandler(function(res) {
        AppLayout.showNotifBadge(res && res.count > 0);
      })
      .withFailureHandler(function() {})
      .getPendingNotificationsCount(AppLayout.getSession());
  }

  function refreshNotifTabCounts_(force) {
    if (!force && notifCache.counts && (Date.now() - notifCache.countsTs < notifCache.ttlMs)) {
      applyNotifTabCounts_(notifCache.counts);
      return;
    }
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) return;
        notifCache.counts = res;
        notifCache.countsTs = Date.now();
        applyNotifTabCounts_(res);
      })
      .withFailureHandler(function() {})
      .getNotificationTabCounts(AppLayout.getSession());
  }

  function applyNotifTabCounts_(counts) {
    ['pending', 'approved', 'rejected'].forEach(function(cat) {
      var el = document.querySelector('.notif-tab-count[data-count-cat="' + cat + '"]');
      if (!el) return;
      var n = Number(counts[cat]) || 0;
      el.textContent = n > 0 ? String(n) : '';
      el.classList.toggle('is-empty', n <= 0);
    });
  }

  function toggleNotifications() {
    notifState.category = 'pending';
    notifState.offset = 0;
    document.querySelectorAll('.notif-tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-cat') === 'pending');
    });
    var selAll = document.getElementById('notifSelectAll');
    if (selAll) selAll.checked = false;
    document.getElementById('notificationsModal').style.display = 'flex';
    AppI18n.apply(document.getElementById('notificationsModal'));
    syncNotifToolbar_();
    refreshNotifTabCounts_(false);
    loadNotifsFeed(true, false);
  }

  function closeNotifications() {
    document.getElementById('notificationsModal').style.display = 'none';
  }

  function switchNotifTab(cat) {
    notifState.category = cat;
    notifState.offset = 0;
    document.querySelectorAll('.notif-tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-cat') === cat);
    });
    var selAll = document.getElementById('notifSelectAll');
    if (selAll) selAll.checked = false;
    syncNotifToolbar_();
    loadNotifsFeed(true, false);
  }

  function syncNotifToolbar_() {
    var bar = document.getElementById('notifToolbar');
    if (!bar) return;
    bar.classList.toggle('hidden', notifState.category === 'pending');
  }

  function loadNotifsFeed(reset, forceNetwork) {
    if (notifState.loading) return;
    var cat = notifState.category;
    var list = document.getElementById('notifications-list');
    var moreBtn = document.getElementById('notifLoadMore');

    if (reset && !forceNetwork && notifCache[cat] && notifCache.ts[cat] &&
        (Date.now() - notifCache.ts[cat] < notifCache.ttlMs)) {
      renderNotifFeedFromCache_(cat);
      return;
    }

    notifState.loading = true;
    if (reset) {
      list.innerHTML = '<div style="text-align:center;padding:20px;">' + AppI18n.t('log.loading') + '</div>';
      notifState.offset = 0;
    }
    google.script.run
      .withSuccessHandler(function(res) {
        notifState.loading = false;
        if (!res || !res.success) {
          list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">' + AppI18n.t('form.err.connection') + '</div>';
          return;
        }
        if (reset) {
          notifCache[cat] = res;
          notifCache.ts[cat] = Date.now();
          list.innerHTML = '';
        } else if (notifCache[cat] && notifCache[cat].items) {
          notifCache[cat].items = notifCache[cat].items.concat(res.items || []);
          notifCache[cat].hasMore = !!res.hasMore;
          notifCache[cat].total = res.total;
        }
        notifState.hasMore = !!res.hasMore;
        notifState.offset = (res.offset || 0) + (res.items || []).length;
        if (!(res.items || []).length && reset) {
          list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">' + AppI18n.t('notif.empty') + '</div>';
        } else {
          (res.items || []).forEach(function(n) {
            if (n.auditId) notifItemByAudit_[n.auditId] = n;
            list.insertAdjacentHTML('beforeend', renderNotifItemHtml_(n, !!res.isSupervisor));
          });
        }
        if (moreBtn) moreBtn.classList.toggle('hidden', !notifState.hasMore);
        if (cat === 'pending') checkNotificationsBadge();
        // حدّث العدد من نتيجة القائمة الحالية عند التوفر
        if (notifCache.counts) {
          notifCache.counts[cat] = res.total;
          applyNotifTabCounts_(notifCache.counts);
        } else {
          refreshNotifTabCounts_(true);
        }
      })
      .withFailureHandler(function() {
        notifState.loading = false;
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">' + AppI18n.t('form.err.connection') + '</div>';
      })
      .getNotificationsFeed(AppLayout.getSession(), cat, reset ? 0 : notifState.offset, notifState.limit);
  }

  function renderNotifFeedFromCache_(cat) {
    var res = notifCache[cat];
    var list = document.getElementById('notifications-list');
    var moreBtn = document.getElementById('notifLoadMore');
    list.innerHTML = '';
    if (!res || !(res.items || []).length) {
      list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">' + AppI18n.t('notif.empty') + '</div>';
    } else {
      res.items.forEach(function(n) {
        if (n.auditId) notifItemByAudit_[n.auditId] = n;
        list.insertAdjacentHTML('beforeend', renderNotifItemHtml_(n, !!res.isSupervisor));
      });
    }
    notifState.hasMore = !!(res && res.hasMore);
    notifState.offset = res && res.items ? res.items.length : 0;
    if (moreBtn) moreBtn.classList.toggle('hidden', !notifState.hasMore);
  }

  function loadMoreNotifs() {
    loadNotifsFeed(false, true);
  }

  function notifTypeLabel_(typeName) {
    if (typeName === 'وارد') return AppI18n.t('sidebar.income');
    if (typeName === 'صادر') return AppI18n.t('sidebar.outcome');
    if (typeName === 'تصريف') return AppI18n.t('sidebar.exchange');
    if (typeName === 'تحويل') return AppI18n.t('sidebar.transfer');
    if (typeName === 'سلفة') return AppI18n.t('sidebar.advances');
    return typeName || '';
  }

  function notifActionLabel_(actionType) {
    return actionType === 'حذف' ? AppI18n.t('notif.action.delete') : AppI18n.t('notif.action.edit');
  }

  function notifReasonLabel_(reason) {
    if (!reason || reason === '-') return '';
    var map = {
      wrong_entry: 'reason.wrongEntry',
      update_data: 'reason.updateData',
      fix_amount: 'reason.fixAmount',
      duplicate: 'reason.duplicate',
      cancelled: 'reason.cancelled',
      other: 'reason.other'
    };
    if (map[reason]) return AppI18n.t(map[reason]);
    return String(reason);
  }

  function notifChangeLine_(c) {
    var label = c.labelKey ? AppI18n.t(c.labelKey) : (c.key || '');
    return label + ': ' + (c.from || '—') + ' → ' + (c.to || '—');
  }

  function notifLinkOrText_(value, isLink) {
    var v = String(value || '—');
    if (isLink && /^https?:\/\//i.test(v)) {
      return '<a href="' + AppUtils.escapeHtml(v) + '" target="_blank" rel="noopener noreferrer">' +
        AppUtils.escapeHtml(AppI18n.t('notif.openAttach')) + '</a>';
    }
    return AppUtils.escapeHtml(v);
  }

  function buildNotifDetailsHtml_(res) {
    var rows = '';
    function addRow(label, valueHtml) {
      if (!valueHtml && valueHtml !== 0) return;
      rows += '<div class="notif-details-row"><span class="k">' + AppUtils.escapeHtml(label) +
        '</span><span class="v">' + valueHtml + '</span></div>';
    }
    addRow(AppI18n.t('notif.field.action'), AppUtils.escapeHtml(notifActionLabel_(res.actionType)));
    if (res.isSupervisor && res.actor) addRow(AppI18n.t('notif.field.actor'), AppUtils.escapeHtml(res.actor));
    if (res.typeName) addRow(AppI18n.t('notif.field.type'), AppUtils.escapeHtml(notifTypeLabel_(res.typeName)));
    if (res.amountHint) addRow(AppI18n.t('notif.field.amount'), AppUtils.escapeHtml(res.amountHint));
    var reason = notifReasonLabel_(res.reason);
    if (reason) addRow(AppI18n.t('notif.reason'), AppUtils.escapeHtml(reason));
    if (res.ref) addRow(AppI18n.t('notif.field.ref'), AppUtils.escapeHtml(res.ref));

    var html = '<div class="notif-details-grid">' + rows + '</div>';
    var changes = (res.changes || []).filter(function(c) {
      return !(String(c.from || '') === '—' && String(c.to || '') === '—');
    });
    if (changes.length) {
      html += '<div class="notif-details-section-title">' + AppUtils.escapeHtml(AppI18n.t('notif.changesTitle')) + '</div>';
      changes.forEach(function(c) {
        var label = c.labelKey ? AppI18n.t(c.labelKey) : (c.key || '');
        html += '<div class="notif-change-card">' +
          '<div class="field">' + AppUtils.escapeHtml(label) + '</div>' +
          '<div class="notif-change-vals">' +
          '<div class="notif-change-box from"><span class="lbl">' + AppUtils.escapeHtml(AppI18n.t('notif.changeFrom')) +
          '</span>' + notifLinkOrText_(c.from, c.isLink) + '</div>' +
          '<div class="notif-change-box to"><span class="lbl">' + AppUtils.escapeHtml(AppI18n.t('notif.changeTo')) +
          '</span>' + notifLinkOrText_(c.to, c.isLink) + '</div>' +
          '</div></div>';
      });
    } else if (res.actionType === 'تعديل') {
      html += '<div class="notif-meta">' + AppUtils.escapeHtml(AppI18n.t('notif.changesNone')) + '</div>';
    }
    return html;
  }

  function closeNotifDetails() {
    var modal = document.getElementById('notifDetailsModal');
    if (modal) modal.style.display = 'none';
  }

  function showNotifDetailsModal_(res) {
    var body = document.getElementById('notifDetailsBody');
    var modal = document.getElementById('notifDetailsModal');
    if (!body || !modal) {
      showCustomAlert(AppI18n.t('notif.err.notFound'));
      return;
    }
    body.innerHTML = buildNotifDetailsHtml_(res);
    modal.style.display = 'flex';
    AppI18n.apply(modal);
  }

  function renderNotifItemHtml_(n, isSupervisor) {
    var isPending = n.category === 'pending';
    var title = isSupervisor
      ? AppI18n.t('notif.summary.supervisor')
          .replace('{action}', notifActionLabel_(n.actionType))
          .replace('{actor}', n.actor || '—')
      : AppI18n.t('notif.summary.employee')
          .replace('{action}', notifActionLabel_(n.actionType));

    var bits = [];
    if (n.typeName) bits.push(notifTypeLabel_(n.typeName));
    if (n.amountHint) bits.push(n.amountHint);
    var sub = bits.join(' · ');
    var reasonLine = '';
    var reasonLabel = notifReasonLabel_(n.reason);
    if (reasonLabel) {
      reasonLine = '<div class="notif-meta">' + AppI18n.t('notif.reason') + ': ' +
        AppUtils.escapeHtml(reasonLabel) + '</div>';
    }
    var changesPreview = '';
    if (n.changes && n.changes.length) {
      var meaningful = n.changes.filter(function(c) {
        return !(String(c.from || '') === '—' && String(c.to || '') === '—');
      });
      if (meaningful.length) {
        var preview = meaningful.slice(0, 2).map(function(c) {
          return AppUtils.escapeHtml(notifChangeLine_(c));
        }).join('<br>');
        if (meaningful.length > 2) preview += '<br>…';
        changesPreview = '<div class="notif-changes">' + preview + '</div>';
      }
    }

    var actions = '<div class="notif-actions">';
    if (n.auditId) {
      actions += '<button type="button" class="btn btn-icon notif-mini-btn" onclick="viewNotifDetails(\'' +
        AppUtils.escapeHtml(n.auditId) + '\')">' + AppI18n.t('notif.details') + '</button>';
    }
    if (n.canDecide && isSupervisor && isPending) {
      actions += '<button type="button" class="btn btn-primary notif-mini-btn" onclick="decideNotifRequest(\'' +
        AppUtils.escapeHtml(n.auditId) + '\',\'موافقة\')">' + AppI18n.t('notif.approve') + '</button>';
      actions += '<button type="button" class="btn btn-danger-outline notif-mini-btn" onclick="decideNotifRequest(\'' +
        AppUtils.escapeHtml(n.auditId) + '\',\'رفض\')">' + AppI18n.t('notif.reject') + '</button>';
    }
    actions += '</div>';

    var checkHtml = isPending
      ? ''
      : '<label class="notif-check"><input type="checkbox" class="notif-item-check" value="' +
        AppUtils.escapeHtml(String(n.id)) + '"><span></span></label>';

    var delHtml = isPending
      ? ''
      : '<button type="button" class="notif-btn" onclick="removeNotification(\'' +
        AppUtils.escapeHtml(String(n.id)) + '\')">' + AppI18n.t('notif.delete') + '</button>';

    return '<div class="notif-item" id="notif-' + AppUtils.escapeHtml(String(n.id)) + '">' +
      checkHtml +
      '<div class="notif-item-body">' +
      '<p class="notif-text">' + AppUtils.escapeHtml(title) + '</p>' +
      (sub ? '<div class="notif-sub">' + AppUtils.escapeHtml(sub) + '</div>' : '') +
      reasonLine +
      changesPreview +
      '<p class="notif-date">' + AppUtils.escapeHtml(n.date) + '</p>' +
      actions +
      '</div>' +
      delHtml +
      '</div>';
  }

  function toggleSelectAllNotifs(on) {
    document.querySelectorAll('#notifications-list .notif-item-check').forEach(function(cb) {
      cb.checked = !!on;
    });
  }

  function getSelectedNotifIds_() {
    return Array.prototype.map.call(
      document.querySelectorAll('#notifications-list .notif-item-check:checked'),
      function(cb) { return cb.value; }
    );
  }

  function deleteSelectedNotifs() {
    if (notifState.category === 'pending') {
      showCustomAlert(AppI18n.t('notif.err.pendingNoDelete'));
      return;
    }
    var ids = getSelectedNotifIds_();
    if (!ids.length) {
      showCustomAlert(AppI18n.t('notif.err.noneSelected'));
      return;
    }
    google.script.run
      .withSuccessHandler(function() {
        invalidateNotifCache_(notifState.category);
        loadNotifsFeed(true, true);
        checkNotificationsBadge();
        refreshNotifTabCounts_(true);
      })
      .deleteNotifications(AppLayout.getSession(), ids, notifState.category);
  }

  function removeNotification(id) {
    if (notifState.category === 'pending') {
      showCustomAlert(AppI18n.t('notif.err.pendingNoDelete'));
      return;
    }
    var item = document.getElementById('notif-' + id);
    if (item) item.style.opacity = '0.5';
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          invalidateNotifCache_(notifState.category);
          if (item) item.remove();
          checkNotificationsBadge();
          refreshNotifTabCounts_(true);
          if (!document.querySelectorAll('#notifications-list .notif-item').length) loadNotifsFeed(true, true);
        }
      })
      .deleteNotifications(AppLayout.getSession(), [id], notifState.category);
  }

  function viewNotifDetails(auditId) {
    if (!auditId) return;
    var cached = notifItemByAudit_[auditId];
    if (cached && (cached.changes || cached.reason || cached.typeName || cached.ref)) {
      showNotifDetailsModal_({
        actionType: cached.actionType,
        actor: cached.actor,
        isSupervisor: !!(notifCache[notifState.category] && notifCache[notifState.category].isSupervisor),
        typeName: cached.typeName,
        amountHint: cached.amountHint,
        reason: cached.reason,
        ref: cached.ref,
        changes: cached.changes || []
      });
      return;
    }
    var body = document.getElementById('notifDetailsBody');
    var modal = document.getElementById('notifDetailsModal');
    if (body && modal) {
      body.innerHTML = '<div style="text-align:center;padding:18px;color:var(--text-muted);">' +
        AppUtils.escapeHtml(AppI18n.t('notif.detailsLoading')) + '</div>';
      modal.style.display = 'flex';
    }
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          closeNotifDetails();
          showCustomAlert(AppI18n.t((res && res.messageKey) || 'notif.err.notFound'));
          return;
        }
        if (res.auditId) notifItemByAudit_[res.auditId] = res;
        showNotifDetailsModal_(res);
      })
      .withFailureHandler(function() {
        closeNotifDetails();
        showCustomAlert(AppI18n.t('form.err.connection'));
      })
      .getAuditRequestDetails(AppLayout.getSession(), auditId);
  }

  function decideNotifRequest(auditId, decision) {
    if (!auditId) return;
    var key = decision === 'موافقة' ? 'notif.confirmApprove' : 'notif.confirmReject';
    showCustomConfirm(AppI18n.t(key), function() {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            showCustomAlert(AppI18n.t(res.messageKey || 'notif.approvedOk'));
            invalidateNotifCache_();
            loadNotifsFeed(true, true);
            checkNotificationsBadge();
            refreshNotifTabCounts_(true);
            if (typeof loadTransactions === 'function') loadTransactions();
            if (typeof updateSafeBalances === 'function') updateSafeBalances();
          } else {
            showCustomAlert(AppI18n.t((res && res.messageKey) || 'form.err.connection'));
          }
        })
        .withFailureHandler(function() {
          showCustomAlert(AppI18n.t('form.err.connection'));
        })
        .decideAuditRequest(AppLayout.getSession(), auditId, decision);
    });
  }
</script>
