<script>
  /**
   * AppSelect — مكوّن القائمة المنسدلة المخصصة الموحّد لكامل النظام
   * =================================================================
   * يحوّل أي <select> عادي (داخل حاوية .app-select) إلى قائمة منسدلة
   * مخصصة المظهر تتطابق 100% مع الوضع الليلي/النهاري، مع الحفاظ الكامل
   * على العنصر الأصلي (نفس الـ id والقيمة وحدث change) لضمان توافق
   * الكود الحالي دون أي تعديل إضافي في منطق القراءة/الحفظ.
   *
   * الاستخدام:
   *   <div class="app-select">
   *     <select id="mySelect">...</select>
   *   </div>
   *   AppSelect.enhance('mySelect');
   *
   *   لاحقاً عند تغيير الخيارات ديناميكياً:
   *   AppSelect.refresh('mySelect');
   */
  const AppSelect = {
    _instances: {},
    _initialized: false,

    /**
     * تفعيل جميع القوائم الموجودة داخل حاويات .app-select في الصفحة دفعة واحدة
     */
    initAll: function() {
      const self = this;
      document.querySelectorAll('.app-select > select').forEach(function(select) {
        if (select.id) self.enhance(select.id);
      });
      this._ensureGlobalListeners();
    },

    /**
     * إزالة نسخة قديمة (مفيد عند إعادة بناء جزء من النموذج ديناميكياً)
     */
    destroy: function(nativeId) {
      const instance = this._instances[nativeId];
      if (!instance) return;
      try {
        this._unportalPanel(instance);
        if (instance.trigger && instance.trigger.parentNode) instance.trigger.parentNode.removeChild(instance.trigger);
        if (instance.panel && instance.panel.parentNode) instance.panel.parentNode.removeChild(instance.panel);
        if (instance.native) {
          instance.native.classList.remove('app-select-native');
          instance.native.removeAttribute('tabindex');
          instance.native.removeAttribute('aria-hidden');
        }
        if (instance.wrapper) instance.wrapper.classList.remove('is-enhanced');
      } catch (e) { /* العنصر قد يكون أُزيل مع الحاوية */ }
      delete this._instances[nativeId];
    },

    enhance: function(nativeId) {
      const native = document.getElementById(nativeId);
      if (!native) return null;
      if (this._instances[nativeId]) {
        // إذا تغيّر عنصر الـ DOM (إعادة بناء)، أعد التفعيل
        if (this._instances[nativeId].native !== native) this.destroy(nativeId);
        else return this._instances[nativeId];
      }

      const wrapper = native.closest('.app-select');
      if (!wrapper) return null;

      native.classList.add('app-select-native');
      native.setAttribute('tabindex', '-1');
      native.setAttribute('aria-hidden', 'true');
      wrapper.classList.add('is-enhanced');

      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.id = nativeId + 'Trigger';
      trigger.className = 'app-select-trigger';
      trigger.setAttribute('role', 'combobox');
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-expanded', 'false');

      const label = document.createElement('span');
      label.className = 'app-select-label';
      trigger.appendChild(label);

      const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      chevron.setAttribute('viewBox', '0 0 24 24');
      chevron.classList.add('app-select-chevron');
      chevron.innerHTML = '<path d="M7 10l5 5 5-5z"/>';
      trigger.appendChild(chevron);

      const panel = document.createElement('ul');
      panel.className = 'app-select-panel';
      panel.setAttribute('role', 'listbox');
      if (native.multiple) {
        panel.setAttribute('aria-multiselectable', 'true');
        wrapper.classList.add('app-select-multi');
      }

      wrapper.appendChild(trigger);
      wrapper.appendChild(panel);

      const instance = {
        id: nativeId,
        native: native,
        wrapper: wrapper,
        trigger: trigger,
        label: label,
        panel: panel,
        highlightedIndex: -1,
        optionEls: []
      };

      this._instances[nativeId] = instance;

      trigger.addEventListener('click', () => this._toggle(instance));
      trigger.addEventListener('keydown', (e) => this._onTriggerKeydown(instance, e));

      this._buildOptions(instance);
      this._ensureGlobalListeners();

      return instance;
    },

    /**
     * إعادة بناء الخيارات من عناصر <option> الحالية في الـ select الأصلي
     * (استدعِها بعد أي تغيير برمجي على الخيارات، مثل جلب أسماء الموظفين)
     */
    refresh: function(nativeId) {
      const instance = this._instances[nativeId];
      if (!instance) return this.enhance(nativeId);
      this._buildOptions(instance);
      return instance;
    },

    /**
     * إعادة رسم كل التسميات المعروضة (يُستخدم عند تبديل اللغة فوراً)
     */
    refreshAllLabels: function() {
      const self = this;
      Object.keys(this._instances).forEach(function(id) {
        self._buildOptions(self._instances[id]);
      });
    },

    _buildOptions: function(instance) {
      const native = instance.native;
      const panel = instance.panel;
      panel.innerHTML = '';
      instance.optionEls = [];
      instance.highlightedIndex = -1;

      const options = Array.from(native.options);
      const selectableOptions = options.filter(o => !o.disabled);

      instance.trigger.classList.toggle('disabled', selectableOptions.length === 0);
      instance.trigger.disabled = selectableOptions.length === 0;

      if (selectableOptions.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'app-select-empty';
        empty.textContent = options.length ? options[0].textContent : '—';
        panel.appendChild(empty);
      }

      selectableOptions.forEach((opt, idx) => {
        const li = document.createElement('li');
        li.className = 'app-option';
        li.setAttribute('role', 'option');
        li.dataset.value = opt.value;

        const text = document.createElement('span');
        const i18nKey = opt.getAttribute('data-i18n');
        text.textContent = (i18nKey && i18nKey !== 'undefined' && typeof AppI18n !== 'undefined')
          ? AppI18n.t(i18nKey)
          : opt.textContent;
        li.appendChild(text);

        const check = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        check.setAttribute('viewBox', '0 0 24 24');
        check.classList.add('app-option-check');
        check.innerHTML = '<path d="M9 16.2l-3.5-3.5L4 14.2 9 19.2 20 8.2l-1.5-1.5z"/>';
        if (native.multiple) {
          const box = document.createElement('span');
          box.className = 'app-option-box';
          box.setAttribute('aria-hidden', 'true');
          li.insertBefore(box, text);
          li.classList.add('app-option-multi');
        }
        li.appendChild(check);

        if (opt.selected) {
          li.classList.add('selected');
          instance.highlightedIndex = idx;
        }

        li.addEventListener('click', () => this._selectOption(instance, opt.value, opt.textContent));

        panel.appendChild(li);
        instance.optionEls.push(li);
      });

      this._syncLabel(instance);
    },

    _syncLabel: function(instance) {
      const native = instance.native;
      function optLabel(opt) {
        if (!opt) return '';
        const key = opt.getAttribute('data-i18n');
        return (key && key !== 'undefined' && typeof AppI18n !== 'undefined') ? AppI18n.t(key) : opt.textContent;
      }
      if (native.multiple) {
        const selected = Array.from(native.selectedOptions).filter(function(o) { return o.value !== ''; });
        if (!selected.length) {
          const placeholderOption = native.options[0];
          instance.label.textContent = placeholderOption ? optLabel(placeholderOption) : '';
          instance.label.classList.add('placeholder');
        } else if (selected.length === 1) {
          instance.label.textContent = optLabel(selected[0]);
          instance.label.classList.remove('placeholder');
        } else if (selected.length === 2) {
          instance.label.textContent = optLabel(selected[0]) + '، ' + optLabel(selected[1]);
          instance.label.classList.remove('placeholder');
        } else {
          var tpl = (typeof AppI18n !== 'undefined') ? AppI18n.t('report.multiSelected') : '';
          instance.label.textContent = (tpl && tpl.indexOf('%n') !== -1)
            ? tpl.replace('%n', String(selected.length))
            : (selected.length + ' مختارة');
          instance.label.classList.remove('placeholder');
        }
        return;
      }
      const selectedOption = native.options[native.selectedIndex];

      if (native.value === '' || !selectedOption) {
        const placeholderOption = native.options[0];
        instance.label.textContent = placeholderOption ? optLabel(placeholderOption) : '';
        instance.label.classList.add('placeholder');
      } else {
        instance.label.textContent = optLabel(selectedOption);
        instance.label.classList.remove('placeholder');
      }
    },

    _selectOption: function(instance, value, text) {
      const native = instance.native;
      if (native.multiple) {
        const opts = Array.from(native.options);
        const opt = opts.filter(function(o) { return o.value === value; })[0];
        if (opt) {
          // لا تسمح باختيار القيمة الفارغة مع غيرها
          if (value === '') {
            opts.forEach(function(o) { o.selected = o.value === ''; });
          } else {
            const empty = opts.filter(function(o) { return o.value === ''; })[0];
            if (empty) empty.selected = false;
            opt.selected = !opt.selected;
            if (!Array.from(native.selectedOptions).length && empty) empty.selected = true;
          }
          native.dispatchEvent(new Event('change', { bubbles: true }));
        }
        instance.optionEls.forEach(function(el) {
          const match = opts.filter(function(o) { return o.value === el.dataset.value; })[0];
          el.classList.toggle('selected', !!(match && match.selected));
        });
        this._syncLabel(instance);
        // تبقى القائمة مفتوحة للاختيار المتعدد
        return;
      }
      if (native.value !== value) {
        native.value = value;
        native.dispatchEvent(new Event('change', { bubbles: true }));
      }
      instance.optionEls.forEach(el => el.classList.toggle('selected', el.dataset.value === value));
      this._syncLabel(instance);
      this._close(instance);
    },

    _toggle: function(instance) {
      if (instance.wrapper.classList.contains('open')) {
        this._close(instance);
      } else {
        this._closeAll();
        this._open(instance);
      }
    },

    _open: function(instance) {
      instance.wrapper.classList.add('open');
      instance.trigger.setAttribute('aria-expanded', 'true');
      this._portalPanel(instance);
      instance.panel.classList.add('open');
      this._scrollToHighlighted(instance);
    },

    _close: function(instance) {
      instance.wrapper.classList.remove('open');
      instance.trigger.setAttribute('aria-expanded', 'false');
      if (instance.panel) instance.panel.classList.remove('open');
      this._unportalPanel(instance);
    },

    _portalPanel: function(instance) {
      const panel = instance.panel;
      const trigger = instance.trigger;
      if (!panel || !trigger) return;
      if (panel.parentNode !== document.body) {
        document.body.appendChild(panel);
      }
      panel.classList.add('is-portal');
      this._positionPortal(instance);
      if (!instance._onReposition) {
        const self = this;
        instance._onReposition = function() {
          if (instance.wrapper.classList.contains('open')) self._positionPortal(instance);
        };
        window.addEventListener('resize', instance._onReposition);
        window.addEventListener('scroll', instance._onReposition, true);
      }
    },

    _positionPortal: function(instance) {
      const panel = instance.panel;
      const trigger = instance.trigger;
      if (!panel || !trigger) return;
      const rect = trigger.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const maxH = Math.min(240, Math.max(120, spaceBelow - 12));
      const openUp = spaceBelow < 160 && rect.top > spaceBelow;
      panel.style.width = Math.max(rect.width, 180) + 'px';
      panel.style.left = rect.left + 'px';
      panel.style.maxHeight = maxH + 'px';
      if (openUp) {
        panel.style.top = 'auto';
        panel.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
      } else {
        panel.style.bottom = 'auto';
        panel.style.top = (rect.bottom + 6) + 'px';
      }
    },

    _unportalPanel: function(instance) {
      const panel = instance.panel;
      if (!panel) return;
      panel.classList.remove('is-portal');
      panel.style.top = '';
      panel.style.bottom = '';
      panel.style.left = '';
      panel.style.width = '';
      panel.style.maxHeight = '';
      if (instance.wrapper && panel.parentNode !== instance.wrapper) {
        instance.wrapper.appendChild(panel);
      }
      if (instance._onReposition) {
        window.removeEventListener('resize', instance._onReposition);
        window.removeEventListener('scroll', instance._onReposition, true);
        instance._onReposition = null;
      }
    },

    _closeAll: function() {
      const self = this;
      Object.keys(this._instances).forEach(function(id) {
        self._close(self._instances[id]);
      });
    },

    _moveHighlight: function(instance, delta) {
      if (!instance.optionEls.length) return;
      let idx = instance.highlightedIndex + delta;
      if (idx < 0) idx = instance.optionEls.length - 1;
      if (idx >= instance.optionEls.length) idx = 0;
      instance.highlightedIndex = idx;
      instance.optionEls.forEach((el, i) => el.classList.toggle('highlighted', i === idx));
      instance.optionEls[idx].scrollIntoView({ block: 'nearest' });
    },

    _scrollToHighlighted: function(instance) {
      if (instance.highlightedIndex >= 0 && instance.optionEls[instance.highlightedIndex]) {
        instance.optionEls[instance.highlightedIndex].scrollIntoView({ block: 'nearest' });
      }
    },

    _onTriggerKeydown: function(instance, e) {
      const isOpen = instance.wrapper.classList.contains('open');

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!isOpen) { this._closeAll(); this._open(instance); }
        else this._moveHighlight(instance, 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!isOpen) { this._closeAll(); this._open(instance); }
        else this._moveHighlight(instance, -1);
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (isOpen && instance.highlightedIndex >= 0) {
          const el = instance.optionEls[instance.highlightedIndex];
          this._selectOption(instance, el.dataset.value, el.textContent);
        } else {
          this._closeAll();
          this._open(instance);
        }
      } else if (e.key === 'Escape') {
        if (isOpen) { e.preventDefault(); this._close(instance); }
      } else if (e.key === 'Tab') {
        this._close(instance);
      }
    },

    _ensureGlobalListeners: function() {
      if (this._initialized) return;
      this._initialized = true;
      const self = this;

      document.addEventListener('click', function(e) {
        Object.keys(self._instances).forEach(function(id) {
          const instance = self._instances[id];
          if (!instance.wrapper.classList.contains('open')) return;
          const inWrap = instance.wrapper.contains(e.target);
          const inPanel = instance.panel && instance.panel.contains(e.target);
          if (!inWrap && !inPanel) self._close(instance);
        });
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') self._closeAll();
      });

      // إعادة رسم كل التسميات فوراً عند تبديل اللغة، دون الحاجة لإعادة التحميل
      if (typeof AppI18n !== 'undefined') {
        AppI18n.onChange(function() { self.refreshAllLabels(); });
      }
    }
  };

  // فعّل كل القوائم الثابتة فور جاهزية الـ DOM — يمنع وميض الشكل الأصلي
  function bootAppSelects_() {
    try { AppSelect.initAll(); } catch (e) {}
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootAppSelects_);
  } else {
    bootAppSelects_();
  }
</script>
