<script>
  /**
   * إدارة المشاريع — مشرف فقط (إضافة / تعديل / حذف)
   */
  var ManageProjects = {
    ready: false,
    cache: [],
    loadedOnce: false,

    SHOW_IN_OPTS: [
      { val: 'وارد', key: 'project.show.income', cb: 'project-show-income' },
      { val: 'صادر', key: 'project.show.outcome', cb: 'project-show-outcome' },
      { val: 'سلف', key: 'project.show.advances', cb: 'project-show-advances' },
      { val: 'تقارير', key: 'project.show.reports', cb: 'project-show-reports' }
    ],

    ensureReady: function() {
      if (typeof APP_INTERFACE !== 'undefined' && APP_INTERFACE !== 'supervisor') return;
      this.bindOnce();
      var panel = document.querySelector('.content-panel[data-section="manage-projects"]');
      if (panel) AppI18n.apply(panel);
      var self = this;
      if (!this.loadedOnce) setTimeout(function() { self.load(); }, 0);
    },

    bindOnce: function() {
      if (this.ready) return;
      this.ready = true;
      var self = this;
      var btnAdd = document.getElementById('btnProjectAdd');
      if (btnAdd) btnAdd.addEventListener('click', function() { self.openForm('add'); });
      var btnSave = document.getElementById('btnProjectSave');
      if (btnSave) btnSave.addEventListener('click', function() { self.save(); });
      var btnCancel = document.getElementById('btnProjectCancel');
      if (btnCancel) btnCancel.addEventListener('click', function() { self.closeForm(); });
      var btnRefresh = document.getElementById('btnProjectRefresh');
      if (btnRefresh) btnRefresh.addEventListener('click', function() { self.load(); });
    },

    showInLabel: function(val) {
      var opt = this.SHOW_IN_OPTS.filter(function(o) { return o.val === val; })[0];
      return opt ? AppI18n.t(opt.key) : val;
    },

    collectShowIn: function() {
      var out = [];
      this.SHOW_IN_OPTS.forEach(function(o) {
        var el = document.getElementById(o.cb);
        if (el && el.checked) out.push(o.val);
      });
      return out;
    },

    setShowInCheckboxes: function(showIn) {
      showIn = showIn || [];
      this.SHOW_IN_OPTS.forEach(function(o) {
        var el = document.getElementById(o.cb);
        if (el) el.checked = showIn.indexOf(o.val) !== -1;
      });
    },

    load: function() {
      var tbody = document.getElementById('tbody-projects');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="4" class="log-empty">' + AppI18n.t('log.loading') + '</td></tr>';
      var self = this;
      google.script.run
        .withSuccessHandler(function(res) {
          res = res || {};
          if (AppLayout.handleAuthResult(res)) return;
          if (!res.success) {
            tbody.innerHTML = '<tr><td colspan="4" class="log-empty-warn">' +
              AppI18n.t(res.messageKey || 'auth.forbidden') + '</td></tr>';
            return;
          }
          self.loadedOnce = true;
          self.cache = res.rows || [];
          self.render(self.cache);
          if (typeof loadProjectsFromServer === 'function') loadProjectsFromServer();
        })
        .withFailureHandler(function() {
          tbody.innerHTML = '<tr><td colspan="4" class="log-empty-warn" data-i18n="form.err.connection">' +
            AppI18n.t('form.err.connection') + '</td></tr>';
        })
        .listManagedProjects(AppLayout.getSession());
    },

    render: function(rows) {
      var tbody = document.getElementById('tbody-projects');
      if (!tbody) return;
      var esc = AppUtils.escapeHtml;
      var self = this;
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="log-empty">' + AppI18n.t('log.noRecords') + '</td></tr>';
        return;
      }
      var html = '';
      rows.forEach(function(row, idx) {
        var statusLabel = row.status === 'نشط'
          ? AppI18n.t('employees.statusActive')
          : AppI18n.t('employees.statusInactive');
        var showLabels = (row.showIn || []).map(function(v) { return self.showInLabel(v); }).join('، ');
        html += '<tr>' +
          '<td><b>' + esc(row.name) + '</b></td>' +
          '<td>' + esc(statusLabel) + '</td>' +
          '<td>' + esc(showLabels || '—') + '</td>' +
          '<td><div class="log-actions">' +
            '<button type="button" class="btn-log btn-log-edit" data-idx="' + idx + '">' + AppI18n.t('log.edit') + '</button>' +
            '<button type="button" class="btn-log btn-log-delete" data-idx="' + idx + '">' + AppI18n.t('log.delete') + '</button>' +
          '</div></td></tr>';
      });
      tbody.innerHTML = html;
      tbody.querySelectorAll('.btn-log-edit').forEach(function(btn) {
        btn.addEventListener('click', function() {
          ManageProjects.openForm('edit', ManageProjects.cache[Number(btn.getAttribute('data-idx'))]);
        });
      });
      tbody.querySelectorAll('.btn-log-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var row = ManageProjects.cache[Number(btn.getAttribute('data-idx'))];
          if (!row) return;
          if (typeof showCustomConfirm === 'function') {
            showCustomConfirm(AppI18n.t('projects.confirmDelete') + ' «' + row.name + '»؟', function() {
              ManageProjects.remove(row.name);
            });
          } else if (window.confirm(AppI18n.t('projects.confirmDelete'))) {
            ManageProjects.remove(row.name);
          }
        });
      });
    },

    openForm: function(mode, row) {
      var box = document.getElementById('projectFormBox');
      if (!box) return;
      box.classList.remove('hidden');
      document.getElementById('project-mode').value = mode;
      document.getElementById('project-original').value = (row && row.name) || '';
      document.getElementById('project-name').value = (row && row.name) || '';
      document.getElementById('project-status').value = (row && row.status) || 'نشط';
      this.setShowInCheckboxes(row && row.showIn);
      AppSelect.destroy('project-status');
      if (document.getElementById('project-status')) AppSelect.enhance('project-status');
      AppUtils.hideMessage('projectMessage');
      var title = document.getElementById('projectFormTitle');
      if (title) {
        var key = mode === 'edit' ? 'projects.editTitle' : 'projects.addTitle';
        title.setAttribute('data-i18n', key);
        title.textContent = AppI18n.t(key);
      }
    },

    closeForm: function() {
      var box = document.getElementById('projectFormBox');
      if (box) box.classList.add('hidden');
      AppUtils.hideMessage('projectMessage');
    },

    remove: function(name) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (AppLayout.handleAuthResult(res)) return;
          if (!res || !res.success) {
            AppUtils.showMessageKey('projectMessage', (res && res.messageKey) || 'form.err.server', 'danger');
            return;
          }
          ManageProjects.load();
        })
        .saveManagedProject(AppLayout.getSession(), { mode: 'delete', originalName: name, name: name });
    },

    save: function() {
      var showIn = this.collectShowIn();
      var payload = {
        mode: document.getElementById('project-mode').value || 'add',
        name: (document.getElementById('project-name') || {}).value || '',
        status: (document.getElementById('project-status') || {}).value || 'نشط',
        originalName: (document.getElementById('project-original') || {}).value || '',
        showIn: showIn,
        showInStr: showIn.join('|')
      };
      AppUtils.setLoadingState('btnProjectSave', true, AppI18n.t('form.savingServer'));
      var self = this;
      google.script.run
        .withSuccessHandler(function(res) {
          AppUtils.setLoadingState('btnProjectSave', false, '', AppI18n.t('employees.save'));
          if (AppLayout.handleAuthResult(res)) return;
          if (!res || !res.success) {
            if (res && res.message && typeof AppUtils.showMessage === 'function') {
              AppUtils.showMessage('projectMessage', res.message, 'danger');
            } else {
              AppUtils.showMessageKey('projectMessage', (res && res.messageKey) || 'form.err.server', 'danger');
            }
            return;
          }
          AppUtils.showMessageKey('projectMessage', res.messageKey || 'projects.updated', 'success');
          self.closeForm();
          self.load();
        })
        .withFailureHandler(function(err) {
          AppUtils.setLoadingState('btnProjectSave', false, '', AppI18n.t('employees.save'));
          var detail = (err && (err.message || err)) ? String(err.message || err) : '';
          if (detail && typeof AppUtils.showMessage === 'function') {
            AppUtils.showMessage('projectMessage', AppI18n.t('form.err.connection') + (detail ? (' — ' + detail) : ''), 'danger');
          } else {
            AppUtils.showMessageKey('projectMessage', 'form.err.connection', 'danger');
          }
        })
        .saveManagedProject(AppLayout.getSession(), payload);
    }
  };

  if (typeof AppI18n !== 'undefined' && AppI18n.onChange) {
    AppI18n.onChange(function() {
      if (!ManageProjects.ready) return;
      var panel = document.querySelector('.content-panel[data-section="manage-projects"]');
      if (panel) AppI18n.apply(panel);
      if (ManageProjects.loadedOnce) ManageProjects.render(ManageProjects.cache || []);
    });
  }
</script>
