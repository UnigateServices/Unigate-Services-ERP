<script>
  /**
   * اختصارات لوحة المفاتيح — تعتمد على e.code (مستقلة عن لغة الكيبورد)
   *
   * Esc          إغلاق أعلى نافذة (ليس القفل)
   * Enter        حفظ العملية / تشغيل التقرير
   * Alt+↑ / ↓    التنقل بين الأقسام
   * Alt+S        نفس Enter: حفظ / تشغيل (بديل سريع)
   * Alt+R        تحديث
   * Alt+V        إظهار/إخفاء كلمة المرور (شاشة القفل أو أي حقل كلمة مرور مركَّز)
   * Alt+B        طي/فتح السايدبار
   * Alt+Enter    ملء الشاشة / الخروج منها
   * /            تركيز البحث السريع في السجل
   *
   * ملاحظة: Alt+← / Alt+→ من المتصفح (رجوع/تقدم) وليست من النظام — نمنعها داخل التطبيق لتفادي الخروج بالخطأ
   */
  var AppShortcuts = {
    /** ترتيب أساس الموظف؛ أقسام المشرف تُضاف ديناميكياً إن كانت ظاهرة */
    SECTION_ORDER_BASE: [
      'add-income', 'add-outcome', 'add-exchange', 'add-transfer', 'add-advances',
      'log-income', 'log-outcome', 'log-exchange', 'log-transfer', 'log-advances',
      'reports'
    ],
    SECTION_ORDER_SUPERVISOR_PREFIX: [
      'monitor-ops', 'system-reports', 'opening-balance', 'manage-employees', 'manage-borrowers',
      'manage-projects', 'manage-banks', 'employee-funds'
    ],

    getSectionOrder: function() {
      var order = [];
      var isSupervisor = false;
      try {
        if (typeof AppLayout !== 'undefined' && typeof AppLayout.isSupervisor === 'function') {
          isSupervisor = AppLayout.isSupervisor();
        } else if (typeof APP_INTERFACE !== 'undefined' && APP_INTERFACE === 'supervisor') {
          isSupervisor = true;
        } else {
          isSupervisor = sessionStorage.getItem('fx_login_portal') === 'supervisor' ||
            sessionStorage.getItem('fx_user_role') === 'مشرف';
        }
      } catch (e) {}

      if (isSupervisor) {
        this.SECTION_ORDER_SUPERVISOR_PREFIX.forEach(function(id) {
          if (document.querySelector('[data-section="' + id + '"]')) order.push(id);
        });
      }
      this.SECTION_ORDER_BASE.forEach(function(id) { order.push(id); });
      if (isSupervisor && document.querySelector('[data-section="log-opening"]')) {
        var advIdx = order.indexOf('log-advances');
        if (advIdx >= 0) order.splice(advIdx + 1, 0, 'log-opening');
        else order.push('log-opening');
      }
      var seen = {};
      return order.filter(function(id) {
        if (seen[id]) return false;
        seen[id] = true;
        return true;
      });
    },

    init: function() {
      // capture:true لالتقاط الاختصار قبل أن يبتلعه عنصر آخر
      document.addEventListener('keydown', function(e) {
        AppShortcuts.handleKey(e);
      }, true);

      // نقرة خارج محتوى النافذة = إغلاق أعلى نافذة (مثل Esc)، من الأعلى للأسفل
      document.addEventListener('mousedown', function(e) {
        if (typeof AppLayout !== 'undefined' && AppLayout.isLocked) return;
        var overlay = e.target && e.target.classList && e.target.classList.contains('modal-overlay')
          ? e.target
          : null;
        if (!overlay || overlay.id === 'lockOverlay') return;
        // فقط إذا كانت هذه النافذة هي الأعلى المفتوحة
        var open = AppShortcuts.getOpenModals();
        if (!open.length || open[0].el !== overlay) return;
        e.preventDefault();
        AppShortcuts.closeTopModal();
      }, true);
    },

    isTypingTarget: function(el) {
      if (!el) return false;
      var tag = (el.tagName || '').toLowerCase();
      if (tag === 'textarea') return true;
      if (tag === 'select') return true;
      if (tag === 'input') {
        var type = (el.type || 'text').toLowerCase();
        return type !== 'button' && type !== 'submit' && type !== 'checkbox' && type !== 'radio' && type !== 'file';
      }
      if (el.isContentEditable) return true;
      return false;
    },

    togglePasswordVisibility: function(inputId, iconId) {
      var input = document.getElementById(inputId);
      if (!input) return false;
      var icon = iconId ? document.getElementById(iconId) : null;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      if (icon) {
        icon.innerHTML = '<path d="' + (show
          ? 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z'
          : 'M12 6c-4.42 0-8.27 2.94-9.83 7 1.56 4.06 5.41 7 9.83 7s8.27-2.94 9.83-7C20.27 8.94 16.42 6 12 6zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z')
          + '"/>';
      }
      try { input.focus(); } catch (err) {}
      return true;
    },

    toggleActivePasswordField: function() {
      // شاشة القفل أولاً إن كانت ظاهرة
      var lockOverlay = document.getElementById('lockOverlay');
      if (lockOverlay && lockOverlay.classList.contains('visible')) {
        return this.togglePasswordVisibility('lockPassword', 'lockEyeIcon');
      }
      // حقل كلمة مرور مركَّز حالياً
      var active = document.activeElement;
      if (active && (active.tagName || '').toLowerCase() === 'input' && active.type === 'password') {
        active.type = 'text';
        return true;
      }
      if (active && (active.tagName || '').toLowerCase() === 'input' && active.id && active.id.toLowerCase().indexOf('pass') !== -1) {
        active.type = active.type === 'password' ? 'text' : 'password';
        return true;
      }
      // حقول شائعة
      if (document.getElementById('lockPassword')) {
        return this.togglePasswordVisibility('lockPassword', 'lockEyeIcon');
      }
      if (document.getElementById('loginPassword')) {
        return this.togglePasswordVisibility('loginPassword', 'loginEyeIcon');
      }
      return false;
    },

    getOpenModals: function() {
      var list = [];
      document.querySelectorAll('.modal-overlay').forEach(function(el) {
        if (el.id === 'lockOverlay') return;
        var style = window.getComputedStyle(el);
        if (style.display === 'none' || style.visibility === 'hidden') return;
        var z = parseInt(style.zIndex, 10) || 0;
        list.push({ el: el, z: z });
      });
      list.sort(function(a, b) { return b.z - a.z; });
      return list;
    },

    closeTopModal: function() {
      var open = this.getOpenModals();
      if (!open.length) return false;
      var top = open[0].el;
      var id = top.id;

      if (id === 'editModal' && typeof closeModal === 'function') { closeModal(); return true; }
      if (id === 'deleteModal' && typeof closeDeleteModal === 'function') { closeDeleteModal(); return true; }
      if (id === 'advancedSearchModal' && typeof closeAdvancedSearch === 'function') { closeAdvancedSearch(); return true; }
      if (id === 'openingAdvancedModal' && typeof closeOpeningAdvancedSearch === 'function') { closeOpeningAdvancedSearch(); return true; }
      if (id === 'reportExportOptionsModal') { top.style.display = 'none'; if (top.parentNode) top.parentNode.removeChild(top); return true; }
      if (id === 'receiptModal' && typeof closeReceiptModal === 'function') { closeReceiptModal(); return true; }
      if (id === 'notificationsModal' && typeof closeNotifications === 'function') { closeNotifications(); return true; }
      if (id === 'customConfirmModal' && typeof closeCustomConfirm === 'function') { closeCustomConfirm(); return true; }
      if (id === 'customAlertModal' && typeof closeCustomAlert === 'function') { closeCustomAlert(); return true; }
      if (id === 'notifDetailsModal' && typeof closeNotifDetails === 'function') { closeNotifDetails(); return true; }
      var openMenu = top.querySelector('.receipt-menu.open');
      if (openMenu) { openMenu.classList.remove('open'); return true; }
      top.style.display = 'none';
      return true;
    },

    triggerPrimaryAction: function() {
      if (typeof AppLayout === 'undefined' || AppLayout.isLocked) return;
      var section = AppLayout.currentSection || '';

      if (section.indexOf('add-') === 0) {
        var map = {
          'add-income': 'saveBtn-income',
          'add-outcome': 'saveBtn-outcome',
          'add-exchange': 'saveBtn-exchange',
          'add-transfer': 'saveBtn-transfer',
          'add-advances': 'saveBtn-advances'
        };
        var btn = document.getElementById(map[section]);
        if (btn && !btn.disabled) btn.click();
        return;
      }

      if ((section === 'reports' || section === 'system-reports') && typeof runSelectedReport === 'function') {
        runSelectedReport();
      }
    },

    navigateSectionBy: function(delta) {
      if (typeof AppLayout === 'undefined' || AppLayout.isLocked) return;
      var order = this.getSectionOrder();
      if (!order.length) return;
      var idx = order.indexOf(AppLayout.currentSection);
      if (idx < 0) idx = 0;
      var next = idx + delta;
      if (next < 0) next = order.length - 1;
      if (next >= order.length) next = 0;
      AppLayout.navigateTo(order[next]);
    },

    focusLogSearch: function() {
      if (typeof AppLayout === 'undefined' || AppLayout.isLocked) return;
      var section = AppLayout.currentSection || '';
      if (section.indexOf('log-') !== 0) return false;
      var map = {
        'log-income': 'search-incomes',
        'log-outcome': 'search-outcomes',
        'log-exchange': 'search-exchanges',
        'log-transfer': 'search-transfers',
        'log-advances': 'search-advances',
        'log-opening': 'search-opening'
      };
      var el = document.getElementById(map[section]);
      if (el) { el.focus(); if (el.select) el.select(); return true; }
      return false;
    },

    handleKey: function(e) {
      var locked = (typeof AppLayout !== 'undefined' && AppLayout.isLocked);
      var code = e.code || '';

      // منع Alt+← / Alt+→ (رجوع/تقدم المتصفح) داخل التطبيق
      if (e.altKey && (code === 'ArrowLeft' || code === 'ArrowRight')) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }

      // ===== أثناء القفل: فقط ما يلزم للأمان =====
      if (locked) {
        if (code === 'Escape') {
          e.preventDefault();
          var pw = document.getElementById('lockPassword');
          if (pw) pw.focus();
          return;
        }
        // Alt+V إظهار/إخفاء كلمة مرور القفل
        if (e.altKey && code === 'KeyV') {
          e.preventDefault();
          e.stopPropagation();
          this.toggleActivePasswordField();
          return;
        }
        return;
      }

      // Esc — أعلى نافذة فقط
      if (code === 'Escape') {
        if (this.closeTopModal()) {
          e.preventDefault();
          return;
        }
        var menu = document.querySelector('.receipt-menu.open');
        if (menu) { menu.classList.remove('open'); e.preventDefault(); }
        return;
      }

      // Alt + ↑ / ↓
      if (e.altKey && (code === 'ArrowUp' || code === 'ArrowDown')) {
        e.preventDefault();
        e.stopPropagation();
        this.navigateSectionBy(code === 'ArrowUp' ? -1 : 1);
        return;
      }

      // Alt + Enter — ملء الشاشة
      if (e.altKey && code === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        if (typeof AppLayout !== 'undefined') AppLayout.toggleFullscreen();
        return;
      }

      // Alt + B — السايدبار
      if (e.altKey && code === 'KeyB') {
        e.preventDefault();
        e.stopPropagation();
        if (typeof AppLayout !== 'undefined') AppLayout.toggleSidebar();
        return;
      }

      // Alt + V — إظهار كلمة المرور
      if (e.altKey && code === 'KeyV') {
        e.preventDefault();
        e.stopPropagation();
        this.toggleActivePasswordField();
        return;
      }

      // Alt + S — حفظ / تشغيل تقرير (بديل Enter)
      if (e.altKey && code === 'KeyS') {
        e.preventDefault();
        e.stopPropagation();
        this.triggerPrimaryAction();
        return;
      }

      // Alt + R — تحديث
      if (e.altKey && code === 'KeyR') {
        e.preventDefault();
        e.stopPropagation();
        if (typeof AppLayout !== 'undefined') AppLayout.performSilentRefresh(true);
        return;
      }

      // Alt + F — تركيز البحث السريع في السجل (بديل /)
      if (e.altKey && code === 'KeyF') {
        e.preventDefault();
        e.stopPropagation();
        this.focusLogSearch();
        return;
      }

      // / — تركيز بحث السجل
      if (code === 'Slash' && !e.altKey && !e.ctrlKey && !e.metaKey && !this.isTypingTarget(e.target)) {
        e.preventDefault();
        this.focusLogSearch();
        return;
      }

      // Enter — حفظ / تشغيل
      if (code === 'Enter' && !e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
        if (this.isTypingTarget(e.target) && (e.target.tagName || '').toLowerCase() === 'textarea') return;
        if (e.target && e.target.closest && (e.target.closest('#lockForm') || e.target.closest('#loginForm'))) return;
        if (e.target && e.target.closest && e.target.closest('.modal-overlay')) return;

        var section = (typeof AppLayout !== 'undefined') ? AppLayout.currentSection : '';
        if (section.indexOf('add-') === 0 || section === 'reports') {
          if (e.target && (e.target.tagName || '').toLowerCase() === 'button') return;
          e.preventDefault();
          this.triggerPrimaryAction();
        }
      }
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { AppShortcuts.init(); });
  } else {
    AppShortcuts.init();
  }
</script>
