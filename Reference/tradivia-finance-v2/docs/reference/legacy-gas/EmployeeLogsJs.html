<script>
  /**
   * منطق سجل العمليات — جداول، بحث سريع/متقدم، تعديل/حذف بأسباب
   */
  var LOG_META = {
    'tbody-incomes': { cat: 'incomes', type: 'IN', reset: 'reset-incomes', search: 'search-incomes', count: 'count-incomes', cols: 15 },
    'tbody-outcomes': { cat: 'outcomes', type: 'OUT', reset: 'reset-outcomes', search: 'search-outcomes', count: 'count-outcomes', cols: 15 },
    'tbody-exchanges': { cat: 'exchanges', type: 'EX', reset: 'reset-exchanges', search: 'search-exchanges', count: 'count-exchanges', cols: 14 },
    'tbody-transfers': { cat: 'transfers', type: 'TR', reset: 'reset-transfers', search: 'search-transfers', count: 'count-transfers', cols: 12 },
    'tbody-advances': { cat: 'advances', type: 'AD', reset: 'reset-advances', search: 'search-advances', count: 'count-advances', cols: 15 }
  };

  var LOG_SEARCH_DEBOUNCE = {};
  var pendingDeletePayload = null;

  function statusBadgeHtml(status) {
    var key = 'status.unknown';
    var cls = 'status-badge status-muted';
    if (status === 'مكتملة') { key = 'status.completed'; cls = 'status-badge status-ok'; }
    else if (status === 'بانتظار الموافقة') { key = 'status.pending'; cls = 'status-badge status-warn'; }
    else if (status === 'محذوفة' || status === 'محذوف') { key = 'status.deleted'; cls = 'status-badge status-bad'; }
    else if (status === 'مرفوضة') { key = 'status.rejected'; cls = 'status-badge status-bad'; }
    return '<span class="' + cls + '">' + AppI18n.t(key) + '</span>';
  }

  function attachHtml(link) {
    if (link && String(link).indexOf('http') === 0) {
      var encoded = encodeURIComponent(String(link));
      return '<button type="button" class="log-attach-link" title="' + AppI18n.t('log.viewAttachment') +
        '" onclick="openAttachmentsViewer(decodeURIComponent(\'' + encoded.replace(/'/g, '%27') + '\'))">' +
        '<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg></button>';
    }
    return '<span class="text-muted">—</span>';
  }

  var attachViewerBlobUrl_ = '';
  var attachViewerFolderUrl_ = '';

  function openAttachmentsViewer(folderUrl) {
    var modal = document.getElementById('attachViewerModal');
    var body = document.getElementById('attachViewerBody');
    if (!modal || !body) {
      if (folderUrl) window.open(folderUrl, '_blank');
      return;
    }
    attachViewerFolderUrl_ = folderUrl || '';
    modal.style.display = 'flex';
    setAttachPreviewHtml_('<div class="attach-preview-empty">' + AppI18n.t('log.previewHint') + '</div>');
    body.innerHTML = '<div class="edit-attach-loading">' + AppI18n.t('log.loading') + '</div>';
    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof AppLayout !== 'undefined' && AppLayout.handleAuthResult && AppLayout.handleAuthResult(res)) return;
        renderAttachmentsViewer_(res || {}, folderUrl);
      })
      .withFailureHandler(function() {
        body.innerHTML = '<div class="edit-attach-current text-muted">' + AppI18n.t('form.err.connection') + '</div>';
      })
      .listTransactionAttachments(AppLayout.getSession(), folderUrl);
  }

  function closeAttachmentsViewer() {
    var modal = document.getElementById('attachViewerModal');
    if (modal) modal.style.display = 'none';
    revokeAttachPreviewUrl_();
    setAttachPreviewHtml_('<div class="attach-preview-empty">' + AppI18n.t('log.previewHint') + '</div>');
  }

  function revokeAttachPreviewUrl_() {
    if (attachViewerBlobUrl_) {
      try { URL.revokeObjectURL(attachViewerBlobUrl_); } catch (e) {}
      attachViewerBlobUrl_ = '';
    }
  }

  function setAttachPreviewHtml_(html) {
    var pane = document.getElementById('attachViewerPreview');
    if (pane) pane.innerHTML = html;
  }

  function isPreviewableAttach_(name, mime) {
    var m = String(mime || '').toLowerCase();
    var n = String(name || '').toLowerCase();
    if (m.indexOf('image/') === 0 || /\.(jpe?g|png|gif|webp|bmp|svg)$/.test(n)) return 'image';
    if (m.indexOf('pdf') !== -1 || /\.pdf(\b|$)/.test(n) || /(^|[^a-z])pdf([^a-z]|$)/.test(n)) return 'pdf';
    if (m.indexOf('text/') === 0 || /\.(txt|csv)$/.test(n)) return 'text';
    return '';
  }

  function attachViewUrl_(fileId, fallbackUrl) {
    if (fallbackUrl && String(fallbackUrl).indexOf('http') === 0) return fallbackUrl;
    if (fileId) return 'https://drive.google.com/file/d/' + encodeURIComponent(fileId) + '/view';
    return '';
  }

  function attachNewTabHtml_(fileId, fallbackUrl, hintKey) {
    var viewUrl = attachViewUrl_(fileId, fallbackUrl);
    var hint = AppI18n.t(hintKey || 'log.previewOfficeHint');
    if (!viewUrl) return '<div class="attach-preview-empty">' + AppI18n.t('log.previewUnsupported') + '</div>';
    return '<div class="attach-preview-empty">' + hint +
      '<div style="margin-top:12px;"><a class="btn btn-primary" href="' + AppUtils.escapeHtml(viewUrl) +
      '" target="_blank" rel="noopener">' + AppI18n.t('log.openInNewTab') + '</a></div></div>';
  }

  function shouldInlineFetch_(name, mime, size) {
    return isPreviewableAttach_(name, mime) === 'image' && Number(size) <= 1.5 * 1024 * 1024;
  }

  function renderAttachmentsViewer_(res, folderUrl) {
    var body = document.getElementById('attachViewerBody');
    if (!body) return;
    var files = (res && res.files) || [];
    var url = (res && res.folderUrl) || folderUrl || '';
    attachViewerFolderUrl_ = url;
    if (!files.length) {
      setAttachPreviewHtml_('<div class="attach-preview-empty">' + AppI18n.t('log.oldAttachMissing') + '</div>');
      body.innerHTML = '<div class="edit-attach-current text-muted">' + AppI18n.t('log.oldAttachMissing') + '</div>';
      return;
    }
    var html = files.map(function(f) {
      var sizeLabel = '';
      if (f.size > 1024 * 1024) sizeLabel = (f.size / (1024 * 1024)).toFixed(1) + ' MB';
      else sizeLabel = Math.max(1, Math.round(f.size / 1024)) + ' KB';
      var safeUrl = encodeURIComponent(url);
      var safeId = encodeURIComponent(f.id || '');
      var safeFileUrl = encodeURIComponent(f.url || '');
      var safeName = encodeURIComponent(f.name || '');
      var safeMime = encodeURIComponent(f.mime || '');
      var safeSize = encodeURIComponent(String(f.size || 0));
      return '<div class="edit-attach-file" data-file-id="' + AppUtils.escapeHtml(f.id || '') + '">' +
        '<div class="edit-attach-file-meta">' +
        '<span class="edit-attach-file-name">' + AppUtils.escapeHtml(f.name || 'file') + '</span>' +
        '<span class="edit-attach-file-size">' + sizeLabel + '</span></div>' +
        '<button type="button" class="btn btn-primary" style="padding:6px 10px;font-size:12px;" onclick="previewAttachmentFromViewer(decodeURIComponent(\'' +
          safeUrl + '\'), decodeURIComponent(\'' + safeId + '\'), decodeURIComponent(\'' + safeFileUrl +
          '\'), decodeURIComponent(\'' + safeName + '\'), decodeURIComponent(\'' + safeMime +
          '\'), Number(decodeURIComponent(\'' + safeSize + '\')))">' +
        AppI18n.t('log.openAttachFile') + '</button>' +
        '</div>';
    }).join('');
    body.innerHTML = html;
    var firstImage = null;
    for (var i = 0; i < files.length; i++) {
      if (isPreviewableAttach_(files[i].name, files[i].mime) === 'image' && Number(files[i].size) <= 1.5 * 1024 * 1024) {
        firstImage = files[i];
        break;
      }
    }
    if (firstImage) {
      previewAttachmentFromViewer(url, firstImage.id, firstImage.url || '', firstImage.name || '', firstImage.mime || '', firstImage.size || 0);
    } else {
      setAttachPreviewHtml_('<div class="attach-preview-empty">' + AppI18n.t('log.previewHint') + '</div>');
    }
  }

  function blobFromAttachBase64_(base64, mime) {
    var bin = atob(base64 || '');
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime || 'application/octet-stream' });
  }

  function markActiveAttachFile_(fileId) {
    var body = document.getElementById('attachViewerBody');
    if (!body) return;
    Array.prototype.forEach.call(body.querySelectorAll('.edit-attach-file'), function(el) {
      el.classList.toggle('is-active', el.getAttribute('data-file-id') === fileId);
    });
  }

  function previewAttachmentFromViewer(folderUrl, fileId, fallbackUrl, fileName, mime, size) {
    markActiveAttachFile_(fileId);
    var kind = isPreviewableAttach_(fileName, mime);
    var hintKey = kind === 'pdf' ? 'log.previewPdfHint' : 'log.previewOfficeHint';
    var viewUrl = attachViewUrl_(fileId, fallbackUrl);
    if (!shouldInlineFetch_(fileName, mime, size)) {
      revokeAttachPreviewUrl_();
      if (viewUrl) {
        try { window.open(viewUrl, '_blank'); } catch (eOpen) {}
      }
      setAttachPreviewHtml_(attachNewTabHtml_(fileId, fallbackUrl, hintKey));
      return;
    }
    setAttachPreviewHtml_('<div class="attach-preview-empty">' + AppI18n.t('log.previewLoading') + '</div>');
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          setAttachPreviewHtml_(attachNewTabHtml_(fileId, fallbackUrl || (res && res.url), 'log.previewUnsupported'));
          return;
        }
        try {
          revokeAttachPreviewUrl_();
          var blob = blobFromAttachBase64_(res.base64 || '', res.mime || mime || 'image/jpeg');
          attachViewerBlobUrl_ = URL.createObjectURL(blob);
          setAttachPreviewHtml_('<img alt="" src="' + attachViewerBlobUrl_ + '">');
        } catch (e) {
          setAttachPreviewHtml_(attachNewTabHtml_(fileId, (res && res.url) || fallbackUrl, 'log.previewUnsupported'));
        }
      })
      .withFailureHandler(function() {
        setAttachPreviewHtml_(attachNewTabHtml_(fileId, fallbackUrl, 'log.previewUnsupported'));
      })
      .getTransactionAttachmentFile(AppLayout.getSession(), folderUrl, fileId);
  }

  function displayCurrency(v) {
    if (typeof currencyLabel === 'function') return currencyLabel(v);
    return v || '—';
  }

  function displayAdvanceCurrency(row) {
    if (row && row.advType === 'تصريف') {
      return displayCurrency(row.fromCurrency) + ' → ' + displayCurrency(row.toCurrency);
    }
    return displayCurrency(row && row.currency);
  }

  function displayFund(v) {
    if (v === 'الخزنة') return AppI18n.t('fund.vault');
    if (v === 'شام كاش') return AppI18n.t('fund.sham');
    if (v === 'السلف') return AppI18n.t('fund.advances');
    if (v === 'البنك') return AppI18n.t('fund.bank');
    return v || '—';
  }

  function displayBorrower(v) {
    return (typeof borrowerLabel === 'function') ? borrowerLabel(v) : (v || '—');
  }

  function displayProject(v) {
    if (v === 'المكتب') return AppI18n.t('project.office');
    if (v === 'رأس مال') return AppI18n.t('project.capital');
    if (v === 'مزرعة الأبقار') return AppI18n.t('project.farm');
    if (v === 'محلات الصناعة') return AppI18n.t('project.shops');
    return v || '—';
  }

  function displayExType(v) {
    if (v === 'شراء') return AppI18n.t('exchange.buy');
    if (v === 'بيع') return AppI18n.t('exchange.sell');
    return v || '—';
  }

  function displayAdvType(v) {
    if (v === 'صادر') return AppI18n.t('sidebar.outcome');
    if (v === 'تصريف') return AppI18n.t('sidebar.exchange');
    return v || '—';
  }

  function loadTransactions() {
    google.script.run
      .withSuccessHandler(function(data) {
        data = data || {};
        if (AppLayout.handleAuthResult(data)) return;
        window.recentTransactionsCache = {
          incomes: data.incomes || [],
          outcomes: data.outcomes || [],
          exchanges: data.exchanges || [],
          transfers: data.transfers || [],
          advances: data.advances || []
        };
        Object.keys(LOG_META).forEach(function(tbodyId) {
          var meta = LOG_META[tbodyId];
          var tbody = document.getElementById(tbodyId);
          if (tbody && tbody.dataset.advanced === 'true') return;
          renderTable(tbodyId, window.recentTransactionsCache[meta.cat], meta.type);
        });
      })
      .getRecentTransactions(AppLayout.getSession());
  }

  function rerenderAllLogTables() {
    Object.keys(LOG_META).forEach(function(tbodyId) {
      var meta = LOG_META[tbodyId];
      var tbody = document.getElementById(tbodyId);
      if (!tbody) return;
      var rows = tbody.dataset.advanced === 'true'
        ? (window.advancedSearchCache && window.advancedSearchCache[meta.cat]) || []
        : window.recentTransactionsCache[meta.cat] || [];
      renderTable(tbodyId, rows, meta.type);
      var searchEl = document.getElementById(meta.search);
      if (searchEl && searchEl.value) filterSpecificTable(tbodyId, meta.search, meta.reset);
      else updateResultsCount(tbodyId);
    });
  }

  function tableColSpan(tableType) {
    if (tableType === 'EX') return 14;
    if (tableType === 'TR') return 16;
    if (tableType === 'AD') return 12;
    return 15;
  }

  function renderTable(tbodyId, rows, tableType) {
    var tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    tbody.innerHTML = '';
    var cols = tableColSpan(tableType);
    var esc = AppUtils.escapeHtml;
    var num = function(v) { return AppUtils.formatSignedNumberHtml(v); };

    if (!rows || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="' + cols + '" class="log-empty">' + AppI18n.t('log.noRecords') + '</td></tr>';
      updateResultsCount(tbodyId, 0);
      return;
    }

    rows.forEach(function(row) {
      var tr = document.createElement('tr');
      var safeRowStr = encodeURIComponent(JSON.stringify(row));
      var safeRef = encodeURIComponent(String(row.ref || ''));
      var actionBtns = '<div class="log-actions">' +
        '<button type="button" class="btn-log btn-log-details" onclick="openReceiptModal(decodeURIComponent(\'' + safeRowStr + '\'))">' + AppI18n.t('log.details') + '</button>';
      if (row.status === 'مكتملة') {
        actionBtns +=
          '<button type="button" class="btn-log btn-log-edit" onclick="openEditModal(decodeURIComponent(\'' + safeRowStr + '\'))">' + AppI18n.t('log.edit') + '</button>' +
          '<button type="button" class="btn-log btn-log-delete" onclick="openDeleteModal(decodeURIComponent(\'' + safeRef + '\'), decodeURIComponent(\'' + safeRowStr + '\'))">' + AppI18n.t('log.delete') + '</button>';
      } else {
        actionBtns += '<span class="log-locked">' + AppI18n.t('log.locked') + '</span>';
      }
      actionBtns += '</div>';

      if (tableType === 'IN' || tableType === 'OUT') {
        var fundInOut = displayFund(row.fund);
        if (row.fund === 'البنك' && row.bank && row.bank !== '-') fundInOut += ' · ' + row.bank;
        tr.innerHTML =
          '<td><b>' + esc(row.seq) + '</b></td>' +
          '<td>' + esc(row.trxDate || row.dateStr) + '</td>' +
          '<td>' + esc(row.sysDate || '—') + '</td>' +
          '<td>' + esc(displayProject(row.project)) + '</td>' +
          '<td>' + esc(row.description || row.notes) + '</td>' +
          '<td>' + esc(fundInOut) + '</td>' +
          '<td>' + esc(row.sender) + '</td>' +
          '<td>' + esc(row.receiver) + '</td>' +
          '<td>' + esc(displayCurrency(row.currency)) + '</td>' +
          '<td>' + num(row.qty) + '</td>' +
          '<td>' + num(row.amount) + '</td>' +
          '<td><b>' + num(row.total) + '</b></td>' +
          '<td>' + attachHtml(row.link) + '</td>' +
          '<td>' + statusBadgeHtml(row.status) + '</td>' +
          '<td>' + actionBtns + '</td>';
      } else if (tableType === 'EX') {
        var fundEx = displayFund(row.fund);
        if (row.fund === 'البنك' && row.bank && row.bank !== '-') fundEx += ' · ' + row.bank;
        tr.innerHTML =
          '<td><b>' + esc(row.seq) + '</b></td>' +
          '<td>' + esc(row.trxDate || row.dateStr) + '</td>' +
          '<td>' + esc(row.sysDate || '—') + '</td>' +
          '<td>' + esc(fundEx) + '</td>' +
          '<td>' + esc(displayExType(row.exType)) + '</td>' +
          '<td>' + esc(displayCurrency(row.paidCur)) + '</td>' +
          '<td>' + esc(displayCurrency(row.recCur)) + '</td>' +
          '<td>' + num(row.exAmt) + '</td>' +
          '<td>' + num(row.exRate) + '</td>' +
          '<td><b>' + num(row.total) + '</b></td>' +
          '<td>' + esc(row.notes) + '</td>' +
          '<td>' + attachHtml(row.link) + '</td>' +
          '<td>' + statusBadgeHtml(row.status) + '</td>' +
          '<td>' + actionBtns + '</td>';
      } else if (tableType === 'TR') {
        var fromFundLabel = displayFund(row.fromFund);
        if (row.fromFund === 'البنك' && row.fromBank && row.fromBank !== '-') {
          fromFundLabel += ' · ' + row.fromBank;
        }
        var toFundLabel = displayFund(row.toFund);
        if (row.toFund === 'البنك' && row.toBank && row.toBank !== '-') {
          toFundLabel += ' · ' + row.toBank;
        }
        tr.innerHTML =
          '<td><b>' + esc(row.seq) + '</b></td>' +
          '<td>' + esc(row.trxDate || row.dateStr) + '</td>' +
          '<td>' + esc(row.sysDate || '—') + '</td>' +
          '<td>' + esc(fromFundLabel) + '</td>' +
          '<td>' + esc(toFundLabel) + '</td>' +
          '<td>' + esc(displayCurrency(row.currency)) + '</td>' +
          '<td><b>' + num(row.amount) + '</b></td>' +
          '<td>' + esc(displayBorrower(row.borrower)) + '</td>' +
          '<td>' + esc(row.notes) + '</td>' +
          '<td>' + attachHtml(row.link) + '</td>' +
          '<td>' + statusBadgeHtml(row.status) + '</td>' +
          '<td>' + actionBtns + '</td>';
      } else if (tableType === 'AD') {
        tr.innerHTML =
          '<td><b>' + esc(row.seq) + '</b></td>' +
          '<td>' + esc(row.trxDate || row.dateStr) + '</td>' +
          '<td>' + esc(row.sysDate || '—') + '</td>' +
          '<td>' + esc(displayBorrower(row.borrower)) + '</td>' +
          '<td>' + esc(displayAdvType(row.advType)) + '</td>' +
          '<td>' + esc(displayProject(row.project)) + '</td>' +
          '<td>' + esc(displayAdvanceCurrency(row)) + '</td>' +
          '<td>' + num(row.qty) + '</td>' +
          '<td>' + num(row.amount) + '</td>' +
          '<td>' + num(row.exRate) + '</td>' +
          '<td><b>' + num(row.total) + '</b></td>' +
          '<td>' + esc(row.notes) + '</td>' +
          '<td>' + attachHtml(row.link) + '</td>' +
          '<td>' + statusBadgeHtml(row.status) + '</td>' +
          '<td>' + actionBtns + '</td>';
      }
      tbody.appendChild(tr);
    });
    updateResultsCount(tbodyId);
  }

  /* ===== بحث سريع ===== */
  function onQuickSearchInput(tbodyId, inputId, resetBtnId) {
    clearTimeout(LOG_SEARCH_DEBOUNCE[tbodyId]);
    LOG_SEARCH_DEBOUNCE[tbodyId] = setTimeout(function() {
      filterSpecificTable(tbodyId, inputId, resetBtnId);
    }, 200);
    toggleClearBtn(inputId);
  }

  function toggleClearBtn(inputId) {
    var btn = document.getElementById(inputId + '-clear');
    var input = document.getElementById(inputId);
    if (btn && input) btn.classList.toggle('hidden', !input.value);
  }

  function clearQuickSearch(tbodyId, inputId, resetBtnId) {
    var input = document.getElementById(inputId);
    if (input) input.value = '';
    toggleClearBtn(inputId);
    filterSpecificTable(tbodyId, inputId, resetBtnId);
  }

  function updateResultsCount(tbodyId, forced) {
    var meta = LOG_META[tbodyId];
    if (!meta) return;
    var el = document.getElementById(meta.count);
    if (!el) return;
    var count = forced;
    if (count === undefined) {
      var tbody = document.getElementById(tbodyId);
      count = 0;
      if (tbody) {
        Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr) {
          if (tr.classList.contains('empty-search-msg')) return;
          if (tr.cells.length < 3) return;
          if (tr.style.display === 'none') return;
          count++;
        });
      }
    }
    el.textContent = AppI18n.t('log.resultsCount').replace('{n}', String(count));
  }

  function filterSpecificTable(tbodyId, inputId, resetBtnId) {
    var filterText = (document.getElementById(inputId).value || '').toLowerCase();
    var tbody = document.getElementById(tbodyId);
    var trs = tbody.getElementsByTagName('tr');
    var resetBtn = document.getElementById(resetBtnId);
    var visibleCount = 0;
    var oldMsg = tbody.querySelector('.empty-search-msg');
    if (oldMsg) oldMsg.remove();

    for (var i = 0; i < trs.length; i++) {
      if (trs[i].cells.length < 3 || trs[i].classList.contains('empty-search-msg')) continue;
      var show = !filterText || trs[i].textContent.toLowerCase().indexOf(filterText) !== -1;
      trs[i].style.display = show ? '' : 'none';
      if (show) visibleCount++;
    }

    var advanced = tbody.dataset.advanced === 'true';
    if (resetBtn) resetBtn.classList.toggle('hidden', filterText === '' && !advanced);

    if (visibleCount === 0 && trs.length > 0) {
      var emptyTr = document.createElement('tr');
      emptyTr.className = 'empty-search-msg';
      emptyTr.innerHTML = '<td colspan="' + LOG_META[tbodyId].cols + '" class="log-empty-warn">' + AppI18n.t('log.noMatch') + '</td>';
      tbody.appendChild(emptyTr);
    }
    updateResultsCount(tbodyId, visibleCount);
    toggleClearBtn(inputId);
  }

  /* ===== بحث متقدم ===== */
  function openAdvancedSearch(tbodyId) {
    document.getElementById('adv-tbody').value = tbodyId;
    var host = document.getElementById('advanced-search-fields');
    host.innerHTML = buildAdvancedFieldsHtml(tbodyId);
    document.getElementById('advancedSearchModal').style.display = 'flex';
    AppI18n.apply(document.getElementById('advancedSearchModal'));
    setTimeout(function() { enhanceAdvancedSelects(tbodyId); }, 0);
  }

  function closeAdvancedSearch() {
    document.getElementById('advancedSearchModal').style.display = 'none';
  }

  function advSelectOptionLabel_(opt) {
    if (typeof opt === 'string') return opt;
    if (opt.i18n && typeof AppI18n !== 'undefined') return AppI18n.t(opt.i18n);
    return opt.value || opt.name || '';
  }

  function advSelect(id, options, placeholderKey) {
    var key = placeholderKey || 'select.all';
    var ph = (typeof AppI18n !== 'undefined') ? AppI18n.t(key) : 'الكل';
    var html = '<div class="app-select"><select id="' + id + '" multiple>';
    html += '<option value="" data-i18n="' + key + '">' + ph + '</option>';
    (options || []).forEach(function(opt) {
      if (opt == null) return;
      if (typeof opt === 'string') {
        html += '<option value="' + AppUtils.escapeHtml(opt) + '">' + AppUtils.escapeHtml(opt) + '</option>';
        return;
      }
      var value = opt.value || opt.name || '';
      if (!value) return;
      var label = advSelectOptionLabel_(opt);
      html += '<option value="' + AppUtils.escapeHtml(value) + '"' +

  function collectAdvancedFilters(tbodyId) {
    var f = {
      sysDateFrom: val('adv-sysFrom'),
      sysDateTo: val('adv-sysTo'),
      trxDateFrom: val('adv-trxFrom'),
      trxDateTo: val('adv-trxTo')
    };
    function val(id) {
      var el = document.getElementById(id);
      return el ? el.value : '';
    }
    function valMulti(id) {
      var el = document.getElementById(id);
      if (!el) return '';
      if (el.multiple) {
        return Array.from(el.selectedOptions).map(function(o) { return o.value; })
          .filter(function(v) { return !!v; }).join('|');
      }
      return el.value || '';
    }
    if (tbodyId === 'tbody-incomes' || tbodyId === 'tbody-outcomes') {
      f.project = valMulti('adv-project');
      f.sender = val('adv-sender');
      f.receiver = val('adv-receiver');
      f.currency = valMulti('adv-currency');
      f.fund = valMulti('adv-fund');
    } else if (tbodyId === 'tbody-exchanges') {
      f.exType = valMulti('adv-exType');
      f.paidCur = valMulti('adv-paidCur');
      f.recCur = valMulti('adv-recCur');
      f.fund = valMulti('adv-fund');
    } else if (tbodyId === 'tbody-transfers') {
      f.fromFund = valMulti('adv-fromFund');
      f.toFund = valMulti('adv-toFund');
      f.currency = valMulti('adv-currency');
      f.borrower = valMulti('adv-borrower');
    } else if (tbodyId === 'tbody-advances') {

    google.script.run
      .withSuccessHandler(function(results) {
        window.advancedSearchCache = window.advancedSearchCache || {};

        renderTable(tbodyId, results || [], meta.type);
        var searchEl = document.getElementById(meta.search);

  function syncAdvancedExportBtn_(tbodyId, show) {
    var meta = LOG_META[tbodyId];
    if (!meta) return;
    var btnId = 'export-adv-' + meta.cat;
    var btn = document.getElementById(btnId);
    if (!btn) {
      var resetBtn = document.getElementById(meta.reset);
      if (!resetBtn || !resetBtn.parentNode) return;
      btn = document.createElement('button');
      btn.type = 'button';
      btn.id = btnId;
      btn.className = 'btn btn-icon hidden';
      btn.setAttribute('data-i18n', 'log.exportSearch');
      btn.textContent = AppI18n.t('log.exportSearch');
      btn.onclick = function() { exportAdvancedSearchResults(tbodyId); };
      resetBtn.parentNode.insertBefore(btn, resetBtn);
    }
    btn.classList.toggle('hidden', !show);
    btn.textContent = AppI18n.t('log.exportSearch');
  }

  function exportAdvancedSearchResults(tbodyId) {
    var meta = LOG_META[tbodyId];
    if (!meta) return;
    var rows = (window.advancedSearchCache && window.advancedSearchCache[meta.cat]) || [];
    if (!rows.length) {
      showCustomAlert(AppI18n.t('log.noMatch'));
      return;
    }
    function csvEsc(v) {
      var s = String(v == null ? '' : v).replace(/"/g, '""');
      return '"' + s + '"';
    }
    var keys = Object.keys(rows[0]);
    var lines = [keys.map(csvEsc).join(',')];
    rows.forEach(function(row) {
      lines.push(keys.map(function(k) { return csvEsc(row[k]); }).join(','));
    });
    var bom = '\uFEFF';
    var blob = new Blob([bom + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'UNI_GATE_search_' + meta.cat + '_' + AppUtils.todayInputValue() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
  }

  function resetTableFilter(tbodyId, inputId, resetBtnId) {
    var meta = LOG_META[tbodyId];
    document.getElementById(inputId).value = '';
    toggleClearBtn(inputId);
    var tbody = document.getElementById(tbodyId);
    tbody.dataset.advanced = 'false';
    document.getElementById(resetBtnId).classList.add('hidden');
    syncAdvancedExportBtn_(tbodyId, false);
    if (window.advancedSearchCache) delete window.advancedSearchCache[meta.cat];
    var countEl = document.getElementById(meta.count);
    if (countEl) countEl.classList.remove('is-advanced');
    renderTable(tbodyId, window.recentTransactionsCache[meta.cat] || [], meta.type);
  }

  function loadEditAttachmentFiles_() {
    var urlEl = document.getElementById('edit-attach-url');
    var host = document.getElementById('edit-attach-files');
    if (!host) return;
    var folderUrl = urlEl ? urlEl.value : '';
    if (!folderUrl || folderUrl.indexOf('http') !== 0) {
      host.innerHTML = '<div class="edit-attach-current text-muted" data-i18n="edit.noAttach">' + AppI18n.t('edit.noAttach') + '</div>';
      return;
    }
    host.innerHTML = '<div class="edit-attach-loading">' + AppI18n.t('log.loading') + '</div>';
    google.script.run
      .withSuccessHandler(function(res) {
        renderEditAttachmentFiles_((res && res.files) || [], folderUrl);
      })
      .withFailureHandler(function() {
        host.innerHTML = '<a href="' + AppUtils.escapeHtml(folderUrl) + '" target="_blank" rel="noopener">' + AppI18n.t('log.viewAttachment') + '</a>';
      })
      .listTransactionAttachments(AppLayout.getSession(), folderUrl);
  }

  function renderEditAttachmentFiles_(files, folderUrl) {
    var host = document.getElementById('edit-attach-files');
    var urlEl = document.getElementById('edit-attach-url');
    if (!host) return;
    if (!files.length) {
      if (urlEl) urlEl.value = '';
      host.innerHTML = '<div class="edit-attach-current text-muted" data-i18n="edit.noAttach">' + AppI18n.t('edit.noAttach') + '</div>';
      return;
    }
    if (urlEl) urlEl.value = folderUrl || (urlEl.value || '');
    host.innerHTML = files.map(function(f) {
      var sizeLabel = f.size > 1024 * 1024
        ? (f.size / (1024 * 1024)).toFixed(1) + ' MB'
        : (Math.max(1, Math.round(f.size / 102.4)) / 10) + ' KB';
      return '<div class="edit-attach-file" data-file-id="' + AppUtils.escapeHtml(f.id) + '">' +
        '<div class="edit-attach-file-meta">' +
        '<a href="' + AppUtils.escapeHtml(f.url) + '" target="_blank" rel="noopener" class="edit-attach-file-name">' + AppUtils.escapeHtml(f.name) + '</a>' +
        '<span class="edit-attach-file-size">' + sizeLabel + '</span></div>' +
        '<button type="button" class="edit-attach-file-del" title="' + AppI18n.t('edit.removeOneAttach') + '" onclick="deleteEditAttachmentFile(\'' + AppUtils.escapeHtml(f.id) + '\')">×</button>' +
        '</div>';
    }).join('');
  }

  function deleteEditAttachmentFile(fileId) {
    var urlEl = document.getElementById('edit-attach-url');
    var folderUrl = urlEl ? urlEl.value : '';
    if (!folderUrl || !fileId) return;
    var btn = document.querySelector('.edit-attach-file[data-file-id="' + fileId + '"] .edit-attach-file-del');
    if (btn) btn.disabled = true;
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          showCustomAlert(AppI18n.t((res && res.messageKey) || 'edit.attachDeleteFail'));
          if (btn) btn.disabled = false;
          return;
        }
        if (res.empty && urlEl) urlEl.value = '';
        renderEditAttachmentFiles_(res.files || [], res.folderUrl || folderUrl);
      })
      .withFailureHandler(function() {
        showCustomAlert(AppI18n.t('edit.attachDeleteFail'));
        if (btn) btn.disabled = false;
      })
      .deleteTransactionAttachmentFile(AppLayout.getSession(), folderUrl, fileId);
  }

      '<input type="text" class="input-amount" id="edit-exRate" value="' + escAttr(rate) + '">' +
      '<small class="field-hint" data-i18n="form.exchangeRateHint">ليرة سورية مقابل دولار واحد</small></div>';
    html += '<div class="form-group"><label><span data-i18n="form.total">الإجمالي</span>' +
      '<span class="field-cur" id="edit-total-cur"></span></label>' +
      '<input type="text" class="input-amount" id="edit-exTotal" readonly style="font-weight:700;color:var(--primary-color);"></div>';
    return html;
  }

  function editExchangeContext_() {
    if (EDIT_EX_KIND === 'EX') {
      var isBuy = val('edit-exType') === 'شراء';
      return {
        amountId: 'edit-exAmt',
        from: isBuy ? 'ليرة سورية' : 'دولار',
        to: isBuy ? 'دولار' : 'ليرة سورية'
      };
    }
    if (EDIT_EX_KIND === 'AD') {
      return { amountId: 'edit-amount', from: val('edit-fromCurrency'), to: val('edit-toCurrency') };
    }
    return null;
  }

  function updateEditExchangePreview() {
    var ctx = editExchangeContext_();
    if (!ctx) return;
    AppUtils.setFieldCurrencyTag('edit-amount-cur', ctx.from);
    AppUtils.setFieldCurrencyTag('edit-total-cur', ctx.to);
    var total = AppUtils.convertByRate(numVal(ctx.amountId), numVal('edit-exRate'), ctx.from, ctx.to);
    var el = document.getElementById('edit-exTotal');
    if (el) el.value = total > 0 ? String(AppUtils.formatSignedNumber(total)).replace(/[()]/g, '') : '';
  }

  function wireEditExchangeFields_(row) {
    EDIT_EX_KIND = null;
    if (row.typeName === 'تصريف') EDIT_EX_KIND = 'EX';
    else if (row.typeName === 'سلفة' && row.advType === 'تصريف') EDIT_EX_KIND = 'AD';
    if (!EDIT_EX_KIND) return;

    ['edit-exAmt', 'edit-amount', 'edit-exRate'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', updateEditExchangePreview);
    });
    var exTypeEl = document.getElementById('edit-exType');
    if (exTypeEl) exTypeEl.addEventListener('change', updateEditExchangePreview);
    var fromEl = document.getElementById('edit-fromCurrency');
    var toEl = document.getElementById('edit-toCurrency');
    if (fromEl && toEl) {
      fromEl.addEventListener('change', function() {
        toEl.value = fromEl.value === 'دولار' ? 'ليرة سورية' : 'دولار';
        if (typeof AppSelect !== 'undefined') AppSelect.refresh('edit-toCurrency');
        updateEditExchangePreview();
      });
      toEl.addEventListener('change', updateEditExchangePreview);
    }
    updateEditExchangePreview();
  }

  /** يضمن بقاء القيمة الحالية في القائمة حتى لو لم تعد ضمن أماكن ظهور المشروع */
  function ensureEditOptionInList_(list, value) {
    var out = (list || []).slice();
    var v = value == null || value === '-' ? '' : String(value).trim();
    if (!v) return out;
    var found = out.some(function(p) {
      return (typeof p === 'string' ? p : p.value) === v;
    });
    if (!found) out.unshift({ value: v });
    return out;
  }

  function currencySelectHtml(id, selected, labelKey) {
    var opts = (typeof formCurrencyOptions === 'function')
      ? formCurrencyOptions()
      : [
          { value: 'دولار', i18n: 'currency.usd' },
          { value: 'ليرة سورية', i18n: 'currency.syp' }
        ];
    opts = ensureEditOptionInList_(opts, selected);
    var html = '<div class="form-group"><label data-i18n="' + (labelKey || 'form.currency') + '">العملة</label>' +
      '<div class="app-select"><select id="' + id + '">';
    opts.forEach(function(opt) {
      var value = typeof opt === 'string' ? opt : opt.value;
      var i18n = typeof opt === 'string' ? '' : (opt.i18n || '');
      var label = (i18n && typeof AppI18n !== 'undefined') ? AppI18n.t(i18n) : value;
      html += '<option value="' + AppUtils.escapeHtml(value) + '"' +
        (i18n ? ' data-i18n="' + i18n + '"' : '') +
        (value === selected ? ' selected' : '') + '>' +
        AppUtils.escapeHtml(label) + '</option>';
    });
    html += '</select></div></div>';
    return html;
  }

  function escAttr(v) {
    if (v === null || v === undefined || v === '-') return '';
    return AppUtils.escapeHtml(String(v));
  }

  function toDateInput(display) {
    if (!display || display === '-') return AppUtils.todayInputValue();
    var s = String(display).split(' ')[0];
    var p = s.split('/');
    if (p.length === 3) return p[2] + '-' + p[1] + '-' + p[0];
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    return AppUtils.todayInputValue();
  }

  function reasonSelectHtml(id, mode) {
    var opts = '<option value="" data-i18n="reason.pick">' +
      ((typeof AppI18n !== 'undefined') ? AppI18n.t('reason.pick') : 'اختر السبب') + '</option>' +
      '<option value="wrong_entry" data-i18n="reason.wrongEntry">إدخال خاطئ</option>';
    if (mode === 'delete') {
      opts += '<option value="duplicate" data-i18n="reason.duplicate">عملية مكررة</option>' +
        '<option value="cancelled" data-i18n="reason.cancelled">أُلغيت من الطرف الآخر</option>';
    } else {
      opts += '<option value="update_data" data-i18n="reason.updateData">تحديث بيانات</option>' +
        '<option value="fix_amount" data-i18n="reason.fixAmount">تصحيح مبلغ/عملة</option>';
    }
    opts += '<option value="other" data-i18n="reason.other">غيره</option>';
    var reasonLabel = isDirectMutateMode() ? 'reason.labelDirect' : 'reason.label';
    return '<div class="form-group"><label data-i18n="' + reasonLabel + '">سبب الطلب</label>' +
      '<div class="app-select"><select id="' + id + '">' + opts + '</select></div></div>';
  }

  function wireReasonToggle(selectId, wrapId) {
    var sel = document.getElementById(selectId);
    var wrap = document.getElementById(wrapId);
    if (!sel || !wrap) return;
    function sync() { wrap.classList.toggle('hidden', sel.value !== 'other'); }
    sel.addEventListener('change', sync);
    sync();
  }

  var REASON_AR = {
    wrong_entry: 'إدخال خاطئ',
    update_data: 'تحديث بيانات',
    fix_amount: 'تصحيح مبلغ/عملة',
    duplicate: 'عملية مكررة',
    cancelled: 'أُلغيت من الطرف الآخر'
  };

  function resolveReason(selectId, otherId) {
    var sel = document.getElementById(selectId);
    if (!sel || !sel.value) return null;
    if (sel.value === 'other') {
      var other = (document.getElementById(otherId) || {}).value || '';
      return other.trim() ? other.trim() : null;
    }
    return REASON_AR[sel.value] || null;
  }

  function closeModal() {
    document.getElementById('editModal').style.display = 'none';
    if (typeof AppUploader !== 'undefined') AppUploader.clear('edit-attachments');
  }

  function submitEditRequest() {
    var reason = resolveReason('edit-reason', 'edit-reason-other');
    if (!reason) {
      AppUtils.showMessageKey('modalMessage', 'reason.required', 'danger');
      return;
    }
    var ref = document.getElementById('edit-ref').value;
    var oldData = JSON.parse(document.getElementById('edit-old-data').value);
    var empName = sessionStorage.getItem('currentUser') || 'موظف';
    var typeName = oldData.typeName;
    var newData = { trxDate: (document.getElementById('edit-trxDate') || {}).value || '', reason: reason };

    if (typeName === 'وارد' || typeName === 'صادر') {
      newData.project = val('edit-project');
      newData.currency = val('edit-currency');
      newData.description = val('edit-description');
      newData.sender = val('edit-sender');
      newData.receiver = val('edit-receiver');
      newData.qty = numVal('edit-qty');
      newData.amount = numVal('edit-amount');
      newData.notes = val('edit-notes');
    } else if (typeName === 'تصريف') {
      newData.exType = val('edit-exType');
      newData.exAmt = numVal('edit-exAmt');
      newData.exRate = numVal('edit-exRate');
      newData.notes = val('edit-notes');
    } else if (typeName === 'تحويل') {
      newData.currency = val('edit-currency');
      newData.amount = numVal('edit-amount');
      newData.notes = val('edit-notes');
    } else if (typeName === 'سلفة') {
      // كل نوع يرسل حقوله فقط حتى لا تُسجَّل «تغييرات» وهمية على حقول النوع الآخر
      if (oldData.advType === 'تصريف') {
        newData.fromCurrency = val('edit-fromCurrency');
        newData.toCurrency = val('edit-toCurrency');
        newData.amount = numVal('edit-amount');
        newData.exRate = numVal('edit-exRate');
      } else {
        newData.project = val('edit-project');
        newData.currency = val('edit-currency');
        newData.description = val('edit-description');
        newData.receiver = val('edit-receiver');
        newData.qty = numVal('edit-qty');
        newData.amount = numVal('edit-amount');
      }
      newData.notes = val('edit-notes');
    }

    var removeEl = document.getElementById('edit-remove-attach');
    if (removeEl && removeEl.checked) newData.removeAttach = true;
    var attachUrlEl = document.getElementById('edit-attach-url');
    var existingAttach = attachUrlEl ? attachUrlEl.value : '';
    if (existingAttach && existingAttach.indexOf('http') === 0) {
      newData.existingAttach = existingAttach;
      newData.attach = existingAttach;
    } else if (!existingAttach && oldData.link && String(oldData.link).indexOf('http') === 0) {
      // حُذفت كل الملفات من المجلد
      newData.removeAttach = true;
    }

    AppUtils.setLoadingState('btn-confirm-edit', true, AppI18n.t('form.savingServer'));

    var send = function(attachments) {
      attachments = attachments || [];
      if (attachments.length > AppUploader.MAX_FILES) {
        AppUtils.setLoadingState('btn-confirm-edit', false, '', AppI18n.t(isDirectMutateMode() ? 'edit.submitDirect' : 'edit.submit'));
        AppUtils.showMessageKey('modalMessage', 'form.err.maxAttachments', 'danger');
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(handleActionResponse)
        .withFailureHandler(handleActionError);
      if (isDirectMutateMode()) {
        runner.applyDirectAction(AppLayout.getSession(), ref, 'تعديل', newData, reason, attachments);
      } else {
        runner.requestAction(AppLayout.getSession(), ref, 'تعديل', oldData, newData, empName, reason, attachments);
      }
    };

    if (typeof AppUploader === 'undefined') {
      send([]);
      return;
    }
    AppUploader.toAttachments('edit-attachments').then(send).catch(function() {
      AppUtils.setLoadingState('btn-confirm-edit', false, '', AppI18n.t(isDirectMutateMode() ? 'edit.submitDirect' : 'edit.submit'));
      AppUtils.showMessageKey('modalMessage', 'form.err.connection', 'danger');
    });
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value : '';
  }
  function numVal(id) {
    var n = AppUtils.parseFormattedNumber(val(id));
    return n === '' ? '' : n;
  }

  /* ===== حذف ===== */
  function openDeleteModal(ref, rowJson) {
    pendingDeletePayload = { ref: ref, row: JSON.parse(rowJson) };
    var host = document.getElementById('delete-reason-fields');
    host.innerHTML = reasonSelectHtml('delete-reason', 'delete') +
      '<div class="form-group hidden" id="delete-reason-other-wrap"><label data-i18n="reason.otherDetail">تفاصيل السبب</label><input type="text" id="delete-reason-other"></div>';
    wireReasonToggle('delete-reason', 'delete-reason-other-wrap');
    applyMutateModalLabels('delete');
    document.getElementById('deleteModal').style.display = 'flex';
    AppUtils.hideMessage('deleteModalMessage');
    AppI18n.apply(document.getElementById('deleteModal'));
    AppSelect.destroy('delete-reason');
    AppSelect.enhance('delete-reason');
  }

  function closeDeleteModal() {
    document.getElementById('deleteModal').style.display = 'none';
    pendingDeletePayload = null;
  }

  function submitDeleteRequest() {
    if (!pendingDeletePayload) return;
    var reason = resolveReason('delete-reason', 'delete-reason-other');
    if (!reason) {
      AppUtils.showMessageKey('deleteModalMessage', 'reason.required', 'danger');
      return;
    }
    var payload = pendingDeletePayload;
    var confirmKey = isDirectMutateMode() ? 'delete.confirmMsgDirect' : 'delete.confirmMsg';
    var deleteBtnKey = isDirectMutateMode() ? 'log.deleteSubmitDirect' : 'log.deleteSubmit';
    showCustomConfirm(AppI18n.t(confirmKey), function() {
      var empName = sessionStorage.getItem('currentUser') || 'موظف';
      AppUtils.setLoadingState('btn-confirm-delete', true, AppI18n.t('form.savingServer'));
      var runner = google.script.run
        .withSuccessHandler(function(res) {
          AppUtils.setLoadingState('btn-confirm-delete', false, '', AppI18n.t(deleteBtnKey));
          if (AppLayout.handleAuthResult(res)) return;
          closeDeleteModal();
          var okKey = isDirectMutateMode() ? 'log.deletedDirect' : 'log.requestSent';
          showCustomAlert(AppI18n.t(res.messageKey || (res.success ? okKey : 'log.err.notFound')));
          if (res.success) {
            updateSafeBalances();
            loadTransactions();
            if (typeof checkNotificationsBadge === 'function') checkNotificationsBadge();
            if (typeof invalidateNotifCache_ === 'function') invalidateNotifCache_();
          }
        })
        .withFailureHandler(function() {
          AppUtils.setLoadingState('btn-confirm-delete', false, '', AppI18n.t(deleteBtnKey));
          AppUtils.showMessageKey('deleteModalMessage', 'form.err.connection', 'danger');
        });
      if (isDirectMutateMode()) {
        runner.applyDirectAction(AppLayout.getSession(), payload.ref, 'حذف', null, reason);
      } else {
        runner.requestAction(AppLayout.getSession(), payload.ref, 'حذف', payload.row, null, empName, reason);
      }
    });
  }

  function handleActionResponse(response) {
    var editBtnKey = isDirectMutateMode() ? 'edit.submitDirect' : 'edit.submit';
    AppUtils.setLoadingState('btn-confirm-edit', false, '', AppI18n.t(editBtnKey));
    if (AppLayout.handleAuthResult(response)) return;
    if (response.success) {
      closeModal();
      var okKey = isDirectMutateMode() ? 'log.editedDirect' : 'log.requestSent';
      showCustomAlert(AppI18n.t(response.messageKey || okKey));
      updateSafeBalances();
      loadTransactions();
      if (typeof checkNotificationsBadge === 'function') checkNotificationsBadge();
      if (typeof invalidateNotifCache_ === 'function') invalidateNotifCache_();
    } else {
      AppUtils.showMessageKey('modalMessage', response.messageKey || 'log.err.notFound', 'danger');
    }
  }

  function handleActionError() {
    var editBtnKey = isDirectMutateMode() ? 'edit.submitDirect' : 'edit.submit';
    AppUtils.setLoadingState('btn-confirm-edit', false, '', AppI18n.t(editBtnKey));
    AppUtils.showMessageKey('modalMessage', 'form.err.connection', 'danger');
  }

  /* توافق أسماء قديمة */
  function openDateModal(tbodyId) { openAdvancedSearch(tbodyId); }
  function closeDateModal() { closeAdvancedSearch(); }
  function applyDateFilter() { applyAdvancedSearch(); }
  function requestDelete(ref, rowJson) { openDeleteModal(ref, rowJson); }

  if (typeof AppI18n !== 'undefined' && AppI18n.onChange) {
    AppI18n.onChange(function() {
      rerenderAllLogTables();
    });
  }
</script>
