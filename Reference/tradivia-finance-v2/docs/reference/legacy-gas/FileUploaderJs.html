<script>
  /**
   * AppUploader — رافع ملفات متعدد حديث متوافق مع Google Apps Script
   * يدعم الصور (ضغط JPEG) وباقي الصيغ (PDF/Word/Excel...) كـ Base64 خام.
   */
  const AppUploader = {
    _instances: {},
    MAX_FILES: 8,
    MAX_FILE_BYTES: 4.5 * 1024 * 1024,

    /**
     * يبني واجهة الرفع داخل حاوية ويستبدل/يربط input file مخفي
     * @param {string} containerId
     * @param {string} inputId
     */
    mount: function(containerId, inputId) {
      const container = document.getElementById(containerId);
      if (!container) return null;

      let input = document.getElementById(inputId);
      if (!input) {
        input = document.createElement('input');
        input.type = 'file';
        input.id = inputId;
        input.multiple = true;
        input.className = 'app-uploader-native';
        container.appendChild(input);
      }

      input.classList.add('app-uploader-native');
      input.setAttribute('multiple', 'multiple');
      input.accept = '.jpg,.jpeg,.png,.gif,.webp,.bmp,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip,.rar,image/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

      const self = this;
      container.innerHTML = '';
      container.classList.add('app-uploader');
      container.dataset.inputId = inputId;

      container.innerHTML =
        '<div class="app-uploader-dropzone" tabindex="0" role="button" aria-label="upload">' +
        '  <div class="app-uploader-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 15.01l1.41 1.41L11 14.84V19h2v-4.16l1.59 1.59L16 15.01 12.01 11 8 15.01z"/></svg></div>' +
        '  <div class="app-uploader-copy">' +
        '    <div class="app-uploader-title" data-i18n="uploader.title">اسحب الملفات هنا أو انقر للاختيار</div>' +
        '    <div class="app-uploader-hint" data-i18n="uploader.hint">صور، PDF، Word، Excel وغيرها — حتى 8 ملفات</div>' +
        '  </div>' +
        '</div>' +
        '<div class="app-uploader-list" id="' + inputId + '-list"></div>';

      container.appendChild(input);

      const dropzone = container.querySelector('.app-uploader-dropzone');
      const list = container.querySelector('.app-uploader-list');

      const instance = {
        id: inputId,
        container: container,
        input: input,
        dropzone: dropzone,
        list: list,
        files: []
      };
      this._instances[inputId] = instance;

      dropzone.addEventListener('click', function() { input.click(); });
      dropzone.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
      });

      ['dragenter', 'dragover'].forEach(function(evt) {
        dropzone.addEventListener(evt, function(e) {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.add('is-dragover');
        });
      });
      ['dragleave', 'drop'].forEach(function(evt) {
        dropzone.addEventListener(evt, function(e) {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.remove('is-dragover');
        });
      });
      dropzone.addEventListener('drop', function(e) {
        self._addFiles(instance, e.dataTransfer.files);
      });

      input.addEventListener('change', function() {
        self._addFiles(instance, input.files);
        input.value = '';
      });

      this._renderList(instance);
      if (typeof AppI18n !== 'undefined') AppI18n.apply(container);
      return instance;
    },

    clear: function(inputId) {
      const instance = this._instances[inputId];
      if (!instance) return;
      instance.files = [];
      this._renderList(instance);
    },

    getFiles: function(inputId) {
      const instance = this._instances[inputId];
      return instance ? instance.files.slice() : [];
    },

    toAttachments: function(inputId) {
      const self = this;
      const files = this.getFiles(inputId);
      return Promise.all(files.map(function(file) {
        return self._fileToAttachment(file);
      }));
    },

    _addFiles: function(instance, fileList) {
      if (!fileList || !fileList.length) return;
      const incoming = Array.prototype.slice.call(fileList);
      var skippedLarge = false;
      var skippedMax = false;
      for (let i = 0; i < incoming.length; i++) {
        const file = incoming[i];
        if (instance.files.length >= this.MAX_FILES) {
          skippedMax = true;
          break;
        }
        if (file.size > this.MAX_FILE_BYTES) {
          skippedLarge = true;
          continue;
        }
        const exists = instance.files.some(function(f) {
          return f.name === file.name && f.size === file.size && f.lastModified === file.lastModified;
        });
        if (!exists) instance.files.push(file);
      }
      this._renderList(instance);
      if (skippedLarge && typeof showCustomAlert === 'function') {
        showCustomAlert(AppI18n.t('uploader.tooLarge'));
      } else if (skippedMax && typeof showCustomAlert === 'function') {
        showCustomAlert(AppI18n.t('form.err.maxAttachments'));
      }
    },

    _removeFile: function(inputId, index) {
      const instance = this._instances[inputId];
      if (!instance) return;
      instance.files.splice(index, 1);
      this._renderList(instance);
    },

    _renderList: function(instance) {
      const self = this;
      if (!instance.files.length) {
        instance.list.innerHTML = '';
        instance.list.classList.add('is-empty');
        return;
      }
      instance.list.classList.remove('is-empty');
      instance.list.innerHTML = instance.files.map(function(file, idx) {
        const sizeKb = (file.size / 1024).toFixed(file.size > 1024 * 1024 ? 0 : 1);
        const sizeLabel = file.size > 1024 * 1024
          ? (file.size / (1024 * 1024)).toFixed(1) + ' MB'
          : sizeKb + ' KB';
        return '<div class="app-uploader-item">' +
          '<div class="app-uploader-item-meta">' +
          '<span class="app-uploader-item-name">' + AppUtils.escapeHtml(file.name) + '</span>' +
          '<span class="app-uploader-item-size">' + sizeLabel + '</span>' +
          '</div>' +
          '<button type="button" class="app-uploader-remove" data-idx="' + idx + '" title="remove">×</button>' +
          '</div>';
      }).join('');

      instance.list.querySelectorAll('.app-uploader-remove').forEach(function(btn) {
        btn.addEventListener('click', function() {
          self._removeFile(instance.id, Number(btn.getAttribute('data-idx')));
        });
      });
    },

    _fileToAttachment: function(file) {
      const self = this;
      if (file.type && file.type.indexOf('image/') === 0) {
        return self._compressImage(file).then(function(base64) {
          const safeName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
          return { name: safeName, type: 'image/jpeg', base64: base64 };
        }).catch(function() {
          return self._readRawBase64(file);
        });
      }
      return self._readRawBase64(file);
    },

    _readRawBase64: function(file) {
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const result = String(e.target.result || '');
          const base64 = result.indexOf(',') >= 0 ? result.split(',')[1] : result;
          resolve({
            name: file.name,
            type: file.type || 'application/octet-stream',
            base64: base64
          });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    },

    _compressImage: function(file) {
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX = 1400;
            let w = img.width, h = img.height;
            if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
            else { if (h > MAX) { w *= MAX / h; h = MAX; } }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.75).split(',')[1]);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
  };

  if (typeof AppI18n !== 'undefined' && AppI18n.onChange) {
    AppI18n.onChange(function() {
      Object.keys(AppUploader._instances).forEach(function(id) {
        var inst = AppUploader._instances[id];
        if (inst && inst.container) AppI18n.apply(inst.container);
      });
    });
  }
</script>
