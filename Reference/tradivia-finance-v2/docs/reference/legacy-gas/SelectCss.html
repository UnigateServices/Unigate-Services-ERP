<style>
  /* ===================================================================
     مكوّن القائمة المنسدلة المخصصة (AppSelect) — موحّد لكل النظام
     يعتمد بالكامل على متغيرات الوضع الليلي/النهاري، لذا يتطابق تلقائياً مع الوضعين
  =================================================================== */
  .app-select {
    position: relative;
  }

  /* إخفاء الـ select الأصلي دائماً داخل .app-select (حتى قبل enhance)
     يمنع وميض القائمة الأصلية القبيحة أثناء التحميل */
  .app-select > select {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* هيكل مؤقت بنفس مقاس الزر حتى يكتمل enhance */
  .app-select:not(.is-enhanced) {
    min-height: 42px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background:
      radial-gradient(ellipse at top, var(--accent-soft) 0%, transparent 70%),
      var(--surface-color);
    box-shadow: 0 0 0 1px var(--accent-soft);
  }
  .app-select.is-enhanced {
    min-height: 0;
    border: none;
    background: transparent;
    box-shadow: none;
  }

  /* العنصر الأصلي (select) يبقى في الـ DOM لأغراض القيمة وإمكانية الوصول
     لكنه مخفي بصرياً تماماً ولا يستقبل أي تفاعل مباشر من المستخدم */
  .app-select-native {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
    opacity: 0 !important;
  }

  .app-select-trigger {
    width: 100%;
    box-sizing: border-box;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background:
      radial-gradient(ellipse at top, var(--accent-soft) 0%, transparent 70%),
      var(--surface-color);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    line-height: 1.6;
    cursor: pointer;
    box-shadow: 0 0 0 1px var(--accent-soft);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .app-select-trigger:focus,
  .app-select-trigger:focus-visible {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }

  .app-select.open .app-select-trigger {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }

  .app-select-trigger.disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .app-select-label {
    flex: 1;
    text-align: start;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.6;
    padding-bottom: 1px;
  }

  .app-select-label.placeholder {
    color: var(--text-muted);
  }

  .app-select-chevron {
    width: 14px;
    height: 14px;
    min-width: 14px;
    fill: var(--text-muted);
    transition: transform 0.2s, fill 0.2s;
  }

  .app-select.open .app-select-chevron {
    transform: rotate(180deg);
    fill: var(--primary-color);
  }

  .app-select-panel {
    position: absolute;
    top: calc(100% + 6px);
    inset-inline-start: 0;
    inset-inline-end: 0;
    background: var(--surface-color);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: 240px;
    overflow-y: auto;
    z-index: 500;
    margin: 0;
    padding: 6px;
    list-style: none;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
  }

  /* قائمة محمولة إلى body لتفادي القص داخل النوافذ ذات overflow */
  .app-select-panel.is-portal {
    position: fixed;
    inset-inline-start: auto;
    inset-inline-end: auto;
    z-index: 10050;
  }

  .app-select.open .app-select-panel,
  .app-select-panel.is-portal.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /* السكرول يُورَّث من التنسيق العام الموحّد */

  .app-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 7px;
    font-size: 14px;
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.15s;
  }

  .app-option:hover,
  .app-option.highlighted {
    background: var(--surface-hover);
  }

  .app-option.selected {
    color: var(--primary-color);
    font-weight: 700;
    background: rgba(0, 168, 107, 0.08);
  }

  .app-option .app-option-check {
    width: 14px;
    height: 14px;
    min-width: 14px;
    fill: var(--primary-color);
    opacity: 0;
  }

  .app-option.selected .app-option-check {
    opacity: 1;
  }

  .app-option-multi {
    gap: 10px;
    justify-content: flex-start;
  }

  .app-option-multi > span:not(.app-option-box) {
    flex: 1;
    min-width: 0;
  }

  .app-option-box {
    width: 16px;
    height: 16px;
    min-width: 16px;
    border: 1.5px solid var(--border-color, #c9d4ce);
    border-radius: 4px;
    background: var(--surface, #fff);
    box-sizing: border-box;
  }

  .app-option-multi.selected .app-option-box {
    border-color: var(--primary-color);
    background: var(--primary-color);
    position: relative;
  }

  .app-option-multi.selected .app-option-box::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .app-option-multi .app-option-check {
    display: none;
  }

  .app-select-multi .app-select-panel {
    max-height: 260px;
  }

  .app-select-empty {
    padding: 14px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
