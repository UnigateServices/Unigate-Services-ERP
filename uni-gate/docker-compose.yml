services:
  postgres:
    image: postgres:16-alpine
    container_name: unigate-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: unigate
      POSTGRES_PASSWORD: unigate
      POSTGRES_DB: unigate
    volumes:
      - unigate_pg_data:/var/lib/postgresql/data

volumes:
  unigate_pg_data:
